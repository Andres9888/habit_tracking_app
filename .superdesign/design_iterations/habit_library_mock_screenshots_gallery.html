<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Habit library mock — screenshots</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #111;
        color: #eee;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: #aaa;
        font-size: 0.9rem;
        max-width: 60ch;
      }
      .grid {
        display: grid;
        gap: 20px;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      }
      figure {
        margin: 0;
        background: #1a1a1a;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid #333;
      }
      figcaption {
        padding: 10px 12px;
        font-size: 0.8rem;
        color: #888;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <h1>Habit library mock — screenshots</h1>
    <p>
      Frames from the walkthrough video. If images do not show, open this file from the repo
      (double-click or “Open with Live Server”) so paths resolve to
      <code>screenshots/</code>.
    </p>
    <div class="grid">
      <figure>
        <img src="screenshots/frame_01_0.3s.png" alt="Mock ~0.3s" />
        <figcaption>Frame 1 — ~0.3s (top)</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_02_2s.png" alt="Mock ~2s" />
        <figcaption>Frame 2 — ~2s</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_03_5s.png" alt="Mock ~5s" />
        <figcaption>Frame 3 — ~5s</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_04_8s.png" alt="Mock ~8s" />
        <figcaption>Frame 4 — ~8s</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_05_11s.png" alt="Mock ~11s" />
        <figcaption>Frame 5 — ~11s</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_06_14s.png" alt="Mock ~14s" />
        <figcaption>Frame 6 — ~14s</figcaption>
      </figure>
      <figure>
        <img src="screenshots/frame_07_17s.png" alt="Mock ~17s" />
        <figcaption>Frame 7 — ~17s</figcaption>
      </figure>
    </div>
  </body>
</html>
