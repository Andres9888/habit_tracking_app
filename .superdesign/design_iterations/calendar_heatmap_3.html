<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Heatmap V3 - Refined Design</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif !important; }
    body { background: #1c1917; }

    /* Cell intensity based on streak length */
    .cell-empty { background: #f5f5f4; }
    .cell-day-1-6 { background: #6ee7b7; }
    .cell-day-7-13 { background: #34d399; }
    .cell-day-14-29 { background: #10b981; }
    .cell-day-30-plus { background: #059669; }

    .cell-today-pending {
      background: #fef3c7;
      border: 2px solid #fbbf24;
      animation: pulse 1.4s ease-in-out infinite;
    }
    .cell-today-done {
      background: #10b981;
      border: 2px solid #fbbf24;
    }
    .cell-future {
      background: #fafaf9;
      border: 1px dashed #d6d3d1;
      opacity: 0.4;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 4px rgba(251, 191, 36, 0); }
    }

    /* Streak chain effect - connected cells */
    .streak-start { border-radius: 4px 2px 2px 4px; }
    .streak-middle { border-radius: 2px; }
    .streak-end { border-radius: 2px 4px 4px 2px; }
    .streak-solo { border-radius: 4px; }

    .gradient-bg {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.3) 0%, white 50%, rgba(204, 251, 241, 0.3) 100%);
    }

    /* Edge fade gradients for scroll hint */
    .scroll-container {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      position: relative;
    }
    .scroll-container::-webkit-scrollbar {
      display: none;
    }
    .scroll-container::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 20px;
      background: linear-gradient(to right, white, transparent);
      z-index: 1;
      pointer-events: none;
    }
    .scroll-container::after {
      content: '';
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 20px;
      background: linear-gradient(to left, white, transparent);
      z-index: 1;
      pointer-events: none;
    }

    /* Row highlight on hover */
    .day-row:hover {
      background: rgba(16, 185, 129, 0.05);
    }

    /* Entry animation */
    @keyframes cellFadeIn {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }
    .cell {
      animation: cellFadeIn 0.2s ease-out backwards;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .cell:hover:not(.cell-future) {
      transform: scale(1.1);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 10;
    }

    /* Stagger animation delays for columns */
    .col-0 .cell { animation-delay: 0.18s; }
    .col-1 .cell { animation-delay: 0.165s; }
    .col-2 .cell { animation-delay: 0.15s; }
    .col-3 .cell { animation-delay: 0.135s; }
    .col-4 .cell { animation-delay: 0.12s; }
    .col-5 .cell { animation-delay: 0.105s; }
    .col-6 .cell { animation-delay: 0.09s; }
    .col-7 .cell { animation-delay: 0.075s; }
    .col-8 .cell { animation-delay: 0.06s; }
    .col-9 .cell { animation-delay: 0.045s; }
    .col-10 .cell { animation-delay: 0.03s; }
    .col-11 .cell { animation-delay: 0.015s; }
    .col-12 .cell { animation-delay: 0s; }

    /* Progress bar animation */
    @keyframes progressFill {
      from { width: 0%; }
      to { width: var(--progress-width); }
    }
    .progress-fill {
      animation: progressFill 0.8s ease-out 0.4s backwards;
    }

    /* First-time hint tooltip */
    @keyframes hintFade {
      0% { opacity: 0; transform: translateY(-5px); }
      10% { opacity: 1; transform: translateY(0); }
      90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 0; transform: translateY(-5px); }
    }
    .hint-tooltip {
      animation: hintFade 3s ease-in-out;
    }
  </style>
</head>
