<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archive v3 — Typography &amp; Spacing Polish</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Literata:ital,opsz,wght@0,7..72,200..900;1,7..72,200..900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif !important;
      background: #E8E2DB !important;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 0;
    }
    .literata { font-family: 'Literata', serif !important; }
    .mono { font-family: 'JetBrains Mono', monospace !important; }

    .phone {
      width: 390px; min-height: 844px; background: #FAF8F5;
      border-radius: 44px; overflow: hidden; position: relative;
      box-shadow: 0 25px 60px rgba(45,42,38,0.18), 0 8px 20px rgba(45,42,38,0.1);
      border: 8px solid #2D2A26; display: flex; flex-direction: column;
    }
    .phone::before {
      content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
      width: 126px; height: 34px; background: #2D2A26; border-radius: 0 0 20px 20px; z-index: 50;
    }

    .habit-card {
      background: #FFFFFF;
      border-radius: 20px;
      border: 1px solid rgba(221,216,210,0.5);
      box-shadow: 0 1px 2px rgba(45,42,38,0.04), 0 4px 12px rgba(45,42,38,0.06);
      overflow: hidden;
      position: relative;
    }

    .strength-track { height: 3px; border-radius: 2px; background: #F0ECE6; }
    .strength-fill { height: 3px; border-radius: 2px; }

    .btn-resume {
      background: #059669; color: #fff; border: none; border-radius: 14px;
      font-size: 15px; font-weight: 600; letter-spacing: -0.1px; cursor: pointer;
      height: 48px; display: flex; align-items: center; justify-content: center; gap: 8px;
      flex: 1;
      box-shadow: 0 1px 2px rgba(5,150,105,0.2), 0 4px 12px rgba(5,150,105,0.15);
    }
    .btn-delete-icon {
      width: 48px; height: 48px; border-radius: 14px;
      border: 1.5px solid rgba(181,48,48,0.15);
      background: transparent; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .accent-strip { position: absolute; left: 0; top: 0; bottom: 0; width: 4px; border-radius: 20px 0 0 20px; }

    .scroll { overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
    .scroll::-webkit-scrollbar { display: none; }

    @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .anim { animation: fadeUp 320ms cubic-bezier(0.22,1,0.36,1) forwards; opacity: 0; }
    .anim:nth-child(1) { animation-delay: 0ms; }
    .anim:nth-child(2) { animation-delay: 60ms; }
    .anim:nth-child(3) { animation-delay: 120ms; }

    /* Stat line */
    .stat-line { display: flex; align-items: center; }
    .stat-pct { font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 16px; font-weight: 600; color: #6E6660; }
    .stat-label { font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 16px; color: #B5AFA8; letter-spacing: 0; }
    .stat-val { font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 16px; font-weight: 600; color: #6E6660; letter-spacing: 0; }
    .stat-dot { width: 3px; height: 3px; border-radius: 2px; background: #F0ECE6; margin: 0 8px; }
    .stat-muted { font-family: 'DM Sans', sans-serif; font-size: 12px; line-height: 16px; color: #CCC5BD; letter-spacing: 0; }
  </style>
</head>
<body>

  <div class="phone">
    <!-- Safe area -->
    <div style="height: 54px;"></div>

    <!-- Header -->
    <div style="padding: 0 16px 0 16px;">
      <!-- Nav row -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px;">
        <button style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; opacity: 0.5;">
          <i data-lucide="chevron-left" style="width: 24px; height: 24px; color: #2D2A26;"></i>
        </button>
        <button style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; opacity: 0.5;">
          <i data-lucide="x" style="width: 20px; height: 20px; color: #2D2A26;"></i>
        </button>
      </div>
      <!-- Title block -->
      <div style="padding: 0 4px 4px 4px;">
        <h1 class="literata" style="font-size: 24px; font-weight: 700; color: #2D2A26; letter-spacing: -0.5px; line-height: 30px;">Archived Habits</h1>
        <p style="font-size: 14px; line-height: 20px; color: #9B958E; margin-top: 6px; letter-spacing: -0.1px;">3 habits paused · tap to bring them back</p>
      </div>
    </div>

    <!-- 16px gap before cards -->
    <div style="height: 16px;"></div>

    <!-- Scrollable cards -->
    <div class="scroll" style="padding: 0 16px 32px 16px;">

      <!-- Card 1: Meditation — 72% strong -->
      <div class="habit-card anim">
        <div class="accent-strip" style="background: #7B52C4;"></div>
        <div style="padding: 20px 20px 18px 24px;">

          <!-- Header: icon + name + date -->
          <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
            <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(123,82,196,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span style="font-size: 24px; line-height: 28px;">🧘</span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 16px; font-weight: 600; color: #2D2A26; letter-spacing: -0.2px; line-height: 20px;">Meditation</div>
              <div style="font-size: 12px; line-height: 16px; color: #B5AFA8; margin-top: 3px; letter-spacing: 0.1px;">Archived 2 weeks ago</div>
            </div>
          </div>

          <!-- Strength bar -->
          <div style="margin-bottom: 14px;">
            <div class="strength-track" style="margin-bottom: 10px;">
              <div class="strength-fill" style="width: 72%; background: linear-gradient(90deg, #059669, #10B981);"></div>
            </div>
            <!-- Stat line -->
            <div class="stat-line">
              <span class="stat-pct">72%</span>
              <span class="stat-label">&nbsp;strength</span>
              <span class="stat-dot"></span>
              <span class="stat-val">14d streak</span>
              <span class="stat-dot"></span>
              <span class="stat-val">89</span>
              <span class="stat-label">&nbsp;done</span>
            </div>
          </div>

          <!-- Buttons: Resume + Delete icon -->
          <div style="display: flex; gap: 10px;">
            <button class="btn-resume">
              <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
              Resume
            </button>
            <button class="btn-delete-icon">
              <i data-lucide="trash-2" style="width: 16px; height: 16px; color: #B53030;"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 14px gap -->
      <div style="height: 14px;"></div>

      <!-- Card 2: Reading — 45% building -->
      <div class="habit-card anim">
        <div class="accent-strip" style="background: #3B82F6;"></div>
        <div style="padding: 20px 20px 18px 24px;">
          <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
            <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(59,130,246,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span style="font-size: 24px; line-height: 28px;">📚</span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 16px; font-weight: 600; color: #2D2A26; letter-spacing: -0.2px; line-height: 20px;">Read 30 Minutes</div>
              <div style="font-size: 12px; line-height: 16px; color: #B5AFA8; margin-top: 3px; letter-spacing: 0.1px;">Archived 1 month ago</div>
            </div>
          </div>
          <div style="margin-bottom: 14px;">
            <div class="strength-track" style="margin-bottom: 10px;">
              <div class="strength-fill" style="width: 45%; background: linear-gradient(90deg, #EAB308, #FACC15);"></div>
            </div>
            <div class="stat-line">
              <span class="stat-pct">45%</span>
              <span class="stat-label">&nbsp;strength</span>
              <span class="stat-dot"></span>
              <span class="stat-muted">no streak</span>
              <span class="stat-dot"></span>
              <span class="stat-val">34</span>
              <span class="stat-label">&nbsp;done</span>
            </div>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn-resume">
              <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
              Resume
            </button>
            <button class="btn-delete-icon">
              <i data-lucide="trash-2" style="width: 16px; height: 16px; color: #B53030;"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- 14px gap -->
      <div style="height: 14px;"></div>

      <!-- Card 3: Exercise — 12% fading -->
      <div class="habit-card anim">
        <div class="accent-strip" style="background: #EF4444;"></div>
        <div style="padding: 20px 20px 18px 24px;">
          <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 14px;">
            <div style="width: 44px; height: 44px; border-radius: 14px; background: rgba(239,68,68,0.08); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
              <span style="font-size: 24px; line-height: 28px;">🏋️</span>
            </div>
            <div style="flex: 1; min-width: 0;">
              <div style="font-size: 16px; font-weight: 600; color: #2D2A26; letter-spacing: -0.2px; line-height: 20px;">Exercise</div>
              <div style="font-size: 12px; line-height: 16px; color: #B5AFA8; margin-top: 3px; letter-spacing: 0.1px;">Archived 3 months ago</div>
            </div>
          </div>
          <div style="margin-bottom: 14px;">
            <div class="strength-track" style="margin-bottom: 10px;">
              <div class="strength-fill" style="width: 12%; background: linear-gradient(90deg, #EF4444, #F87171);"></div>
            </div>
            <div class="stat-line">
              <span class="stat-pct">12%</span>
              <span class="stat-label">&nbsp;strength</span>
              <span class="stat-dot"></span>
              <span class="stat-muted">no streak</span>
              <span class="stat-dot"></span>
              <span class="stat-val">156</span>
              <span class="stat-label">&nbsp;done</span>
            </div>
          </div>
          <div style="display: flex; gap: 10px;">
            <button class="btn-resume">
              <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
              Resume
            </button>
            <button class="btn-delete-icon">
              <i data-lucide="trash-2" style="width: 16px; height: 16px; color: #B53030;"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Delete all footer -->
      <div class="anim" style="text-align: center; padding: 20px 0 8px 0;">
        <span style="font-size: 13px; color: #B5AFA8; cursor: pointer;">Delete all archived habits</span>
      </div>

    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
