<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived Habits — Full Card with Prominent CTA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif !important;
    background: #F5F1ED !important;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 0;
  }

  h1, h2, h3 {
    font-family: 'Literata', serif !important;
  }

  .app-viewport {
    width: 390px;
    min-height: 100vh;
    background: #F5F1ED;
    position: relative;
    overflow-x: hidden;
  }

  /* ── Sticky Header ── */
  .sticky-header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: #F5F1ED;
    padding: 16px 20px 12px;
    border-bottom: 1px solid rgba(45, 42, 38, 0.06);
  }

  .header-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    background: rgba(45, 42, 38, 0.06);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
    color: #2D2A26;
    flex-shrink: 0;
  }

  .header-btn:hover {
    background: rgba(45, 42, 38, 0.12);
  }

  .header-title {
    font-family: 'Literata', serif !important;
    font-size: 22px !important;
    font-weight: 700 !important;
    color: #2D2A26 !important;
    flex: 1;
    text-align: center;
    line-height: 1.2;
  }

  .header-meta-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 8px;
  }

  .header-subtitle {
    font-size: 14px !important;
    color: #6E6660 !important;
    font-weight: 400 !important;
  }

  .select-btn {
    font-size: 15px;
    font-weight: 600;
    color: #059669;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 8px;
    transition: background 0.2s;
    font-family: 'DM Sans', sans-serif !important;
  }

  .select-btn:hover {
    background: rgba(5, 150, 105, 0.08);
  }

  /* ── Cards Container ── */
  .cards-list {
    padding: 16px 20px 40px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* ── Habit Card ── */
  .habit-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 24px;
    padding-left: 28px;
    box-shadow: 0 2px 8px rgba(45, 42, 38, 0.06);
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(20px);
  }

  .habit-card.card-visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.35s ease-out, transform 0.35s ease-out;
  }

  .habit-card.exiting {
    opacity: 0;
    transform: translateY(-16px) scale(0.97);
    max-height: 0;
    padding-top: 0;
    padding-bottom: 0;
    margin-bottom: -16px;
    transition: all 0.4s ease-in;
    pointer-events: none;
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
    border-radius: 20px 0 0 20px;
  }

  /* ── Card Top Row ── */
  .card-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .emoji-circle {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .emoji-circle span {
    font-size: 32px;
    line-height: 1;
  }

  .days-ago-text {
    font-size: 13px !important;
    color: #9CA3AF !important;
    font-weight: 400 !important;
  }

  /* ── Habit Name ── */
  .habit-name {
    font-size: 18px !important;
    font-weight: 600 !important;
    color: #2D2A26 !important;
    margin-bottom: 12px;
    line-height: 1.3;
  }

  /* ── Stat Badges ── */
  .stats-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .stat-badge {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px !important;
    font-weight: 500 !important;
    white-space: nowrap;
  }

  .stat-badge.strength {
    background: rgba(5, 150, 105, 0.10);
    color: #059669;
  }

  .stat-badge.streak {
    background: rgba(217, 119, 6, 0.10);
    color: #D97706;
  }

  .stat-badge.completions {
    background: rgba(37, 99, 235, 0.10);
    color: #2563EB;
  }

  /* ── Resume Button ── */
  .resume-btn {
    width: 100%;
    height: 44px;
    border-radius: 12px;
    border: none;
    background: #059669 !important;
    color: #FFFFFF !important;
    font-size: 15px !important;
    font-weight: 600 !important;
    font-family: 'DM Sans', sans-serif !important;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .resume-btn:hover {
    transform: translateY(-1px);
    box-shadow: 0 4px 14px rgba(5, 150, 105, 0.3);
  }

  .resume-btn:active {
    transform: translateY(0) scale(0.98);
  }

  /* Shimmer */
  .resume-btn::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.22), transparent);
  }

  .resume-btn:hover::after {
    animation: btnShimmer 0.7s ease-out;
  }

  @keyframes btnShimmer {
    to { left: 100%; }
  }

  .resume-btn.restored {
    background: #047857 !important;
    pointer-events: none;
  }

  /* ── Delete Link & Confirm ── */
  .delete-zone {
    text-align: center;
    margin-top: 10px;
  }

  .delete-link {
    font-size: 13px !important;
    color: #9CA3AF !important;
    background: none;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif !important;
    transition: color 0.2s;
  }

  .delete-link:hover {
    color: #6E6660 !important;
  }

  .inline-confirm {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 10px;
  }

  .inline-confirm.visible {
    display: flex;
    animation: confirmFadeIn 0.2s ease-out;
  }

  @keyframes confirmFadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .confirm-label {
    font-size: 13px !important;
    color: #6E6660 !important;
    font-weight: 500 !important;
  }

  .confirm-pill {
    font-size: 13px !important;
    font-weight: 600 !important;
    padding: 6px 16px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif !important;
    transition: transform 0.15s, box-shadow 0.15s;
  }

  .confirm-pill:hover {
    transform: translateY(-1px);
  }

  .confirm-pill:active {
    transform: scale(0.96);
  }

  .confirm-pill.delete-pill {
    background: #B53030 !important;
    color: #FFFFFF !important;
  }

  .confirm-pill.delete-pill:hover {
    box-shadow: 0 3px 10px rgba(181, 48, 48, 0.25);
  }

  .confirm-pill.cancel-pill {
    background: rgba(45, 42, 38, 0.06) !important;
    color: #6E6660 !important;
  }

  .confirm-pill.cancel-pill:hover {
    background: rgba(45, 42, 38, 0.12) !important;
  }
</style>
</head>
<body>
<div class="app-viewport">

  <!-- ── Sticky Header ── -->
  <div class="sticky-header">
    <div class="header-row">
      <button class="header-btn" aria-label="Go back">
        <i data-lucide="chevron-left" style="width:22px;height:22px;"></i>
      </button>
      <h1 class="header-title">Your Archived Habits</h1>
      <button class="header-btn" aria-label="Close">
        <i data-lucide="x" style="width:20px;height:20px;"></i>
      </button>
    </div>
    <div class="header-meta-row">
      <span class="header-subtitle" id="habit-count">5 habits waiting to come back</span>
      <button class="select-btn">Select</button>
    </div>
  </div>

  <!-- ── Cards ── -->
  <div class="cards-list" id="cards-list"></div>

</div>

<script>
  // ── Data ──
  const habits = [
    { id: 1, emoji: '🧘', name: 'Morning Meditation', strength: 72, streak: 14, completions: 156, daysAgo: 2 },
    { id: 2, emoji: '📖', name: 'Read 30 Minutes',    strength: 58, streak: 7,  completions: 89,  daysAgo: 5 },
    { id: 3, emoji: '🧊', name: 'Cold Shower',        strength: 35, streak: 3,  completions: 24,  daysAgo: 20 },
    { id: 4, emoji: '✍️', name: 'Daily Journal',      strength: 85, streak: 42, completions: 312, daysAgo: 34 },
    { id: 5, emoji: '💪', name: 'Push-ups',           strength: 12, streak: 1,  completions: 8,   daysAgo: 67 },
  ];

  // ── Strength tier → accent bar color ──
  function tierColor(s) {
    if (s >= 80) return '#7C3AED';
    if (s >= 60) return '#059669';
    if (s >= 40) return '#0D9488';
    if (s >= 20) return '#D97706';
    return '#E11D48';
  }

  function tintBg(hex) {
    const r = parseInt(hex.slice(1,3), 16);
    const g = parseInt(hex.slice(3,5), 16);
    const b = parseInt(hex.slice(5,7), 16);
    return `rgba(${r},${g},${b},0.10)`;
  }

  function daysLabel(d) {
    return d === 1 ? '1 day ago' : `${d} days ago`;
  }

  // ── Render ──
  function render() {
    const list = document.getElementById('cards-list');
    list.innerHTML = '';

    habits.forEach((h, i) => {
      const color = tierColor(h.strength);
      const bg = tintBg(color);

      const card = document.createElement('div');
      card.className = 'habit-card';
      card.id = `card-${h.id}`;
      card.setAttribute('data-index', i);

      card.innerHTML = `
        <div class="accent-bar" style="background:${color};"></div>

        <div class="card-top-row">
          <div class="emoji-circle" style="background:${bg};">
            <span>${h.emoji}</span>
          </div>
          <span class="days-ago-text">${daysLabel(h.daysAgo)}</span>
        </div>

        <div class="habit-name">${h.name}</div>

        <div class="stats-row">
          <span class="stat-badge strength">${h.strength}% strength</span>
          <span class="stat-badge streak">🔥 ${h.streak} day streak</span>
          <span class="stat-badge completions">✓ ${h.completions} total</span>
        </div>

        <button class="resume-btn" id="resume-${h.id}" onclick="handleResume(${h.id})">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round">
            <polyline points="1 4 1 10 7 10"></polyline>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
          </svg>
          <span>Resume This Habit</span>
        </button>

        <div class="delete-zone" id="delete-zone-${h.id}">
          <button class="delete-link" onclick="showConfirm(${h.id})">or delete permanently</button>
        </div>

        <div class="inline-confirm" id="confirm-${h.id}">
          <span class="confirm-label">Are you sure?</span>
          <button class="confirm-pill delete-pill" onclick="handleDelete(${h.id})">Delete</button>
          <button class="confirm-pill cancel-pill" onclick="hideConfirm(${h.id})">Cancel</button>
        </div>
      `;

      list.appendChild(card);
    });

    // Stagger entrance
    requestAnimationFrame(() => {
      document.querySelectorAll('.habit-card').forEach((card, i) => {
        setTimeout(() => card.classList.add('card-visible'), i * 60);
      });
    });

    refreshCount();
  }

  // ── Count ──
  function refreshCount() {
    const n = document.querySelectorAll('.habit-card:not(.exiting)').length;
    const el = document.getElementById('habit-count');
    if (n === 0) el.textContent = 'No archived habits';
    else if (n === 1) el.textContent = '1 habit waiting to come back';
    else el.textContent = `${n} habits waiting to come back`;
  }

  // ── Resume ──
  function handleResume(id) {
    const btn = document.getElementById(`resume-${id}`);
    if (btn.classList.contains('restored')) return;

    btn.classList.add('restored');
    btn.innerHTML = `
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24"
           fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
      <span>Restored!</span>
    `;

    setTimeout(() => {
      const card = document.getElementById(`card-${id}`);
      card.classList.add('exiting');
      refreshCount();
      setTimeout(() => { card.remove(); refreshCount(); }, 450);
    }, 800);
  }

  // ── Delete confirm ──
  function showConfirm(id) {
    document.getElementById(`delete-zone-${id}`).style.display = 'none';
    document.getElementById(`confirm-${id}`).classList.add('visible');
  }

  function hideConfirm(id) {
    document.getElementById(`confirm-${id}`).classList.remove('visible');
    document.getElementById(`delete-zone-${id}`).style.display = 'block';
  }

  function handleDelete(id) {
    const card = document.getElementById(`card-${id}`);
    card.classList.add('exiting');
    refreshCount();
    setTimeout(() => { card.remove(); refreshCount(); }, 450);
  }

  // ── Init ──
  render();
  lucide.createIcons();
</script>
</body>
</html>
