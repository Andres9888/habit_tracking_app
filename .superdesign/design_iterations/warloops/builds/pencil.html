<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pencil · Habit Detail (static mirror)</title>
<!-- WAR LOOPS — PENCIL build: static, motionless, pixel mirror of the source IDLE default
     (feel=celebrate · affordance=arrow · undoHint=true · done=false).
     Same capture wrapper + Phone shell geometry as source so renders align 1:1.
     All values are the source's design tokens (tokens.js) — no invented colors. -->
<link rel="stylesheet" href="../source/fonts-inline.css">
<style>
  :root{
    --bg:#F5F1ED; --card:#EDEAE5; --cardWhite:#FFFFFF; --border:#DDD8D2; --borderMuted:#E5E2DE;
    --g50:#FAF8F5; --g100:#F5F1ED; --g200:#DDD8D2; --g300:#C4BFB7; --g400:#6E6660; --g500:#6B6560;
    --g600:#524D47; --g700:#3D3833; --g800:#2D2A26; --g900:#1A1816;
    --primary600:#059669; --primary700:#047857; --primary500:#10B981; --primary100:#D1FAE5;
    --streak700:#7D5907; --success:#15793C; --strStrong:#0891b2;
    --serif:'Literata',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadowCard:0 2px 8px rgba(45,42,38,0.06);
  }
  html,body{margin:0;padding:0;background:#e9e5df;}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .frame-wrap{position:relative;width:460px;height:860px;}
  .frame-wrap>.phone-slot{position:absolute;left:35px;top:40px;}
  *{box-sizing:border-box;}

  /* ── Phone shell (Phone in habit-card.jsx) ── */
  .phone{width:390px;height:780px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);
    box-shadow:0 40px 80px rgba(0,0,0,0.18),0 0 0 1px rgba(0,0,0,0.12),inset 0 0 0 8px #0A0908;padding:8px;}
  .phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;}
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:10;display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;}
  .statusbar .time{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--g800);padding-top:14px;}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;}
  .sb-right{display:flex;gap:5px;align-items:center;padding-top:14px;}
  .screen{width:100%;height:100%;overflow:hidden;padding-top:44px;}

  /* ── HabitDetailLive ── */
  .hd{height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;flex-shrink:0;}
  .circle36{width:36px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;}
  .topbar .ctx{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--g400);line-height:18px;}
  .scroll{flex:1;overflow:hidden;padding-bottom:8px;}

  .hero{display:flex;flex-direction:column;align-items:center;padding:8px 16px 0;}
  .icon-tile{width:72px;height:72px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px;}
  .hero-name{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-0.3px;color:var(--g800);margin-top:12px;}
  .kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--g500);margin-top:16px;line-height:18px;}
  .num-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;}
  .streak-num{font-family:var(--serif);font-size:60px;font-weight:600;letter-spacing:-2px;line-height:64px;color:var(--g800);}
  .fire{font-size:22px;}
  .submeta{font-family:var(--sans);font-size:14px;font-weight:400;line-height:20px;color:var(--g500);margin-top:6px;}
  .submeta b{color:var(--g700);}

  .chain{display:flex;align-items:flex-end;justify-content:center;gap:7px;margin-top:16px;}
  .chain .col{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .chain .link{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;}
  .chain .link.done{background:var(--primary600);}
  .chain .link.today{background:var(--g200);border:2px solid var(--primary600);}
  .chain .lbl{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--g400);line-height:18px;}
  .chain .lbl.today{color:var(--g700);font-weight:700;}

  .complete{margin:16px 24px 0;position:relative;}
  /* helper: source renders an inline-flex (gap:6, line 18) inside a fixed box; the 👇 line ≈22px tall */
  .helper{height:22px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:18px;
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);}
  .helper .arrow{display:inline-block;}
  .complete-btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:17px 0;border-radius:16px;
    border:2px solid var(--success);background:transparent;}
  .ind{position:relative;width:24px;height:24px;flex-shrink:0;}
  .ind .ring{position:absolute;inset:0;border-radius:12px;border:2px solid var(--success);}
  .btn-label{font-family:var(--sans);font-size:17px;font-weight:600;color:var(--success);line-height:24px;}
  .undo{height:18px;text-align:center;margin-top:8px;}

  .card{background:var(--g50);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadowCard);}
  .cal{margin:16px 16px 0;padding:16px;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-month{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:-0.2px;color:var(--g800);line-height:26px;}
  .cal-hint{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);line-height:18px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--g400);text-align:center;margin-bottom:2px;line-height:18px;}
  .cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .cell.fill{background:var(--primary600);}
  .cell.past{background:var(--g200);}
  .cell.today{border:2px solid var(--primary600);}
  .cell.future{background:transparent;border:1px dashed var(--border);opacity:.5;}
  .cell .dot{width:5px;height:5px;border-radius:3px;background:var(--primary600);}

  .str{margin:16px 16px 24px;padding:16px;display:flex;align-items:center;gap:16px;}
  .str .meta .t{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--g500);line-height:18px;}
  .str .meta .lvl{font-family:var(--sans);font-size:18px;font-weight:600;letter-spacing:-0.2px;color:var(--strStrong);margin-top:2px;line-height:26px;}
  .str .meta .sub{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);margin-top:3px;line-height:18px;}
  .ring72{position:relative;width:72px;height:72px;flex-shrink:0;}
  .ring72 .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .ring-num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--g800);line-height:1;}
  .ring-num small{font-size:14px;}
</style>
</head>
<body>
<div class="frame-wrap"><div class="phone-slot">
  <div class="phone"><div class="phone-inner">
    <!-- status bar -->
    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="island"></div>
      <div class="sb-right">
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx="0.6" fill="#2D2A26"/><rect x="4.5" y="4" width="3" height="7" rx="0.6" fill="#2D2A26"/><rect x="9" y="2" width="3" height="9" rx="0.6" fill="#2D2A26"/><rect x="13.5" y="0" width="3" height="11" rx="0.6" fill="#2D2A26"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#2D2A26" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1.2" fill="#2D2A26"/></svg>
      </div>
    </div>
    <div class="screen">
      <div class="hd">
        <!-- top bar -->
        <div class="topbar">
          <div class="circle36"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3833" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
          <div class="ctx">Daily · Evening</div>
          <div class="circle36"><svg width="18" height="18" viewBox="0 0 24 24" fill="#524D47"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
        </div>
        <div class="scroll">
          <!-- hero -->
          <div class="hero">
            <div class="icon-tile">🧘</div>
            <div class="hero-name">Evening meditation</div>
            <div class="kicker">Current streak</div>
            <div class="num-row"><span class="streak-num">47</span><span class="fire">🔥</span></div>
            <div class="submeta">best <b>52</b> · 128 total</div>
            <!-- chain -->
            <div class="chain">
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">M</div></div>
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">T</div></div>
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">W</div></div>
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">T</div></div>
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">F</div></div>
              <div class="col"><div class="link done"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg></div><div class="lbl">S</div></div>
              <div class="col"><div class="link today"></div><div class="lbl today">Today</div></div>
            </div>
          </div>
          <!-- complete control (idle: arrow affordance) -->
          <div class="complete">
            <div class="helper"><span class="arrow">👇</span> Tap to log today</div>
            <div class="complete-btn">
              <div class="ind"><div class="ring"></div></div>
              <div class="btn-label">Mark as done</div>
            </div>
            <div class="undo"></div>
          </div>
          <!-- calendar -->
          <div class="card cal">
            <div class="cal-head"><div class="cal-month">June</div><div class="cal-hint">Tap any day to edit</div></div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <!-- strength mini -->
          <div class="card str">
            <div class="ring72">
              <svg width="72" height="72" viewBox="0 0 72 72" style="transform:rotate(-90deg)">
                <circle cx="36" cy="36" r="32" stroke="#DDD8D2" stroke-width="8" fill="none"/>
                <circle cx="36" cy="36" r="32" stroke="#0891b2" stroke-width="8" fill="none" stroke-linecap="round"
                  stroke-dasharray="201.06" stroke-dashoffset="64.34"/>
              </svg>
              <div class="ring-num">68<small>%</small></div>
            </div>
            <div class="meta">
              <div class="t">Habit strength</div>
              <div class="lvl">Strong</div>
              <div class="sub">Up 6% this month — keep showing up</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div></div>
</div></div>

<script>
  // Build the 35-cell month grid statically (same logic as source CalCard, done=false).
  // Weekday header then 35 cells. todayIdx=27, pattern filled, future dashed.
  (function(){
    var grid=document.getElementById('cal-grid');
    var dow=['S','M','T','W','T','F','S'];
    dow.forEach(function(d){var e=document.createElement('div');e.className='cal-dow';e.textContent=d;grid.appendChild(e);});
    var todayIdx=27, pattern=[2,3,4,6,8,9,10,11,13,15,16,17,18,20,22,23,24,25,26];
    for(var i=0;i<35;i++){
      var c=document.createElement('div');c.className='cell';
      var isToday=i===todayIdx, future=i>todayIdx, filled=pattern.indexOf(i)>=0;
      if(isToday){c.className+=' today';c.innerHTML='<span class="dot"></span>';}
      else if(future){c.className+=' future';}
      else if(filled){c.className+=' fill';}
      else{c.className+=' past';}
      grid.appendChild(c);
    }
  })();
</script>
</body>
</html>
