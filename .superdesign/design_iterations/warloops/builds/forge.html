<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forge · Habit Detail (moving)</title>
<!-- WAR LOOPS — FORGE build: the MOVING version. Self-contained vanilla JS/CSS, no React.
     Reproduces the source completion choreography from the spec:
       tap "Mark as done" (or today's calendar cell) → button fills, check scales in,
       streak ticks 47→48, today's chain link snaps in, icon badge pops, confetti bursts
       (feel=celebrate), hero tile warms to primary100, copy → "Done for Today / Tap again to undo".
     Tap again to undo. Idle affordance = bouncing 👇 arrow (feel=celebrate, affordance=arrow, undoHint=true).
     Query: ?state=idle|done , ?freeze=1 (settle for capture, kills looping/entrance motion). -->
<link rel="stylesheet" href="../source/fonts-inline.css">
<style>
  :root{
    --bg:#F5F1ED; --card:#EDEAE5; --cardWhite:#FFFFFF; --border:#DDD8D2; --borderMuted:#E5E2DE;
    --g50:#FAF8F5; --g100:#F5F1ED; --g200:#DDD8D2; --g300:#C4BFB7; --g400:#6E6660; --g500:#6B6560;
    --g600:#524D47; --g700:#3D3833; --g800:#2D2A26; --g900:#1A1816;
    --primary600:#059669; --primary700:#047857; --primary500:#10B981; --primary100:#D1FAE5;
    --streak300:#E8B94D; --streak500:#8B6208; --streak700:#7D5907; --success:#15793C; --strStrong:#0891b2;
    --serif:'Literata',Georgia,serif; --sans:'DM Sans',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,monospace;
    --shadowCard:0 2px 8px rgba(45,42,38,0.06);
  }
  html,body{margin:0;padding:0;background:#e9e5df;}
  body{font-family:var(--sans);-webkit-font-smoothing:antialiased;}
  .frame-wrap{position:relative;width:460px;height:860px;}
  .frame-wrap>.phone-slot{position:absolute;left:35px;top:40px;}
  /* ?stage=1 — responsive stage: centers the fixed phone in the viewport like the source .stage */
  body.stg{display:flex;align-items:center;justify-content:center;min-height:100vh;width:100vw;overflow:hidden;}
  body.stg .frame-wrap{position:static;flex:0 0 auto;}
  *{box-sizing:border-box;}

  /* ── animation keyframes (verbatim from source Habit Detail.html) ── */
  @keyframes hd-pulse{0%{box-shadow:0 0 0 0 rgba(5,150,105,0.34);}70%{box-shadow:0 0 0 13px rgba(5,150,105,0);}100%{box-shadow:0 0 0 0 rgba(5,150,105,0);}}
  @keyframes hd-confetti{to{transform:translate(var(--tx),var(--ty)) rotate(var(--rot));opacity:0;}}
  @keyframes hd-pop{0%{transform:scale(0.4);}60%{transform:scale(1.28);}100%{transform:scale(1);}}
  @keyframes hd-tick{0%{transform:translateY(0);}38%{transform:translateY(-7px);opacity:.45;}100%{transform:translateY(0);opacity:1;}}
  @keyframes hd-arrow{0%,100%{transform:translateY(0);}50%{transform:translateY(4px);}}
  @media (prefers-reduced-motion: reduce){*{animation:none !important;}}
  html.freeze *,html.freeze *::before,html.freeze *::after{animation:none !important;}

  /* ── phone shell ── */
  .phone{width:390px;height:780px;border-radius:44px;overflow:hidden;position:relative;background:var(--bg);
    box-shadow:0 40px 80px rgba(0,0,0,0.18),0 0 0 1px rgba(0,0,0,0.12),inset 0 0 0 8px #0A0908;padding:8px;}
  .phone-inner{width:100%;height:100%;border-radius:36px;overflow:hidden;background:var(--bg);position:relative;}
  .statusbar{position:absolute;top:0;left:0;right:0;height:44px;z-index:10;display:flex;align-items:center;justify-content:space-between;padding:0 24px;}
  .statusbar .time{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--g800);padding-top:14px;}
  .island{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:110px;height:30px;border-radius:20px;background:#000;}
  .sb-right{display:flex;gap:5px;align-items:center;padding-top:14px;}
  .screen{width:100%;height:100%;overflow:hidden;padding-top:44px;}

  /* ── habit detail ── */
  .hd{height:100%;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:4px 16px 10px;flex-shrink:0;}
  .circle36{width:36px;height:36px;border-radius:18px;background:var(--card);display:flex;align-items:center;justify-content:center;}
  .topbar .ctx{font-family:var(--sans);font-size:13px;font-weight:600;color:var(--g400);line-height:18px;}
  .scroll{flex:1;overflow-y:auto;padding-bottom:8px;}

  .hero{display:flex;flex-direction:column;align-items:center;padding:8px 16px 0;}
  .icon-tile{width:72px;height:72px;border-radius:16px;background:var(--card);display:flex;align-items:center;justify-content:center;font-size:36px;position:relative;transition:background .4s;}
  .icon-tile.on{background:var(--primary100);}
  .icon-badge{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:13px;background:var(--success);border:2.5px solid var(--bg);display:none;align-items:center;justify-content:center;}
  .icon-tile.on .icon-badge{display:flex;animation:hd-pop .4s cubic-bezier(.2,1.5,.4,1);}
  .hero-name{font-family:var(--serif);font-size:23px;font-weight:700;letter-spacing:-0.3px;color:var(--g800);margin-top:12px;}
  .kicker{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--g500);margin-top:16px;line-height:18px;}
  .num-row{display:flex;align-items:baseline;gap:8px;margin-top:2px;position:relative;}
  .streak-num{font-family:var(--serif);font-size:60px;font-weight:600;letter-spacing:-2px;line-height:64px;color:var(--g800);transition:color .4s;}
  .num-row.on .streak-num{color:var(--streak700);}
  .fire{font-size:22px;}
  .submeta{font-family:var(--sans);font-size:14px;font-weight:400;line-height:20px;color:var(--g500);margin-top:6px;}
  .submeta b{color:var(--g700);}

  .chain{display:flex;align-items:flex-end;justify-content:center;gap:7px;margin-top:16px;}
  .chain .col{display:flex;flex-direction:column;align-items:center;gap:5px;}
  .chain .link{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--g200);
    transition:background .3s,transform .3s cubic-bezier(.2,1.5,.4,1),box-shadow .3s;}
  .chain .link.done{background:var(--primary600);}
  .chain .link.today{border:2px solid var(--primary600);}
  .chain .link.today.on{border-color:transparent;background:var(--primary600);box-shadow:0 0 0 4px var(--primary100);}
  .chain .link.today.on svg{display:block;}
  .chain .link .lk{display:none;}
  .chain .link.done .lk,.chain .link.today.on .lk{display:block;}
  .chain .lbl{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--g400);line-height:18px;}
  .chain .lbl.today{color:var(--g700);font-weight:700;}

  .complete{margin:16px 24px 0;position:relative;}
  /* helper: source renders an inline-flex (gap:6, line 18) inside a fixed box; the 👇 line ≈22px tall */
  .helper{height:22px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:6px;line-height:18px;
    font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);}
  .helper.hide{visibility:hidden;} /* done: helper hidden but keeps its 22px slot — source places button at the same y in both states */
  .helper .arrow{display:inline-block;animation:hd-arrow 1.2s ease-in-out infinite;}
  .complete-btn{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;padding:17px 0;border-radius:16px;
    border:2px solid var(--success);background:transparent;cursor:pointer;appearance:none;font:inherit;position:relative;overflow:visible;
    transition:background .32s cubic-bezier(.3,0,.2,1),transform .12s ease,box-shadow .3s;}
  .complete-btn.on{background:var(--success);}
  .complete-btn:active{transform:scale(.97);}
  .ind{position:relative;width:24px;height:24px;flex-shrink:0;}
  .ind .ring{position:absolute;inset:0;border-radius:12px;border:2px solid var(--success);opacity:1;transform:scale(1);transition:all .25s;}
  .ind .disc{position:absolute;inset:0;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.2);
    transition:transform .28s cubic-bezier(.2,1.5,.4,1) .04s,opacity .2s;}
  .complete-btn.on .ind .ring{opacity:0;transform:scale(.6);}
  .complete-btn.on .ind .disc{opacity:1;transform:scale(1);}
  .btn-label{font-family:var(--sans);font-size:17px;font-weight:600;color:var(--success);line-height:24px;}
  .complete-btn.on .btn-label{color:#fff;}
  .undo{height:18px;text-align:center;margin-top:8px;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g400);visibility:hidden;}
  .undo.show{visibility:visible;}

  .card{background:var(--g50);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadowCard);}
  .cal{margin:16px 16px 0;padding:16px;}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal-month{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:-0.2px;color:var(--g800);line-height:26px;}
  .cal-hint{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);line-height:18px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{font-family:var(--sans);font-size:10px;font-weight:500;color:var(--g400);text-align:center;margin-bottom:2px;line-height:18px;}
  .cell{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:background .3s;}
  .cell.fill{background:var(--primary600);}
  .cell.past{background:var(--g200);}
  .cell.today{border:2px solid var(--primary600);cursor:pointer;}
  .cell.today.on{background:var(--primary600);}
  .cell.future{background:transparent;border:1px dashed var(--border);opacity:.5;}
  .cell .dot{width:5px;height:5px;border-radius:3px;background:var(--primary600);}
  .cell.today.on .dot{display:none;}
  .cell .ck{display:none;}
  .cell.today.on .ck{display:block;}

  .str{margin:16px 16px 24px;padding:16px;display:flex;align-items:center;gap:16px;}
  .ring72{position:relative;width:72px;height:72px;flex-shrink:0;}
  .ring72 .ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
  .ring-num{font-family:var(--mono);font-size:26px;font-weight:700;color:var(--g800);line-height:1;}
  .ring-num small{font-size:14px;}
  .str .meta .t{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--g500);line-height:18px;}
  .str .meta .lvl{font-family:var(--sans);font-size:18px;font-weight:600;letter-spacing:-0.2px;color:var(--strStrong);margin-top:2px;line-height:26px;}
  .str .meta .sub{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--g500);margin-top:3px;line-height:18px;}

  .confetti{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none;z-index:6;}
  .confetti span{position:absolute;}
</style>
</head>
<body>
<div class="frame-wrap"><div class="phone-slot">
  <div class="phone"><div class="phone-inner">
    <div class="statusbar">
      <div class="time">9:41</div>
      <div class="island"></div>
      <div class="sb-right">
        <svg width="17" height="11" viewBox="0 0 17 11"><rect x="0" y="6" width="3" height="5" rx="0.6" fill="#2D2A26"/><rect x="4.5" y="4" width="3" height="7" rx="0.6" fill="#2D2A26"/><rect x="9" y="2" width="3" height="9" rx="0.6" fill="#2D2A26"/><rect x="13.5" y="0" width="3" height="11" rx="0.6" fill="#2D2A26"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0.5" y="0.5" width="21" height="10" rx="2.5" stroke="#2D2A26" stroke-opacity="0.4" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1.2" fill="#2D2A26"/></svg>
      </div>
    </div>
    <div class="screen">
      <div class="hd">
        <div class="topbar">
          <div class="circle36"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#3D3833" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg></div>
          <div class="ctx">Daily · Evening</div>
          <div class="circle36"><svg width="18" height="18" viewBox="0 0 24 24" fill="#524D47"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></div>
        </div>
        <div class="scroll">
          <div class="hero">
            <div class="icon-tile" id="iconTile">🧘
              <div class="icon-badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></div>
            </div>
            <div class="hero-name">Evening meditation</div>
            <div class="kicker">Current streak</div>
            <div class="num-row" id="numRow"><span class="confetti" id="confettiHero"></span><span class="streak-num" id="streakNum">47</span><span class="fire">🔥</span></div>
            <div class="submeta">best <b>52</b> · 128 total</div>
            <div class="chain" id="chain"></div>
          </div>
          <div class="complete">
            <div class="helper" id="helper"><span class="arrow">👇</span> Tap to log today</div>
            <button class="complete-btn" id="btn">
              <span class="confetti" id="confettiBtn"></span>
              <span class="ind"><span class="ring"></span><span class="disc"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#15793C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg></span></span>
              <span class="btn-label" id="btnLabel">Mark as done</span>
            </button>
            <div class="undo" id="undo">Tap again to undo</div>
          </div>
          <div class="card cal">
            <div class="cal-head"><div class="cal-month">June</div><div class="cal-hint">Tap any day to edit</div></div>
            <div class="cal-grid" id="cal-grid"></div>
          </div>
          <div class="card str">
            <div class="ring72">
              <svg width="72" height="72" viewBox="0 0 72 72" style="transform:rotate(-90deg)">
                <circle cx="36" cy="36" r="32" stroke="#DDD8D2" stroke-width="8" fill="none"/>
                <circle cx="36" cy="36" r="32" stroke="#0891b2" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="201.06" stroke-dashoffset="64.34"/>
              </svg>
              <div class="ring-num">68<small>%</small></div>
            </div>
            <div class="meta">
              <div class="t">Habit strength</div>
              <div class="lvl">Strong</div>
              <div class="sub">Up 6% this month — keep showing up</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div></div>
</div></div>

<script>
(function(){
  var LINK='<svg class="lk" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 007.54.54l3-3a5 5 0 00-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 00-7.54-.54l-3 3a5 5 0 007.07 7.07l1.71-1.71"/></svg>';
  // chain
  var chain=document.getElementById('chain'); var days=['M','T','W','T','F','S'];
  days.forEach(function(d){chain.insertAdjacentHTML('beforeend','<div class="col"><div class="link done">'+LINK+'</div><div class="lbl">'+d+'</div></div>');});
  chain.insertAdjacentHTML('beforeend','<div class="col"><div class="link today" id="todayLink">'+LINK+'</div><div class="lbl today">Today</div></div>');
  // calendar
  var grid=document.getElementById('cal-grid'), dow=['S','M','T','W','T','F','S'];
  dow.forEach(function(d){grid.insertAdjacentHTML('beforeend','<div class="cal-dow">'+d+'</div>');});
  var todayIdx=27, pattern=[2,3,4,6,8,9,10,11,13,15,16,17,18,20,22,23,24,25,26];
  var CK='<svg class="ck" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 10 18 20 6"/></svg>';
  for(var i=0;i<35;i++){
    var cls='cell',inner='';
    if(i===todayIdx){cls+=' today';inner='<span class="dot"></span>'+CK;}
    else if(i>todayIdx){cls+=' future';}
    else if(pattern.indexOf(i)>=0){cls+=' fill';}
    else{cls+=' past';}
    grid.insertAdjacentHTML('beforeend','<div class="'+cls+'" '+(i===todayIdx?'id="calToday"':'')+'>'+inner+'</div>');
  }

  var COLORS=['#10B981','#8B6208','#E8B94D','#059669','#0891b2'];
  function burst(host,intense){
    host.innerHTML='';
    var n=intense?22:14;
    for(var i=0;i<n;i++){
      var a=(i/n)*Math.PI*2+(i%2?0.3:0), d=(intense?70:50)+(i%3)*14;
      var tx=Math.cos(a)*d, ty=Math.sin(a)*d-10, rot=(i%2?1:-1)*(180+i*12);
      var s=i%3?6:8, c=COLORS[i%5];
      var el=document.createElement('span');
      el.style.cssText='width:'+s+'px;height:'+s+'px;border-radius:'+(i%2?s+'px':'2px')+';background:'+c+';'+
        '--tx:'+tx+'px;--ty:'+ty+'px;--rot:'+rot+'deg;animation:hd-confetti '+(intense?720:600)+'ms cubic-bezier(.18,.7,.3,1) forwards;';
      host.appendChild(el);
    }
    setTimeout(function(){host.innerHTML='';}, intense?760:640);
  }

  var done=false, frozen=document.documentElement.classList.contains('freeze');
  var iconTile=document.getElementById('iconTile'), numRow=document.getElementById('numRow'),
      streakNum=document.getElementById('streakNum'), helper=document.getElementById('helper'),
      btn=document.getElementById('btn'), btnLabel=document.getElementById('btnLabel'),
      undo=document.getElementById('undo'), todayLink=document.getElementById('todayLink'),
      calToday=document.getElementById('calToday');

  function apply(animate){
    iconTile.classList.toggle('on',done);
    numRow.classList.toggle('on',done);
    streakNum.textContent=done?'48':'47';
    helper.classList.toggle('hide',done);
    btn.classList.toggle('on',done);
    btnLabel.textContent=done?'Done for Today':'Mark as done';
    undo.classList.toggle('show',done);
    todayLink.classList.toggle('on',done);
    calToday.classList.toggle('on',done);
    if(done&&animate&&!frozen){
      streakNum.style.animation='hd-tick .5s cubic-bezier(.2,1.2,.4,1)';
      todayLink.style.animation='hd-pop .45s cubic-bezier(.2,1.5,.4,1)';
      setTimeout(function(){streakNum.style.animation='';todayLink.style.animation='';},560);
      burst(document.getElementById('confettiHero'),false);
      burst(document.getElementById('confettiBtn'),false);
    }
  }
  function toggle(){done=!done;apply(true);}
  btn.addEventListener('click',toggle);
  calToday.addEventListener('click',toggle);

  // initial state from query
  var q=new URLSearchParams(location.search);
  if(q.get('stage')==='1')document.body.classList.add('stg');
  if(q.get('state')==='done'){done=true;apply(false);}
  else apply(false);
})();
</script>
</body>
</html>
