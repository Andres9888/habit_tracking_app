<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Source · Habit Detail screen (isolated)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,wght@0,400;0,500;0,600;0,700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Shared capture wrapper — identical across source / pencil / forge so screenshots align pixel-for-pixel */
  html, body { margin:0; padding:0; background:#e9e5df; }
  body { font-family:"DM Sans", system-ui, sans-serif; -webkit-font-smoothing:antialiased; }
  .frame-wrap { position:relative; width:460px; height:860px; }
  .frame-wrap > .phone-slot { position:absolute; left:35px; top:40px; }
  *::-webkit-scrollbar { width:0; height:0; }

  @keyframes hd-pulse {
    0%   { box-shadow:0 0 0 0 rgba(5,150,105,0.34); }
    70%  { box-shadow:0 0 0 13px rgba(5,150,105,0); }
    100% { box-shadow:0 0 0 0 rgba(5,150,105,0); }
  }
  @keyframes hd-confetti { to { transform:translate(var(--tx), var(--ty)) rotate(var(--rot)); opacity:0; } }
  @keyframes hd-pop  { 0%{transform:scale(0.4);} 60%{transform:scale(1.28);} 100%{transform:scale(1);} }
  @keyframes hd-tick { 0%{transform:translateY(0);} 38%{transform:translateY(-7px); opacity:.45;} 100%{transform:translateY(0); opacity:1;} }
  @keyframes hd-arrow { 0%,100%{transform:translateY(0);} 50%{transform:translateY(4px);} }
  /* capture stability: when ?freeze=1, kill the only idle-looping animation (arrow bob) */
  body.freeze [style*="hd-arrow"] { animation:none !important; }
</style>
</head>
<body>
<div class="frame-wrap"><div class="phone-slot"><div id="root"></div></div></div>

<script>
  // state from query: ?state=idle|done , ?freeze=1
  (function(){
    var q = new URLSearchParams(location.search);
    var st = q.get('state') || 'idle';
    try { localStorage.setItem('hd_done', JSON.stringify(st === 'done')); } catch(e){}
    if (q.get('freeze') === '1') document.body.classList.add('freeze');
  })();
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
<script src="tokens.js"></script>
<script type="text/babel" src="habit-card.jsx"></script>
<script type="text/babel" src="detail-deps.jsx"></script>
<script type="text/babel" src="habit-detail-live.jsx"></script>
<script type="text/babel" data-presets="react">
  function App() {
    return (
      <Phone width={390} height={780}>
        <HabitDetailLive feel="celebrate" affordance="arrow" undoHint={true} />
      </Phone>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
