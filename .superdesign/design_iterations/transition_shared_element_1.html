<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transition: Shared Element (Recommended)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #1c1917; }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: #faf9f7;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Success State */
    .success-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 1;
      animation: fadeOutSuccess 0.5s ease-out 2s forwards;
    }

    .success-icon {
      width: 96px;
      height: 96px;
      border-radius: 48px;
      background: #D1FAE5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 48px;
      margin-bottom: 24px;
      animation: morphToCard 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 2s forwards;
      z-index: 10;
    }

    .success-content {
      text-align: center;
      animation: fadeOutContent 0.3s ease-out 1.8s forwards;
    }

    .success-headline {
      font-size: 24px;
      font-weight: 700;
      color: #1C1917;
      margin-bottom: 8px;
    }

    .success-subtext {
      font-size: 16px;
      color: #A8A29E;
      margin-bottom: 32px;
    }

    /* Habit List State */
    .habit-list-state {
      position: absolute;
      inset: 0;
      opacity: 0;
      animation: fadeInList 0.5s ease-out 2s forwards;
      padding: 60px 16px 24px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      opacity: 0;
      animation: slideInHeader 0.4s ease-out 2.2s forwards;
    }

    .header-title {
      font-size: 28px;
      font-weight: 700;
      color: #1C1917;
    }

    .calendar-strip {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      opacity: 0;
      animation: slideInCalendar 0.4s ease-out 2.3s forwards;
    }

    .day-cell {
      flex: 1;
      text-align: center;
      padding: 8px 4px;
      border-radius: 12px;
      background: white;
      border: 1px solid #E7E5E4;
    }

    .day-label {
      font-size: 10px;
      font-weight: 500;
      color: #A8A29E;
      text-transform: uppercase;
    }

    .day-number {
      font-size: 16px;
      font-weight: 600;
      color: #1C1917;
    }

    .day-cell.today {
      background: #10B981;
      border-color: #10B981;
    }

    .day-cell.today .day-label,
    .day-cell.today .day-number {
      color: white;
    }

    /* New Habit Card - appears where success icon was */
    .habit-card {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid #E7E5E4;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideInCard 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2.4s forwards;
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
    }

    .habit-card.highlight {
      animation: slideInCard 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 2.4s forwards,
                 glowPulse 1s ease-in-out 2.4s 2;
    }

    .habit-emoji {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #D1FAE5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
    }

    .habit-info {
      flex: 1;
    }

    .habit-name {
      font-size: 16px;
      font-weight: 600;
      color: #1C1917;
      margin-bottom: 4px;
    }

    .habit-streak {
      font-size: 13px;
      color: #A8A29E;
    }

    .habit-dots {
      display: flex;
      gap: 6px;
    }

    .dot {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid #E7E5E4;
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 2px;
      animation: confettiFall 1.5s ease-out forwards;
    }

    @keyframes fadeOutSuccess {
      to { opacity: 0; pointer-events: none; }
    }

    @keyframes fadeOutContent {
      to { opacity: 0; transform: translateY(-10px); }
    }

    @keyframes morphToCard {
      0% {
        transform: scale(1) translateY(0);
      }
      50% {
        transform: scale(0.5) translateY(-100px);
      }
      100% {
        transform: scale(0.5) translateY(-200px);
        opacity: 0;
      }
    }

    @keyframes fadeInList {
      to { opacity: 1; }
    }

    @keyframes slideInHeader {
      to { opacity: 1; transform: translateY(0); }
      from { transform: translateY(-10px); }
    }

    @keyframes slideInCalendar {
      to { opacity: 1; transform: translateY(0); }
      from { transform: translateY(-10px); }
    }

    @keyframes slideInCard {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.3); }
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-300px) rotate(720deg);
        opacity: 0;
      }
    }

    .replay-btn {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #10B981;
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 14px;
    }

    .label {
      position: fixed;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      background: #10B981;
      color: white;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">
  <div class="label">Recommended: Shared Element Transition</div>

  <div class="phone-frame" id="phone">
    <!-- Success State (Initial) -->
    <div class="success-state" id="successState">
      <!-- Confetti particles -->
      <div class="confetti" style="left: 20%; top: 40%; background: #10B981; animation-delay: 0.1s;"></div>
      <div class="confetti" style="left: 30%; top: 45%; background: #FBBF24; animation-delay: 0.2s;"></div>
      <div class="confetti" style="left: 50%; top: 38%; background: #8B5CF6; animation-delay: 0.15s;"></div>
      <div class="confetti" style="left: 70%; top: 42%; background: #EC4899; animation-delay: 0.25s;"></div>
      <div class="confetti" style="left: 80%; top: 40%; background: #10B981; animation-delay: 0.1s;"></div>

      <div class="success-icon" id="successIcon">🌿</div>
      <div class="success-content">
        <div class="success-headline">You're growing!</div>
        <div class="success-subtext">"Drink water" added to your habits</div>
      </div>
    </div>

    <!-- Habit List State (Appears after transition) -->
    <div class="habit-list-state">
      <div class="header">
        <div class="header-title">Habits</div>
        <div style="display: flex; gap: 8px;">
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #E7E5E4;"></div>
          <div style="width: 32px; height: 32px; border-radius: 8px; background: #10B981;"></div>
        </div>
      </div>

      <div class="calendar-strip">
        <div class="day-cell">
          <div class="day-label">Mon</div>
          <div class="day-number">23</div>
        </div>
        <div class="day-cell">
          <div class="day-label">Tue</div>
          <div class="day-number">24</div>
        </div>
        <div class="day-cell">
          <div class="day-label">Wed</div>
          <div class="day-number">25</div>
        </div>
        <div class="day-cell">
          <div class="day-label">Thu</div>
          <div class="day-number">26</div>
        </div>
        <div class="day-cell today">
          <div class="day-label">Fri</div>
          <div class="day-number">27</div>
        </div>
        <div class="day-cell">
          <div class="day-label">Sat</div>
          <div class="day-number">28</div>
        </div>
        <div class="day-cell">
          <div class="day-label">Sun</div>
          <div class="day-number">29</div>
        </div>
      </div>

      <!-- New Habit Card with highlight -->
      <div class="habit-card highlight">
        <div class="habit-emoji">💧</div>
        <div class="habit-info">
          <div class="habit-name">Drink water</div>
          <div class="habit-streak">New habit - Start your streak!</div>
        </div>
        <div class="habit-dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>

  <button class="replay-btn" onclick="location.reload()">Replay Animation</button>
</body>
</html>
