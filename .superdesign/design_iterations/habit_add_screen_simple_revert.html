<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Habit - Simple (Revert Target)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    body { background: #111; }

    .paper-bg { background: #f8f5f1; }

    .pressable { transition: transform 0.1s ease; cursor: pointer; }
    .pressable:active { transform: scale(0.96); }

    .color-swatch {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      transition: all 0.15s ease;
      border: 3px solid transparent;
    }

    .color-swatch.selected {
      border-color: #1a1a1a;
      transform: scale(1.1);
    }

    .emoji-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: white;
      border: 2px solid #e5e5e5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.15s ease;
    }

    .emoji-chip.selected {
      border-color: #22C55E;
      background: #DCFCE7;
    }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="min-h-screen flex items-end justify-center p-4">
  <!-- iPhone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative" style="background: rgba(0,0,0,0.5);">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[90%] paper-bg rounded-t-3xl flex flex-col shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-4 py-3 border-b border-stone-200">
          <button class="px-3 py-1.5 text-stone-500 text-[15px] pressable">Cancel</button>
          <h1 class="text-[17px] font-semibold text-stone-800">New Habit</h1>
          <button class="px-3 py-1.5 bg-emerald-500 text-white text-[15px] font-semibold rounded-lg pressable">Save</button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-4 pb-8">

          <!-- Template Browser (Horizontal Scroll) -->
          <div class="py-4">
            <p class="text-xs font-medium text-stone-500 mb-2">TEMPLATES</p>
            <div class="flex gap-2 overflow-x-auto pb-2 -mx-4 px-4">
              <div class="flex-shrink-0 w-24 h-20 bg-white rounded-xl border border-stone-200 flex flex-col items-center justify-center gap-1 pressable">
                <span class="text-2xl">🧘</span>
                <span class="text-xs text-stone-600">Meditate</span>
              </div>
              <div class="flex-shrink-0 w-24 h-20 bg-white rounded-xl border border-stone-200 flex flex-col items-center justify-center gap-1 pressable">
                <span class="text-2xl">📖</span>
                <span class="text-xs text-stone-600">Read</span>
              </div>
              <div class="flex-shrink-0 w-24 h-20 bg-white rounded-xl border border-stone-200 flex flex-col items-center justify-center gap-1 pressable">
                <span class="text-2xl">💪</span>
                <span class="text-xs text-stone-600">Exercise</span>
              </div>
              <div class="flex-shrink-0 w-24 h-20 bg-white rounded-xl border border-stone-200 flex flex-col items-center justify-center gap-1 pressable">
                <span class="text-2xl">💧</span>
                <span class="text-xs text-stone-600">Hydrate</span>
              </div>
            </div>
          </div>

          <!-- Live Preview Card -->
          <div class="bg-white rounded-2xl p-4 mb-4 border border-stone-200 shadow-sm">
            <p class="text-xs text-stone-400 mb-2">Preview</p>
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-xl flex items-center justify-center text-2xl" style="background: #10B981;">
                📖
              </div>
              <div>
                <p class="font-semibold text-stone-800">Read for 20 minutes</p>
                <p class="text-xs text-stone-400">Daily habit</p>
              </div>
            </div>
          </div>

          <!-- Habit Name -->
          <div class="mb-4">
            <label class="text-xs font-medium text-stone-500 mb-1.5 block">HABIT NAME</label>
            <input
              type="text"
              class="w-full h-12 px-4 bg-white border border-stone-200 rounded-xl text-[15px] text-stone-800 focus:outline-none focus:border-emerald-500"
              placeholder="e.g. Read 10 pages"
              value="Read for 20 minutes"
            />
          </div>

          <!-- Emoji Picker -->
          <div class="mb-4">
            <label class="text-xs font-medium text-stone-500 mb-1.5 block">ICON</label>
            <div class="flex flex-wrap gap-2">
              <button class="emoji-chip">🎯</button>
              <button class="emoji-chip">✨</button>
              <button class="emoji-chip">💪</button>
              <button class="emoji-chip selected">📖</button>
              <button class="emoji-chip">🧘</button>
              <button class="emoji-chip">💧</button>
              <button class="emoji-chip">🏃</button>
              <button class="emoji-chip">🍎</button>
              <button class="emoji-chip" style="background: #f5f5f5; border-style: dashed;">
                <i data-lucide="plus" class="w-5 h-5 text-stone-400"></i>
              </button>
            </div>
          </div>

          <!-- Color Picker -->
          <div class="mb-4">
            <label class="text-xs font-medium text-stone-500 mb-1.5 block">COLOR</label>
            <div class="flex flex-wrap gap-2">
              <button class="color-swatch" style="background: #EF4444;"></button>
              <button class="color-swatch" style="background: #F97316;"></button>
              <button class="color-swatch" style="background: #FBBF24;"></button>
              <button class="color-swatch" style="background: #84CC16;"></button>
              <button class="color-swatch selected" style="background: #10B981;"></button>
              <button class="color-swatch" style="background: #06B6D4;"></button>
              <button class="color-swatch" style="background: #3B82F6;"></button>
              <button class="color-swatch" style="background: #8B5CF6;"></button>
            </div>
          </div>

          <!-- Reminder Section -->
          <div class="mb-4">
            <label class="text-xs font-medium text-stone-500 mb-1.5 block">REMINDER</label>
            <div class="bg-white rounded-xl border border-stone-200 p-4">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center">
                    <i data-lucide="bell" class="w-5 h-5 text-emerald-600"></i>
                  </div>
                  <div>
                    <p class="font-medium text-stone-800">Daily reminder</p>
                    <p class="text-xs text-stone-400">7:00 AM</p>
                  </div>
                </div>
                <!-- Toggle -->
                <div class="w-12 h-7 bg-emerald-500 rounded-full relative">
                  <div class="absolute right-1 top-1 w-5 h-5 bg-white rounded-full shadow"></div>
                </div>
              </div>
            </div>
          </div>

          <!-- No Advanced Options - Just the essentials above -->

        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
