<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parked Habits - Archive</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif !important;
      background: #2D2D2D !important;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      background: #4A4A4A;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 25px 60px rgba(0,0,0,0.5);
    }
    .mono { font-family: 'Space Mono', monospace !important; }

    /* Asphalt texture */
    .asphalt {
      background: #4A4A4A;
      background-image:
        radial-gradient(ellipse at 20% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(255,255,255,0.02) 0%, transparent 40%);
    }

    /* Parking lines */
    .parking-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      padding: 16px 20px;
      position: relative;
    }

    .parking-spot {
      position: relative;
      height: 180px;
      border: 2px dashed rgba(255,255,255,0.35);
      border-radius: 4px;
      margin: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .parking-spot::before {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 10%;
      right: 10%;
      height: 3px;
      background: rgba(255,255,255,0.5);
      border-radius: 2px;
    }

    /* Spot number */
    .spot-number {
      position: absolute;
      top: 6px;
      left: 8px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
    }

    /* Car styling */
    .car {
      width: 100px;
      height: 130px;
      border-radius: 16px 16px 10px 10px;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      cursor: pointer;
      box-shadow: 4px 4px 12px rgba(0,0,0,0.4);
    }
    .car:hover {
      transform: scale(1.04);
      box-shadow: 4px 4px 18px rgba(0,0,0,0.5);
    }

    /* Windshield */
    .car::before {
      content: '';
      position: absolute;
      top: 14px;
      left: 12px;
      right: 12px;
      height: 22px;
      background: rgba(255,255,255,0.15);
      border-radius: 6px 6px 2px 2px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Rear window */
    .car::after {
      content: '';
      position: absolute;
      bottom: 16px;
      left: 14px;
      right: 14px;
      height: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px 2px 5px 5px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .car-emoji {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 28px;
      z-index: 2;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3));
    }

    /* Side mirrors */
    .mirror-left, .mirror-right {
      position: absolute;
      width: 8px;
      height: 14px;
      background: inherit;
      top: 32px;
      border-radius: 3px;
      filter: brightness(0.85);
    }
    .mirror-left { left: -6px; }
    .mirror-right { right: -6px; }

    /* Headlights */
    .headlight {
      position: absolute;
      top: 4px;
      width: 14px;
      height: 8px;
      background: rgba(255,255,200,0.7);
      border-radius: 3px 3px 1px 1px;
    }
    .headlight-left { left: 8px; }
    .headlight-right { right: 8px; }

    /* Taillights */
    .taillight {
      position: absolute;
      bottom: 5px;
      width: 12px;
      height: 6px;
      background: rgba(255,60,60,0.6);
      border-radius: 1px 1px 3px 3px;
    }
    .taillight-left { left: 10px; }
    .taillight-right { right: 10px; }

    /* Parking meter */
    .parking-meter {
      position: absolute;
      top: 6px;
      right: 6px;
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      padding: 3px 6px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .meter-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #F59E0B;
      animation: meterBlink 2s ease-in-out infinite;
    }
    @keyframes meterBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .meter-text {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #F59E0B;
      letter-spacing: 0.5px;
    }

    /* Habit label */
    .habit-label {
      position: absolute;
      bottom: 8px;
      left: 0;
      right: 0;
      text-align: center;
    }
    .habit-label span {
      font-family: 'DM Sans', sans-serif;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.8);
      background: rgba(0,0,0,0.4);
      padding: 2px 8px;
      border-radius: 4px;
    }

    /* Action panel */
    .action-panel {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      background: rgba(30,30,30,0.97);
      backdrop-filter: blur(20px);
      border-top: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px 20px 0 0;
      padding: 20px 24px 36px;
      z-index: 100;
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      transform: translateX(-50%) translateY(100%);
      opacity: 0;
    }
    .action-panel.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .action-btn {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.2s ease;
    }
    .action-btn:active { transform: scale(0.97); }

    .btn-drive {
      background: rgba(5,150,105,0.15);
      color: #34D399;
      margin-bottom: 10px;
    }
    .btn-drive:hover { background: rgba(5,150,105,0.25); }

    .btn-tow {
      background: rgba(181,48,48,0.15);
      color: #F87171;
    }
    .btn-tow:hover { background: rgba(181,48,48,0.25); }

    /* Drive out animation */
    @keyframes driveOut {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      20% { transform: translateY(-5px) scale(1.02); }
      100% { transform: translateY(-600px) scale(0.8); opacity: 0; }
    }
    .driving-out {
      animation: driveOut 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    .driving-out .headlight {
      background: rgba(255,255,200,1) !important;
      box-shadow: 0 -8px 20px rgba(255,255,200,0.5);
    }

    /* Tow away animation */
    @keyframes towAway {
      0% { transform: translateX(0) rotate(0deg); opacity: 1; }
      30% { transform: translateX(10px) rotate(2deg); }
      100% { transform: translateX(400px) rotate(8deg); opacity: 0; }
    }
    .towing {
      animation: towAway 0.9s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    /* Empty spot */
    @keyframes spotFade {
      0% { opacity: 1; }
      100% { opacity: 0.3; }
    }
    .empty-spot {
      animation: spotFade 0.5s ease forwards;
    }
    .empty-spot .car { display: none; }
    .empty-spot .parking-meter { display: none; }
    .empty-spot::after {
      content: 'VACANT';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      color: rgba(255,255,255,0.2);
      letter-spacing: 3px;
    }

    /* Road markings */
    .center-line {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 100%;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255,200,0,0.4) 0px,
        rgba(255,200,0,0.4) 20px,
        transparent 20px,
        transparent 40px
      );
      z-index: 0;
    }

    /* Overlay */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* Header */
    .header-bar {
      padding: 56px 24px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 20px;
      padding: 0 24px 12px;
    }
    .stat-pill {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stat-pill span {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
    }
    .stat-pill strong {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      font-weight: 600;
    }

    /* Entrance arrow */
    .entrance {
      text-align: center;
      padding: 8px 0 4px;
    }
    .entrance-label {
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: rgba(255,255,255,0.25);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    /* Car select ring */
    .car-selected {
      box-shadow: 0 0 0 3px rgba(255,255,255,0.6), 4px 4px 12px rgba(0,0,0,0.4) !important;
    }

    /* Tire marks */
    .tire-marks {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 30px;
      height: 40px;
      opacity: 0;
      pointer-events: none;
    }
    .tire-marks.show {
      opacity: 1;
      animation: tireFade 1.5s ease-out forwards;
    }
    @keyframes tireFade {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="phone-frame asphalt">
    <!-- Header -->
    <div class="header-bar">
      <div>
        <div style="display:flex; align-items:center; gap:8px;">
          <div style="width:32px; height:32px; background:rgba(255,255,255,0.1); border-radius:8px; display:flex; align-items:center; justify-content:center;">
            <i data-lucide="square-parking" style="width:18px; height:18px; color:rgba(255,255,255,0.7);"></i>
          </div>
          <div>
            <h1 style="font-size:18px; font-weight:700; color:white; line-height:1.2;">Habit Parking</h1>
            <p class="mono" style="font-size:10px; color:rgba(255,255,255,0.35); letter-spacing:1px;">LOT #02 - ARCHIVED</p>
          </div>
        </div>
      </div>
      <button onclick="closePanel()" style="background:rgba(255,255,255,0.1); border:none; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; cursor:pointer;">
        <i data-lucide="x" style="width:16px; height:16px; color:rgba(255,255,255,0.5);"></i>
      </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-pill">
        <span>Parked</span>
        <strong id="parkedCount">4</strong>
      </div>
      <div class="stat-pill">
        <span>Spots</span>
        <strong>4</strong>
      </div>
      <div class="stat-pill">
        <span>Avg stay</span>
        <strong class="mono" style="font-size:11px;">23d</strong>
      </div>
    </div>

    <!-- Entrance -->
    <div class="entrance">
      <div class="entrance-label">&#9660; entrance &#9660;</div>
    </div>

    <!-- Parking Grid -->
    <div class="parking-grid" style="position:relative;">
      <div class="center-line"></div>

      <!-- Spot 1 - Meditation -->
      <div class="parking-spot" id="spot-1" onclick="selectCar(1)">
        <div class="spot-number">P-01</div>
        <div class="parking-meter">
          <div class="meter-dot"></div>
          <span class="meter-text">14d</span>
        </div>
        <div class="car" id="car-1" style="background: linear-gradient(135deg, #7C3AED, #6D28D9);">
          <div class="mirror-left" style="background:#6D28D9;"></div>
          <div class="mirror-right" style="background:#6D28D9;"></div>
          <div class="headlight headlight-left"></div>
          <div class="headlight headlight-right"></div>
          <span class="car-emoji">&#129502;</span>
          <div class="taillight taillight-left"></div>
          <div class="taillight taillight-right"></div>
        </div>
        <div class="habit-label"><span>Meditation</span></div>
      </div>

      <!-- Spot 2 - Reading -->
      <div class="parking-spot" id="spot-2" onclick="selectCar(2)">
        <div class="spot-number">P-02</div>
        <div class="parking-meter">
          <div class="meter-dot"></div>
          <span class="meter-text">31d</span>
        </div>
        <div class="car" id="car-2" style="background: linear-gradient(135deg, #2563EB, #1D4ED8);">
          <div class="mirror-left" style="background:#1D4ED8;"></div>
          <div class="mirror-right" style="background:#1D4ED8;"></div>
          <div class="headlight headlight-left"></div>
          <div class="headlight headlight-right"></div>
          <span class="car-emoji">&#128214;</span>
          <div class="taillight taillight-left"></div>
          <div class="taillight taillight-right"></div>
        </div>
        <div class="habit-label"><span>Reading</span></div>
      </div>

      <!-- Spot 3 - Running -->
      <div class="parking-spot" id="spot-3" onclick="selectCar(3)">
        <div class="spot-number">P-03</div>
        <div class="parking-meter">
          <div class="meter-dot"></div>
          <span class="meter-text">7d</span>
        </div>
        <div class="car" id="car-3" style="background: linear-gradient(135deg, #059669, #047857);">
          <div class="mirror-left" style="background:#047857;"></div>
          <div class="mirror-right" style="background:#047857;"></div>
          <div class="headlight headlight-left"></div>
          <div class="headlight headlight-right"></div>
          <span class="car-emoji">&#127939;</span>
          <div class="taillight taillight-left"></div>
          <div class="taillight taillight-right"></div>
        </div>
        <div class="habit-label"><span>Running</span></div>
      </div>

      <!-- Spot 4 - Journaling -->
      <div class="parking-spot" id="spot-4" onclick="selectCar(4)">
        <div class="spot-number">P-04</div>
        <div class="parking-meter">
          <div class="meter-dot"></div>
          <span class="meter-text">42d</span>
        </div>
        <div class="car" id="car-4" style="background: linear-gradient(135deg, #D97706, #B45309);">
          <div class="mirror-left" style="background:#B45309;"></div>
          <div class="mirror-right" style="background:#B45309;"></div>
          <div class="headlight headlight-left"></div>
          <div class="headlight headlight-right"></div>
          <span class="car-emoji">&#128221;</span>
          <div class="taillight taillight-left"></div>
          <div class="taillight taillight-right"></div>
        </div>
        <div class="habit-label"><span>Journaling</span></div>
      </div>
    </div>

    <!-- Bottom hint -->
    <div style="text-align:center; padding:16px 0;">
      <p style="font-size:12px; color:rgba(255,255,255,0.25);">Tap a car to drive out or tow away</p>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closePanel()"></div>

    <!-- Action Panel -->
    <div class="action-panel" id="actionPanel">
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:18px;">
        <div id="panelEmoji" style="font-size:28px;">&#129502;</div>
        <div>
          <h3 id="panelTitle" style="font-size:16px; font-weight:700; color:white;">Meditation</h3>
          <p id="panelMeta" class="mono" style="font-size:11px; color:rgba(255,255,255,0.4);">Parked 14 days ago</p>
        </div>
      </div>
      <div id="panelStats" style="display:flex; gap:12px; margin-bottom:18px;">
        <div style="flex:1; background:rgba(255,255,255,0.05); border-radius:10px; padding:10px; text-align:center;">
          <p style="font-size:10px; color:rgba(255,255,255,0.4); margin-bottom:2px;">Best Streak</p>
          <p style="font-size:18px; font-weight:700; color:white;" id="panelStreak">12</p>
        </div>
        <div style="flex:1; background:rgba(255,255,255,0.05); border-radius:10px; padding:10px; text-align:center;">
          <p style="font-size:10px; color:rgba(255,255,255,0.4); margin-bottom:2px;">Completions</p>
          <p style="font-size:18px; font-weight:700; color:white;" id="panelCompletions">84</p>
        </div>
        <div style="flex:1; background:rgba(255,255,255,0.05); border-radius:10px; padding:10px; text-align:center;">
          <p style="font-size:10px; color:rgba(255,255,255,0.4); margin-bottom:2px;">Rate</p>
          <p style="font-size:18px; font-weight:700; color:white;" id="panelRate">68%</p>
        </div>
      </div>
      <button class="action-btn btn-drive" onclick="driveOut()">
        <i data-lucide="arrow-up-from-line" style="width:20px; height:20px;"></i>
        Drive Out &mdash; Restore Habit
      </button>
      <button class="action-btn btn-tow" onclick="towAway()">
        <i data-lucide="truck" style="width:20px; height:20px;"></i>
        Tow Away &mdash; Delete Forever
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    const habits = {
      1: { name: 'Meditation', emoji: '\u{1F9D8}', days: 14, streak: 12, completions: 84, rate: '68%' },
      2: { name: 'Reading', emoji: '\u{1F4D6}', days: 31, streak: 21, completions: 156, rate: '74%' },
      3: { name: 'Running', emoji: '\u{1F3C3}', days: 7, streak: 8, completions: 42, rate: '55%' },
      4: { name: 'Journaling', emoji: '\u{1F4DD}', days: 42, streak: 30, completions: 210, rate: '82%' }
    };

    let selectedCar = null;
    let parkedCount = 4;

    function selectCar(id) {
      const spot = document.getElementById('spot-' + id);
      if (spot.classList.contains('empty-spot')) return;

      // Deselect previous
      if (selectedCar) {
        const prev = document.getElementById('car-' + selectedCar);
        if (prev) prev.classList.remove('car-selected');
      }

      selectedCar = id;
      const car = document.getElementById('car-' + id);
      car.classList.add('car-selected');

      // Update panel
      const h = habits[id];
      document.getElementById('panelEmoji').textContent = h.emoji;
      document.getElementById('panelTitle').textContent = h.name;
      document.getElementById('panelMeta').textContent = 'Parked ' + h.days + ' days ago';
      document.getElementById('panelStreak').textContent = h.streak;
      document.getElementById('panelCompletions').textContent = h.completions;
      document.getElementById('panelRate').textContent = h.rate;

      // Show panel
      document.getElementById('actionPanel').classList.add('show');
      document.getElementById('overlay').classList.add('show');
    }

    function closePanel() {
      document.getElementById('actionPanel').classList.remove('show');
      document.getElementById('overlay').classList.remove('show');
      if (selectedCar) {
        const car = document.getElementById('car-' + selectedCar);
        if (car) car.classList.remove('car-selected');
        selectedCar = null;
      }
    }

    function driveOut() {
      if (!selectedCar) return;
      const car = document.getElementById('car-' + selectedCar);
      const spot = document.getElementById('spot-' + selectedCar);

      car.classList.add('driving-out');
      closePanel();

      setTimeout(() => {
        spot.classList.add('empty-spot');
        parkedCount--;
        document.getElementById('parkedCount').textContent = parkedCount;
      }, 700);
    }

    function towAway() {
      if (!selectedCar) return;
      const car = document.getElementById('car-' + selectedCar);
      const spot = document.getElementById('spot-' + selectedCar);

      car.classList.add('towing');
      closePanel();

      setTimeout(() => {
        spot.classList.add('empty-spot');
        parkedCount--;
        document.getElementById('parkedCount').textContent = parkedCount;
      }, 800);
    }
  </script>
</body>
</html>
