<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Contextual Tooltips</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&family=Literata:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    body {
      font-family: 'DM Sans', sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
      background: #1a1a1a !important;
    }

    .font-literata {
      font-family: 'Literata', serif !important;
    }

    .font-dm {
      font-family: 'DM Sans', sans-serif !important;
    }

    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    /* Pulsing ring around the + button */
    @keyframes ringPulse {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(5, 150, 105, 0.5);
      }
      50% {
        box-shadow: 0 0 0 10px rgba(5, 150, 105, 0);
      }
    }

    .ring-pulse {
      animation: ringPulse 2s ease-in-out infinite !important;
    }

    /* Pointer bounce */
    @keyframes pointerBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .pointer-bounce {
      animation: pointerBounce 1.2s ease-in-out infinite !important;
    }

    /* Tooltip fade in */
    @keyframes tooltipFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tooltip-animate {
      animation: tooltipFadeIn 0.5s ease-out 0.3s forwards !important;
      opacity: 0;
    }

    /* Overlay fade in */
    @keyframes overlayFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .overlay-animate {
      animation: overlayFadeIn 0.4s ease-out forwards !important;
    }
  </style>
</head>
<body>

  <!-- Page wrapper: dark background with centered phone -->
  <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a1a;padding:20px;">

    <!-- Phone frame -->
    <div style="width:375px;height:812px;border-radius:40px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.5);position:relative;background:#F5F1ED;">

      <!-- STATUS BAR -->
      <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;background:#F5F1ED;position:relative;z-index:1;">
        <span style="font-family:'DM Sans';font-size:15px;font-weight:600;color:#2D2A26;">9:41</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <i data-lucide="signal" style="width:16px;height:16px;color:#2D2A26;"></i>
          <i data-lucide="wifi" style="width:16px;height:16px;color:#2D2A26;"></i>
          <i data-lucide="battery-full" style="width:16px;height:16px;color:#2D2A26;"></i>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- BACKGROUND LAYER: The "real app" UI       -->
      <!-- ========================================= -->
      <div style="position:absolute;top:54px;left:0;right:0;bottom:0;z-index:1;">

        <!-- App header -->
        <div style="display:flex;justify-content:space-between;align-items:center;padding:16px 24px 12px !important;">
          <h1 class="font-literata" style="font-size:22px !important;font-weight:700 !important;color:#2D2A26 !important;">Today</h1>
          <i data-lucide="settings" style="width:22px;height:22px;color:#6B6560;stroke-width:1.8;"></i>
        </div>

        <!-- Date indicator -->
        <div style="padding:0 24px 20px !important;">
          <p class="font-dm" style="font-size:14px !important;color:#6B6560 !important;font-weight:500 !important;">Tuesday, April 1</p>
        </div>

        <!-- Empty state area -->
        <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 40px !important;text-align:center !important;">
          <!-- Faded illustration placeholder -->
          <div style="width:120px;height:120px;border-radius:50%;background:#EDEAE5 !important;display:flex;align-items:center;justify-content:center;margin-bottom:24px !important;">
            <i data-lucide="leaf" style="width:48px;height:48px;color:#DDD8D2;stroke-width:1.5;"></i>
          </div>
          <p class="font-dm" style="font-size:17px !important;font-weight:600 !important;color:#C4BFB7 !important;margin-bottom:8px !important;">No habits yet</p>
          <p class="font-dm" style="font-size:14px !important;color:#DDD8D2 !important;line-height:1.5 !important;">
            Start building your daily routine<br>one small habit at a time.
          </p>
        </div>

        <!-- Bottom action bar with "+" button -->
        <div style="position:absolute;bottom:0;left:0;right:0;height:88px;display:flex;align-items:center;justify-content:center;">
          <!-- The + button (will be visible through overlay cutout) -->
          <div id="add-button-bg" style="
            width:56px;
            height:56px;
            border-radius:50%;
            background:#059669 !important;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
          ">
            <i data-lucide="plus" style="width:26px;height:26px;color:#fff;stroke-width:2.5;"></i>
          </div>
        </div>
      </div>

      <!-- ========================================= -->
      <!-- OVERLAY LAYER: Dark overlay with cutout   -->
      <!-- ========================================= -->
      <div class="overlay-animate" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:10;">

        <!-- Dark overlay using SVG with cutout -->
        <svg width="375" height="812" style="position:absolute;top:0;left:0;">
          <defs>
            <mask id="cutout-mask">
              <!-- White = visible (dark overlay shows), Black = hidden (cutout) -->
              <rect width="375" height="812" fill="white"/>
              <!-- Cutout circle for the + button -->
              <!-- Button center: x=187.5, y=812-88+28 = 752 (approximately) -->
              <circle cx="187.5" cy="724" r="38" fill="black"/>
            </mask>
          </defs>
          <rect width="375" height="812" fill="rgba(0,0,0,0.82)" mask="url(#cutout-mask)"/>
        </svg>

        <!-- Glowing ring around the + button (positioned in the cutout) -->
        <div class="ring-pulse" style="
          position:absolute !important;
          bottom:54px !important;
          left:50% !important;
          transform:translateX(-50%) !important;
          width:68px !important;
          height:68px !important;
          border-radius:50% !important;
          border:4px solid #059669 !important;
          pointer-events:none !important;
        "></div>

        <!-- The visible + button in the cutout (interactive) -->
        <div style="
          position:absolute !important;
          bottom:60px !important;
          left:50% !important;
          transform:translateX(-50%) !important;
          width:56px !important;
          height:56px !important;
          border-radius:50% !important;
          background:#059669 !important;
          display:flex !important;
          align-items:center !important;
          justify-content:center !important;
          cursor:pointer !important;
          z-index:12 !important;
        ">
          <i data-lucide="plus" style="width:26px;height:26px;color:#fff;stroke-width:2.5;"></i>
        </div>

        <!-- Pointer hand emoji -->
        <div class="pointer-bounce" style="
          position:absolute !important;
          bottom:28px !important;
          left:50% !important;
          transform:translateX(-50%) !important;
          font-size:36px !important;
          z-index:12 !important;
          pointer-events:none !important;
          line-height:1 !important;
        ">&#x1F446;</div>

        <!-- ========================================= -->
        <!-- TOOLTIP CARD                              -->
        <!-- ========================================= -->
        <div class="tooltip-animate" style="
          position:absolute !important;
          bottom:140px !important;
          left:50% !important;
          transform:translateX(-50%) !important;
          width:280px !important;
          z-index:15 !important;
        ">
          <!-- Tooltip body -->
          <div style="
            background:linear-gradient(135deg, #2D2A26, #3a3632) !important;
            border:1.5px solid #059669 !important;
            border-radius:16px !important;
            padding:20px !important;
            position:relative !important;
          ">
            <!-- Title -->
            <p class="font-dm" style="
              font-size:17px !important;
              font-weight:700 !important;
              color:#ffffff !important;
              margin-bottom:8px !important;
              line-height:1.3 !important;
            ">Let's Get Started!</p>

            <!-- Description -->
            <p class="font-dm" style="
              font-size:14px !important;
              font-weight:400 !important;
              color:rgba(255,255,255,0.75) !important;
              line-height:1.55 !important;
              margin-bottom:18px !important;
            ">Tap here to create your first habit. Keep it simple — small habits lead to big changes.</p>

            <!-- Progress dots -->
            <div style="display:flex;align-items:center;justify-content:center;gap:8px !important;">
              <!-- Dot 1: active pill -->
              <div style="
                width:20px !important;
                height:8px !important;
                border-radius:9999px !important;
                background:#059669 !important;
              "></div>
              <!-- Dot 2 -->
              <div style="
                width:8px !important;
                height:8px !important;
                border-radius:50% !important;
                background:rgba(255,255,255,0.2) !important;
              "></div>
              <!-- Dot 3 -->
              <div style="
                width:8px !important;
                height:8px !important;
                border-radius:50% !important;
                background:rgba(255,255,255,0.2) !important;
              "></div>
              <!-- Dot 4 -->
              <div style="
                width:8px !important;
                height:8px !important;
                border-radius:50% !important;
                background:rgba(255,255,255,0.2) !important;
              "></div>
            </div>
          </div>

          <!-- Arrow pointing down -->
          <div style="
            width:0 !important;
            height:0 !important;
            border-left:12px solid transparent !important;
            border-right:12px solid transparent !important;
            border-top:12px solid #3a3632 !important;
            margin:0 auto !important;
            position:relative !important;
            top:-1px !important;
          "></div>
        </div>

        <!-- ========================================= -->
        <!-- SKIP TUTORIAL BUTTON (top right)          -->
        <!-- ========================================= -->
        <div style="
          position:absolute !important;
          top:62px !important;
          right:16px !important;
          z-index:15 !important;
        ">
          <button class="font-dm" style="
            font-size:14px !important;
            font-weight:500 !important;
            color:#ffffff !important;
            background:rgba(255,255,255,0.1) !important;
            backdrop-filter:blur(12px) !important;
            -webkit-backdrop-filter:blur(12px) !important;
            border:none !important;
            border-radius:9999px !important;
            padding:8px 16px !important;
            cursor:pointer !important;
            transition:background 0.2s ease !important;
          " onmouseover="this.style.background='rgba(255,255,255,0.18)'" onmouseout="this.style.background='rgba(255,255,255,0.1)'">
            Skip Tutorial
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
