<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Habit - V10 Improved (6 Enhancements)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    body { background: #111; }

    .paper-bg { background: #faf9f7; }

    .pressable { transition: transform 0.1s ease; cursor: pointer; }
    .pressable:active { transform: scale(0.96); }

    /* Improvement #1: Hero Input Styling */
    .habit-input {
      width: 100%;
      height: 60px;
      border: none;
      border-bottom: 2px solid #e7e5e4;
      background: transparent;
      font-size: 22px;
      font-weight: 600;
      text-align: center;
      color: #1c1917;
      transition: all 0.2s ease;
    }

    .habit-input::placeholder {
      color: #a8a29e;
      font-weight: 400;
    }

    .habit-input:focus {
      outline: none;
      border-bottom-color: #10B981;
    }

    .emoji-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: white;
      border: 1.5px solid #e7e5e4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.15s ease;
    }

    .emoji-chip:hover { border-color: #d6d3d1; }
    .emoji-chip.selected {
      border-color: #10B981;
      border-width: 2px;
      background: #ECFDF5;
    }

    /* Improvement #2: Fixed gap spacing for colors */
    .color-dot {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      transition: all 0.15s ease;
      border: 2px solid transparent;
    }

    .color-dot:hover { transform: scale(1.1); }
    .color-dot.selected {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px white, 0 0 0 4px currentColor;
    }

    /* Improvement #3: Simplified reminder pills */
    .reminder-chip {
      padding: 10px 14px;
      border-radius: 20px;
      background: white;
      border: 1.5px solid #e7e5e4;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-size: 13px;
      font-weight: 500;
      color: #57534e;
    }

    .reminder-chip:hover { border-color: #d6d3d1; }
    .reminder-chip.selected {
      border-color: #10B981;
      border-width: 2px;
      background: #ECFDF5;
      color: #047857;
    }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="min-h-screen flex items-end justify-center p-4">
  <!-- iPhone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(4px);">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[78%] paper-bg rounded-t-[28px] flex flex-col shadow-2xl">

        <!-- Improvement #5: Header with just X (no title) -->
        <div class="flex items-center justify-end px-5 py-4">
          <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-stone-100 pressable">
            <i data-lucide="x" class="w-6 h-6 text-stone-400"></i>
          </button>
        </div>

        <!-- Content - No scroll needed (Improvement #6: Inline button) -->
        <div class="flex-1 px-6 pb-8">

          <!-- Improvement #1: Hero Input (larger, centered, underline only) -->
          <div class="mb-8 mt-2">
            <input
              type="text"
              class="habit-input"
              placeholder="Name your habit..."
              value="Read for 20 minutes"
            />
          </div>

          <!-- Improvement #4: No section labels -->
          <!-- Emoji Row - Improvement #5: Show more (8 suggestions) -->
          <div class="flex justify-center gap-2.5 mb-8">
            <button class="emoji-chip selected">📖</button>
            <button class="emoji-chip">📚</button>
            <button class="emoji-chip">✍️</button>
            <button class="emoji-chip">🎯</button>
            <button class="emoji-chip">💪</button>
            <button class="emoji-chip">🧘</button>
            <button class="emoji-chip">✨</button>
            <button class="emoji-chip">🏃</button>
            <button class="emoji-chip" style="background: #f5f5f4; border-style: dashed;">
              <i data-lucide="plus" class="w-5 h-5 text-stone-400"></i>
            </button>
          </div>

          <!-- Improvement #2: Colors with fixed gap (not justify-between) -->
          <div class="flex justify-center gap-2.5 flex-wrap mb-8">
            <button class="color-dot" style="background: #EF4444; color: #EF4444;"></button>
            <button class="color-dot" style="background: #F97316; color: #F97316;"></button>
            <button class="color-dot" style="background: #FBBF24; color: #FBBF24;"></button>
            <button class="color-dot" style="background: #84CC16; color: #84CC16;"></button>
            <button class="color-dot selected" style="background: #10B981; color: #10B981;"></button>
            <button class="color-dot" style="background: #14B8A6; color: #14B8A6;"></button>
            <button class="color-dot" style="background: #06B6D4; color: #06B6D4;"></button>
            <button class="color-dot" style="background: #3B82F6; color: #3B82F6;"></button>
            <button class="color-dot" style="background: #8B5CF6; color: #8B5CF6;"></button>
            <button class="color-dot" style="background: #A855F7; color: #A855F7;"></button>
            <button class="color-dot" style="background: #EC4899; color: #EC4899;"></button>
            <button class="color-dot" style="background: #78716C; color: #78716C;"></button>
          </div>

          <!-- Improvement #3: Simplified reminder labels (emoji + short text) -->
          <div class="flex justify-center gap-2 mb-10">
            <button class="reminder-chip">
              <span class="text-lg">🔕</span>
              <span>None</span>
            </button>
            <button class="reminder-chip selected">
              <span class="text-lg">🌅</span>
              <span>7 AM</span>
            </button>
            <button class="reminder-chip">
              <span class="text-lg">☀️</span>
              <span>Noon</span>
            </button>
            <button class="reminder-chip">
              <span class="text-lg">🌙</span>
              <span>8 PM</span>
            </button>
          </div>

          <!-- Improvement #6: Inline button (no sticky footer) -->
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-[17px] font-semibold text-white">Create Habit</span>
          </button>

        </div>

        <!-- Home Indicator -->
        <div class="flex justify-center pb-4">
          <div class="w-32 h-1 rounded-full bg-stone-300/50"></div>
        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
