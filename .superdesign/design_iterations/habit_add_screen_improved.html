<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Habit - Improved (Simple + 5 Enhancements)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    body { background: #111; }

    .paper-bg { background: #faf9f7; }

    .pressable { transition: transform 0.1s ease; cursor: pointer; }
    .pressable:active { transform: scale(0.96); }

    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      transition: all 0.15s ease;
      border: 2px solid transparent;
    }

    .color-swatch:hover { transform: scale(1.1); }
    .color-swatch.selected {
      transform: scale(1.15);
      box-shadow: 0 0 0 3px white, 0 0 0 5px currentColor;
    }

    .emoji-chip {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: white;
      border: 1.5px solid #e7e5e4;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.15s ease;
    }

    .emoji-chip:hover { border-color: #d6d3d1; }
    .emoji-chip.selected {
      border-color: #10B981;
      border-width: 2px;
      background: #ECFDF5;
    }

    .reminder-pill {
      flex: 1;
      padding: 12px 8px;
      border-radius: 12px;
      background: white;
      border: 1.5px solid #e7e5e4;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
    }

    .reminder-pill:hover { border-color: #d6d3d1; }
    .reminder-pill.selected {
      border-color: #10B981;
      border-width: 2px;
      background: #ECFDF5;
    }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="min-h-screen flex items-end justify-center p-4">
  <!-- iPhone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative" style="background: rgba(0,0,0,0.5); backdrop-filter: blur(4px);">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[85%] paper-bg rounded-t-[28px] flex flex-col shadow-2xl">

        <!-- Header - Clean with just X button -->
        <div class="flex items-center justify-between px-5 py-4">
          <div class="w-10"></div>
          <h1 class="text-[17px] font-semibold text-stone-800">New Habit</h1>
          <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-stone-100 pressable">
            <i data-lucide="x" class="w-6 h-6 text-stone-400"></i>
          </button>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 pb-8">

          <!-- NO Templates at Top - Improvement #1: Removed -->

          <!-- NO Live Preview Card - Improvement #2: Removed -->

          <!-- Habit Name -->
          <div class="mb-6 mt-4">
            <label class="text-[13px] font-semibold uppercase text-stone-500 mb-3 block" style="letter-spacing: 0.5px;">Habit Name</label>
            <input
              type="text"
              class="w-full h-14 px-4 bg-white border-2 border-stone-200 rounded-xl text-[17px] font-medium text-stone-800 focus:outline-none focus:border-emerald-500 focus:shadow-[0_0_0_3px_rgba(16,185,129,0.1)] transition-all"
              placeholder="e.g. Read for 20 minutes"
              value="Read for 20 minutes"
            />
            <p class="mt-2 text-xs text-stone-400">Tip: Be specific — time, trigger, place</p>
          </div>

          <!-- Emoji Picker -->
          <div class="mb-6">
            <label class="text-[13px] font-semibold uppercase text-stone-500 mb-3 block" style="letter-spacing: 0.5px;">Icon</label>
            <div class="flex gap-2.5">
              <button class="emoji-chip selected">📖</button>
              <button class="emoji-chip">💪</button>
              <button class="emoji-chip">🏃</button>
              <button class="emoji-chip">🧘</button>
              <button class="emoji-chip">✨</button>
              <button class="emoji-chip" style="background: #f5f5f4; border-style: dashed;">
                <i data-lucide="plus" class="w-5 h-5 text-stone-400"></i>
              </button>
            </div>
          </div>

          <!-- Color Picker - Improvement #3: 12 colors (36px each) -->
          <div class="mb-6">
            <label class="text-[13px] font-semibold uppercase text-stone-500 mb-3 block" style="letter-spacing: 0.5px;">Color</label>
            <div class="flex justify-between">
              <button class="color-swatch" style="background: #EF4444; color: #EF4444;"></button>
              <button class="color-swatch" style="background: #F97316; color: #F97316;"></button>
              <button class="color-swatch" style="background: #FBBF24; color: #FBBF24;"></button>
              <button class="color-swatch" style="background: #84CC16; color: #84CC16;"></button>
              <button class="color-swatch selected" style="background: #10B981; color: #10B981;"></button>
              <button class="color-swatch" style="background: #14B8A6; color: #14B8A6;"></button>
              <button class="color-swatch" style="background: #06B6D4; color: #06B6D4;"></button>
              <button class="color-swatch" style="background: #3B82F6; color: #3B82F6;"></button>
              <button class="color-swatch" style="background: #8B5CF6; color: #8B5CF6;"></button>
              <button class="color-swatch" style="background: #A855F7; color: #A855F7;"></button>
              <button class="color-swatch" style="background: #EC4899; color: #EC4899;"></button>
              <button class="color-swatch" style="background: #78716C; color: #78716C;"></button>
            </div>
          </div>

          <!-- Reminder - Improvement #4: 4 quick options instead of toggle + picker -->
          <div class="mb-6">
            <label class="text-[13px] font-semibold uppercase text-stone-500 mb-3 block" style="letter-spacing: 0.5px;">Daily Reminder</label>
            <div class="flex gap-2">
              <button class="reminder-pill">
                <span class="text-xl">🔕</span>
                <span class="text-xs font-semibold text-stone-600">None</span>
              </button>
              <button class="reminder-pill selected">
                <span class="text-xl">🌅</span>
                <span class="text-xs font-semibold text-emerald-700">Morning</span>
                <span class="text-[10px] text-emerald-600">7:00 AM</span>
              </button>
              <button class="reminder-pill">
                <span class="text-xl">☀️</span>
                <span class="text-xs font-semibold text-stone-600">Midday</span>
                <span class="text-[10px] text-stone-400">12:00 PM</span>
              </button>
              <button class="reminder-pill">
                <span class="text-xl">🌙</span>
                <span class="text-xs font-semibold text-stone-600">Evening</span>
                <span class="text-[10px] text-stone-400">8:00 PM</span>
              </button>
            </div>
          </div>

          <!-- Spacer for sticky button -->
          <div class="h-24"></div>

        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 left-0 right-0 px-5 pb-8 pt-4 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent">
          <!-- Create Button -->
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-[17px] font-semibold text-white">Create Habit</span>
          </button>

          <!-- Home Indicator -->
          <div class="flex justify-center mt-4">
            <div class="w-32 h-1 rounded-full bg-stone-300/60"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
