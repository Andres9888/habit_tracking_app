<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar Heatmap - Habit Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif !important; }
    body { background: #1c1917; }

    .cell-completed { background: #10b981; }
    .cell-empty { background: #f5f5f4; }
    .cell-today { background: #fef3c7; border: 2px solid #fbbf24; }
    .cell-today-done { background: #10b981; border: 2px solid #fbbf24; }
    .cell-future { background: #fafaf9; border: 1px dashed #d6d3d1; }

    .gradient-bg {
      background: linear-gradient(135deg, rgba(236, 253, 245, 0.3) 0%, white 50%, rgba(204, 251, 241, 0.3) 100%);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    .pulse { animation: pulse 1.4s ease-in-out infinite; }
  </style>
</head>
<body class="min-h-screen p-6 flex items-center justify-center">

  <!-- Phone Frame -->
  <div class="w-[390px] bg-stone-100 rounded-[3rem] p-3 shadow-2xl">
    <div class="bg-stone-50 rounded-[2.5rem] overflow-hidden min-h-[700px]">

      <!-- Status Bar Mock -->
      <div class="h-12 flex items-center justify-center">
        <div class="w-24 h-6 bg-stone-900 rounded-full"></div>
      </div>

      <!-- Content Area -->
      <div class="px-4 pb-8 space-y-4">

        <!-- Header -->
        <div class="flex items-center gap-3 py-2">
          <div class="w-8 h-8 rounded-full bg-stone-200 flex items-center justify-center">
            <svg class="w-4 h-4 text-stone-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </div>
          <div class="flex-1 text-center">
            <span class="text-2xl mr-2">🏃</span>
            <span class="text-lg font-bold text-stone-800">Morning Run</span>
          </div>
          <div class="w-8"></div>
        </div>

        <!-- Streak Section (Context) -->
        <div class="rounded-2xl overflow-hidden shadow-sm" style="background: linear-gradient(135deg, rgba(255,237,213,0.3) 0%, white 50%, rgba(254,243,199,0.3) 100%);">
          <div class="p-5">
            <div class="flex items-center justify-center gap-2 mb-3">
              <div class="h-8 w-8 flex items-center justify-center rounded-lg bg-orange-100">
                <span class="text-orange-500">🔥</span>
              </div>
              <span class="text-lg font-bold text-stone-800">Streak</span>
              <span class="text-lg">⚡</span>
            </div>
            <div class="text-center">
              <span class="text-5xl font-bold text-orange-600">12</span>
              <p class="text-sm text-stone-500">days</p>
            </div>
          </div>
        </div>

        <!-- Calendar Heatmap (NEW) -->
        <div class="rounded-2xl overflow-hidden shadow-sm gradient-bg">
          <div class="p-5">

            <!-- Header with Navigation -->
            <div class="flex items-center justify-between mb-4">
              <div class="flex items-center gap-2">
                <div class="h-8 w-8 flex items-center justify-center rounded-lg bg-emerald-100">
                  <svg class="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
                    <line x1="16" y1="2" x2="16" y2="6"/>
                    <line x1="8" y1="2" x2="8" y2="6"/>
                    <line x1="3" y1="10" x2="21" y2="10"/>
                  </svg>
                </div>
                <span class="text-lg font-bold text-stone-800">Activity</span>
              </div>

              <div class="flex items-center gap-2">
                <button class="p-1 hover:bg-stone-100 rounded">
                  <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                  </svg>
                </button>
                <span class="text-sm font-medium text-stone-600 min-w-[80px] text-center">Dec 2025</span>
                <button class="p-1 hover:bg-stone-100 rounded opacity-30" disabled>
                  <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                  </svg>
                </button>
              </div>
            </div>

            <!-- Day Labels -->
            <div class="grid grid-cols-7 gap-1 mb-2">
              <span class="text-[10px] font-medium text-stone-400 text-center">S</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">M</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">T</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">W</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">T</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">F</span>
              <span class="text-[10px] font-medium text-stone-400 text-center">S</span>
            </div>

            <!-- Calendar Grid -->
            <div class="space-y-1">
              <!-- Week 1: Dec starts on Monday -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg"></div> <!-- Empty -->
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-empty"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
              </div>

              <!-- Week 2 -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-empty"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-empty"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
              </div>

              <!-- Week 3 -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-empty"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
              </div>

              <!-- Week 4 (Current) -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-empty"></div>
                <div class="aspect-square rounded-lg cell-completed"></div>
                <div class="aspect-square rounded-lg cell-today-done pulse flex items-center justify-center">
                  <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
                  </svg>
                </div>
                <div class="aspect-square rounded-lg cell-future"></div>
              </div>

              <!-- Week 5 -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
              </div>

              <!-- Week 6 (partial) -->
              <div class="grid grid-cols-7 gap-1">
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg cell-future"></div>
                <div class="aspect-square rounded-lg"></div>
                <div class="aspect-square rounded-lg"></div>
                <div class="aspect-square rounded-lg"></div>
                <div class="aspect-square rounded-lg"></div>
              </div>
            </div>

            <!-- Legend & Stats -->
            <div class="mt-4 flex items-center justify-center gap-4">
              <div class="flex items-center gap-1.5">
                <div class="h-3 w-3 rounded-sm bg-emerald-500"></div>
                <span class="text-xs text-stone-600">17 days</span>
              </div>
              <span class="text-stone-300">•</span>
              <span class="text-xs font-medium text-emerald-600">85% this month</span>
            </div>

          </div>
        </div>

        <!-- Habit Strength Section (Context) -->
        <div class="rounded-2xl overflow-hidden shadow-sm bg-white/90 p-5">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-lg font-semibold text-stone-800">Habit Strength</p>
              <p class="text-sm text-stone-500">72% · growing</p>
            </div>
            <svg class="w-5 h-5 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </div>
        </div>

      </div>
    </div>
  </div>

</body>
</html>
