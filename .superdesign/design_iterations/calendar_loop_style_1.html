<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - Loop Habit Tracker Style</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }
    body { background: #78716c; }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: #fafaf9;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .notch {
      width: 150px;
      height: 30px;
      background: #1c1917;
      border-radius: 0 0 20px 20px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    /* Heatmap cell */
    .heat-cell {
      width: 10px;
      height: 10px;
      border-radius: 2px;
    }

    /* Calendar day cell */
    .cal-day {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 12px;
      position: relative;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cal-day:hover {
      background: #f5f5f4;
    }

    .cal-day.completed {
      background: #fee2e2;
    }

    .cal-day.completed::after {
      content: '';
      width: 6px;
      height: 6px;
      background: #dc2626;
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
    }

    .cal-day.today {
      font-weight: 700;
      box-shadow: inset 0 0 0 2px #dc2626;
    }

    .cal-day.other-month {
      color: #d6d3d1;
    }

    .cal-day.future {
      color: #a8a29e;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">

  <div class="phone-frame">
    <div class="notch"></div>

    <!-- Content -->
    <div class="pt-14 px-4 h-full flex flex-col">

      <!-- Header -->
      <div class="flex items-center justify-between py-3">
        <div class="flex items-center gap-3">
          <!-- Habit Icon -->
          <div class="w-10 h-10 bg-red-100 rounded-xl flex items-center justify-center">
            <svg class="w-5 h-5 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
          </div>
          <div>
            <h1 class="font-bold text-stone-900 text-lg">Morning Run</h1>
            <p class="text-stone-500 text-sm">Exercise daily</p>
          </div>
        </div>
        <button class="w-10 h-10 rounded-full bg-stone-100 flex items-center justify-center">
          <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <!-- Compact Heatmap (6 months) -->
      <div class="bg-white rounded-2xl p-4 mt-2 shadow-sm border border-stone-100">
        <!-- Month Labels -->
        <div class="flex text-xs text-stone-400 mb-2 ml-8">
          <span class="flex-1">Jul</span>
          <span class="flex-1">Aug</span>
          <span class="flex-1">Sep</span>
          <span class="flex-1">Oct</span>
          <span class="flex-1">Nov</span>
          <span class="flex-1">Dec</span>
        </div>

        <!-- Heatmap Grid -->
        <div class="flex flex-col gap-1">
          <!-- Row 1: Tue -->
          <div class="flex items-center gap-1">
            <span class="text-xs text-stone-400 w-6">Tu</span>
            <div class="flex gap-[3px] flex-1">
              <!-- July -->
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-100"></div>
              <!-- August -->
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-300"></div>
              <!-- September -->
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-400"></div>
              <!-- October -->
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <!-- November -->
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <!-- December -->
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell border border-stone-300 bg-white"></div>
            </div>
          </div>

          <!-- Row 2: Thu -->
          <div class="flex items-center gap-1">
            <span class="text-xs text-stone-400 w-6">Th</span>
            <div class="flex gap-[3px] flex-1">
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
            </div>
          </div>

          <!-- Row 3: Sat -->
          <div class="flex items-center gap-1">
            <span class="text-xs text-stone-400 w-6">Sa</span>
            <div class="flex gap-[3px] flex-1">
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-100"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-200"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-300"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-400"></div>
              <div class="heat-cell bg-red-500"></div>
              <div class="heat-cell bg-red-500"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Stats Row -->
      <div class="flex items-center gap-2 mt-3 px-1">
        <span class="px-3 py-1.5 bg-stone-100 rounded-full text-sm font-medium text-stone-700">Daily</span>
        <span class="px-3 py-1.5 bg-red-50 rounded-full text-sm font-medium text-red-600 flex items-center gap-1">
          <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
          </svg>
          12
        </span>
        <div class="flex-1"></div>
        <button class="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center">
          <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
          </svg>
        </button>
        <button class="w-9 h-9 rounded-full bg-stone-100 flex items-center justify-center">
          <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
      </div>

      <!-- Divider -->
      <div class="h-px bg-stone-200 mt-3"></div>

      <!-- Calendar Grid -->
      <div class="flex-1 mt-3">
        <!-- Day Headers -->
        <div class="grid grid-cols-7 mb-2">
          <div class="text-center text-sm font-medium text-stone-500">Mon</div>
          <div class="text-center text-sm font-medium text-stone-500">Tue</div>
          <div class="text-center text-sm font-medium text-stone-500">Wed</div>
          <div class="text-center text-sm font-medium text-stone-500">Thu</div>
          <div class="text-center text-sm font-medium text-stone-500">Fri</div>
          <div class="text-center text-sm font-medium text-stone-500">Sat</div>
          <div class="text-center text-sm font-medium text-stone-500">Sun</div>
        </div>

        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-y-1">
          <!-- Week 1 -->
          <div class="cal-day other-month">25</div>
          <div class="cal-day other-month">26</div>
          <div class="cal-day other-month">27</div>
          <div class="cal-day other-month">28</div>
          <div class="cal-day other-month">29</div>
          <div class="cal-day other-month">30</div>
          <div class="cal-day completed">1</div>

          <!-- Week 2 -->
          <div class="cal-day completed">2</div>
          <div class="cal-day completed">3</div>
          <div class="cal-day completed">4</div>
          <div class="cal-day completed">5</div>
          <div class="cal-day">6</div>
          <div class="cal-day completed">7</div>
          <div class="cal-day completed">8</div>

          <!-- Week 3 -->
          <div class="cal-day completed">9</div>
          <div class="cal-day completed">10</div>
          <div class="cal-day">11</div>
          <div class="cal-day completed">12</div>
          <div class="cal-day completed">13</div>
          <div class="cal-day">14</div>
          <div class="cal-day completed">15</div>

          <!-- Week 4 -->
          <div class="cal-day completed">16</div>
          <div class="cal-day completed">17</div>
          <div class="cal-day completed">18</div>
          <div class="cal-day completed">19</div>
          <div class="cal-day completed">20</div>
          <div class="cal-day completed">21</div>
          <div class="cal-day completed">22</div>

          <!-- Week 5 -->
          <div class="cal-day completed">23</div>
          <div class="cal-day completed">24</div>
          <div class="cal-day completed">25</div>
          <div class="cal-day completed">26</div>
          <div class="cal-day completed">27</div>
          <div class="cal-day completed">28</div>
          <div class="cal-day completed">29</div>

          <!-- Week 6 -->
          <div class="cal-day today">30</div>
          <div class="cal-day future">31</div>
          <div class="cal-day other-month future">1</div>
          <div class="cal-day other-month future">2</div>
          <div class="cal-day other-month future">3</div>
          <div class="cal-day other-month future">4</div>
          <div class="cal-day other-month future">5</div>
        </div>
      </div>

      <!-- Month Navigation -->
      <div class="flex items-center justify-between py-4 border-t border-stone-200">
        <button class="flex items-center gap-2 px-4 py-2 rounded-full border border-stone-200 bg-white">
          <svg class="w-4 h-4 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
          <span class="font-semibold text-stone-800">Dec 2024</span>
        </button>
        <div class="flex gap-2">
          <button class="w-10 h-10 rounded-full border border-stone-200 bg-white flex items-center justify-center">
            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
          </button>
          <button class="w-10 h-10 rounded-full border border-stone-200 bg-white flex items-center justify-center">
            <svg class="w-5 h-5 text-stone-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
            </svg>
          </button>
        </div>
      </div>

    </div>
  </div>

</body>
</html>
