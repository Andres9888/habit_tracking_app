<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Aquarium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'DM Sans', sans-serif !important;
      max-width: 390px;
      margin: 0 auto;
      height: 100vh;
      overflow: hidden;
      background: linear-gradient(180deg, #B2DFDB 0%, #4DB6AC 15%, #00897B 35%, #00796B 55%, #00695C 75%, #004D40 100%);
      position: relative;
    }
    h1, h2, h3, h4, h5 { font-family: 'Literata', serif !important; }

    /* ── Water caustics overlay ── */
    .water-caustics {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(ellipse 80px 60px at 20% 30%, rgba(255,255,255,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 120px 80px at 70% 50%, rgba(255,255,255,0.06) 0%, transparent 70%),
        radial-gradient(ellipse 60px 90px at 50% 70%, rgba(255,255,255,0.05) 0%, transparent 70%);
      animation: causticsDrift 8s ease-in-out infinite alternate;
      z-index: 1;
    }
    @keyframes causticsDrift {
      0% { transform: translate(0, 0) scale(1); opacity: 0.7; }
      100% { transform: translate(15px, -10px) scale(1.1); opacity: 1; }
    }

    /* ── Water surface shimmer ── */
    .water-surface {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: linear-gradient(180deg,
        rgba(178,223,219,0.9) 0%,
        rgba(128,203,196,0.5) 40%,
        transparent 100%
      );
      z-index: 2;
      pointer-events: none;
    }
    .water-surface::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: -50%;
      width: 200%;
      height: 20px;
      background: repeating-linear-gradient(90deg,
        transparent 0%,
        rgba(255,255,255,0.15) 25%,
        transparent 50%
      );
      animation: surfaceWave 4s linear infinite;
    }
    @keyframes surfaceWave {
      0% { transform: translateX(0); }
      100% { transform: translateX(50%); }
    }

    /* ── Sandy bottom ── */
    .sandy-bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100px;
      background: linear-gradient(180deg,
        transparent 0%,
        rgba(194,168,120,0.3) 30%,
        rgba(194,168,120,0.6) 60%,
        rgba(166,140,96,0.8) 100%
      );
      z-index: 1;
      pointer-events: none;
    }
    .sandy-bottom::before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 40px;
      background:
        radial-gradient(ellipse 30px 10px at 15% 80%, rgba(160,130,80,0.5) 0%, transparent 100%),
        radial-gradient(ellipse 50px 12px at 45% 90%, rgba(160,130,80,0.4) 0%, transparent 100%),
        radial-gradient(ellipse 35px 8px at 75% 85%, rgba(160,130,80,0.5) 0%, transparent 100%),
        radial-gradient(ellipse 25px 6px at 90% 70%, rgba(160,130,80,0.3) 0%, transparent 100%);
    }

    /* ── Seaweed ── */
    .seaweed {
      position: fixed;
      bottom: 30px;
      z-index: 2;
      font-size: 40px;
      animation: seaweedSway 3s ease-in-out infinite;
      transform-origin: bottom center;
      pointer-events: none;
      filter: brightness(0.7) saturate(1.3);
    }
    .seaweed:nth-child(1) { left: 8%; animation-delay: 0s; }
    .seaweed:nth-child(2) { left: 30%; animation-delay: 0.8s; font-size: 32px; bottom: 20px; }
    .seaweed:nth-child(3) { left: 65%; animation-delay: 1.6s; font-size: 36px; bottom: 25px; }
    .seaweed:nth-child(4) { left: 85%; animation-delay: 0.4s; font-size: 28px; bottom: 15px; }
    @keyframes seaweedSway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }

    /* ── Bubbles ── */
    .bubble {
      position: fixed;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.6), rgba(255,255,255,0.1));
      border: 1px solid rgba(255,255,255,0.3);
      pointer-events: none;
      z-index: 3;
      animation: bubbleRise linear infinite;
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) translateX(0) scale(1); opacity: 0.8; }
      25% { transform: translateY(-25vh) translateX(8px) scale(1.05); opacity: 0.7; }
      50% { transform: translateY(-50vh) translateX(-5px) scale(1.1); opacity: 0.6; }
      75% { transform: translateY(-75vh) translateX(6px) scale(1.05); opacity: 0.4; }
      100% { transform: translateY(-100vh) translateX(0) scale(1); opacity: 0; }
    }

    /* ── Fish swimming ── */
    .fish {
      position: absolute;
      z-index: 10;
      cursor: pointer;
      transition: filter 0.3s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .fish:active { filter: brightness(1.3); }

    .fish-emoji {
      display: inline-block;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
      transition: transform 0.2s ease;
    }
    .fish.caught .fish-emoji {
      animation: fishWiggle 0.3s ease-in-out 3;
    }
    @keyframes fishWiggle {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(15deg); }
      75% { transform: rotate(-15deg); }
    }

    /* Swimming paths — horizontal drift with vertical bob */
    @keyframes swimRight {
      0% { transform: translateX(-60px) translateY(0px); }
      25% { transform: translateX(calc(390px * 0.25)) translateY(-12px); }
      50% { transform: translateX(calc(390px * 0.5)) translateY(5px); }
      75% { transform: translateX(calc(390px * 0.75)) translateY(-8px); }
      100% { transform: translateX(450px) translateY(0px); }
    }
    @keyframes swimLeft {
      0% { transform: translateX(450px) translateY(0px) scaleX(-1); }
      25% { transform: translateX(calc(390px * 0.75)) translateY(10px) scaleX(-1); }
      50% { transform: translateX(calc(390px * 0.5)) translateY(-6px) scaleX(-1); }
      75% { transform: translateX(calc(390px * 0.25)) translateY(8px) scaleX(-1); }
      100% { transform: translateX(-60px) translateY(0px) scaleX(-1); }
    }
    @keyframes swimRightSlow {
      0% { transform: translateX(-80px) translateY(0px); }
      25% { transform: translateX(calc(390px * 0.2)) translateY(6px); }
      50% { transform: translateX(calc(390px * 0.45)) translateY(-4px); }
      75% { transform: translateX(calc(390px * 0.7)) translateY(8px); }
      100% { transform: translateX(460px) translateY(0px); }
    }
    @keyframes swimLeftSlow {
      0% { transform: translateX(460px) translateY(0px) scaleX(-1); }
      25% { transform: translateX(calc(390px * 0.7)) translateY(-5px) scaleX(-1); }
      50% { transform: translateX(calc(390px * 0.45)) translateY(7px) scaleX(-1); }
      75% { transform: translateX(calc(390px * 0.2)) translateY(-3px) scaleX(-1); }
      100% { transform: translateX(-80px) translateY(0px) scaleX(-1); }
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    /* Strength indicator ring */
    .strength-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.2);
      animation: ringPulse 2s ease-in-out infinite;
    }
    @keyframes ringPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(1.15); opacity: 0.6; }
    }

    /* ── Net animation ── */
    .net-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0,40,30,0.5);
      backdrop-filter: blur(3px);
      -webkit-backdrop-filter: blur(3px);
      animation: fadeIn 0.3s ease;
    }
    .net-overlay.active { display: flex; }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .net-scoop {
      animation: netScoop 0.6s ease-out;
    }
    @keyframes netScoop {
      0% { transform: translateY(100px) rotate(15deg) scale(0.8); opacity: 0; }
      60% { transform: translateY(-10px) rotate(-3deg) scale(1.05); opacity: 1; }
      100% { transform: translateY(0) rotate(0) scale(1); opacity: 1; }
    }

    /* ── Stat card ── */
    .stat-card {
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(240,253,250,0.95));
      border-radius: 20px;
      box-shadow:
        0 20px 60px rgba(0,0,0,0.3),
        0 0 40px rgba(5,150,105,0.15),
        inset 0 1px 0 rgba(255,255,255,0.8);
      max-width: 340px;
      width: 90%;
    }

    /* ── Header bar ── */
    .header-bar {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 390px;
      z-index: 20;
      padding: 50px 20px 16px;
      background: linear-gradient(180deg,
        rgba(178,223,219,0.95) 0%,
        rgba(128,203,196,0.6) 70%,
        transparent 100%
      );
    }

    /* ── Count badge ── */
    .fish-count {
      background: rgba(255,255,255,0.25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
    }

    /* ── Button styles ── */
    .btn-restore {
      background: #059669 !important;
      color: white !important;
      border: none !important;
      border-radius: 14px !important;
      padding: 12px 20px !important;
      font-family: 'DM Sans', sans-serif !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(5,150,105,0.3);
    }
    .btn-restore:active {
      transform: scale(0.96);
    }

    .btn-delete {
      background: transparent !important;
      color: #B53030 !important;
      border: 1.5px solid #B53030 !important;
      border-radius: 14px !important;
      padding: 12px 20px !important;
      font-family: 'DM Sans', sans-serif !important;
      font-weight: 600 !important;
      font-size: 14px !important;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-delete:active {
      background: rgba(181,48,48,0.1) !important;
      transform: scale(0.96);
    }

    .btn-close-card {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: rgba(0,0,0,0.06);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }
    .btn-close-card:active { background: rgba(0,0,0,0.12); }

    /* ── Stat pills ── */
    .stat-pill {
      background: rgba(5,150,105,0.08);
      border-radius: 10px;
      padding: 8px 12px;
      text-align: center;
    }
    .stat-pill .label {
      font-size: 10px;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }
    .stat-pill .value {
      font-family: 'Literata', serif;
      font-size: 18px;
      font-weight: 700;
      color: #064e3b;
      margin-top: 2px;
    }

    /* ── Delete confirmation ── */
    .delete-confirm {
      display: none;
      animation: fadeIn 0.2s ease;
    }
    .delete-confirm.active { display: block; }

    /* ── Light rays ── */
    .light-rays {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70%;
      pointer-events: none;
      z-index: 1;
      background:
        linear-gradient(165deg, rgba(255,255,255,0.06) 0%, transparent 40%),
        linear-gradient(175deg, rgba(255,255,255,0.04) 0%, transparent 50%),
        linear-gradient(155deg, rgba(255,255,255,0.03) 0%, transparent 35%);
      animation: lightRayShift 12s ease-in-out infinite alternate;
    }
    @keyframes lightRayShift {
      0% { opacity: 0.6; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- Water effects -->
  <div class="water-surface"></div>
  <div class="water-caustics"></div>
  <div class="light-rays"></div>
  <div class="sandy-bottom"></div>

  <!-- Seaweed -->
  <div class="seaweed">🌿</div>
  <div class="seaweed">🌱</div>
  <div class="seaweed">🌿</div>
  <div class="seaweed">🌱</div>

  <!-- Bubbles (generated via JS) -->
  <div id="bubbles"></div>

  <!-- Header -->
  <div class="header-bar">
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <h1 style="font-size:22px; color:white; font-weight:700; text-shadow: 0 1px 4px rgba(0,0,0,0.15);">
          Habit Aquarium
        </h1>
        <p style="font-size:12px; color:rgba(255,255,255,0.75); margin-top:2px;">
          Tap a fish to catch it
        </p>
      </div>
      <div class="fish-count" id="fishCount">5 fish</div>
    </div>
  </div>

  <!-- Fish container -->
  <div id="fishTank" style="position:fixed; inset:0; z-index:10;">
    <!-- Fish are injected by JS -->
  </div>

  <!-- Net overlay with stat card -->
  <div class="net-overlay" id="netOverlay">
    <div class="net-scoop stat-card" id="statCard" style="padding:28px 24px 24px; position:relative;">
      <button class="btn-close-card" onclick="closeCard()">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1 1l12 12M13 1L1 13" stroke="#9ca3af" stroke-width="2" stroke-linecap="round"/></svg>
      </button>

      <!-- Caught fish display -->
      <div style="text-align:center; margin-bottom:20px;">
        <div style="font-size:56px; margin-bottom:8px; animation: bob 2s ease-in-out infinite;" id="caughtEmoji"></div>
        <h2 id="caughtName" style="font-size:20px; color:#064e3b; font-weight:700; margin-bottom:4px;"></h2>
        <p id="caughtStrength" style="font-size:13px; color:#6b7280;"></p>
      </div>

      <!-- Stats grid -->
      <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:20px;">
        <div class="stat-pill">
          <div class="label">Streak</div>
          <div class="value" id="statStreak"></div>
        </div>
        <div class="stat-pill">
          <div class="label">Total</div>
          <div class="value" id="statTotal"></div>
        </div>
        <div class="stat-pill">
          <div class="label">Rate</div>
          <div class="value" id="statRate"></div>
        </div>
      </div>

      <!-- Archived date -->
      <div style="text-align:center; margin-bottom:20px; padding:8px; background:rgba(0,0,0,0.03); border-radius:10px;">
        <p style="font-size:12px; color:#9ca3af;" id="archivedDate"></p>
      </div>

      <!-- Action buttons (default state) -->
      <div id="actionButtons">
        <div style="display:flex; gap:10px;">
          <button class="btn-restore" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;" onclick="handleRestore()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            Release to Wild
          </button>
          <button class="btn-delete" style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px;" onclick="showDeleteConfirm()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
            Release to Sea
          </button>
        </div>
      </div>

      <!-- Delete confirmation -->
      <div class="delete-confirm" id="deleteConfirm">
        <div style="text-align:center; margin-bottom:14px;">
          <p style="font-size:14px; color:#B53030; font-weight:600;">Release forever?</p>
          <p style="font-size:12px; color:#9ca3af; margin-top:4px;">This fish will swim away and never return.</p>
        </div>
        <div style="display:flex; gap:10px;">
          <button class="btn-delete" style="flex:1;" onclick="handleDelete()">
            Yes, release
          </button>
          <button class="btn-restore" style="flex:1; background:#6b7280 !important; box-shadow:none;" onclick="hideDeleteConfirm()">
            Keep in tank
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast notification -->
  <div id="toast" style="
    position: fixed;
    bottom: 60px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: rgba(255,255,255,0.95);
    color: #064e3b;
    padding: 12px 24px;
    border-radius: 14px;
    font-size: 14px;
    font-weight: 600;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    z-index: 100;
    opacity: 0;
    transition: all 0.3s ease;
    pointer-events: none;
    font-family: 'DM Sans', sans-serif;
  "></div>

  <script>
    // ── Fish data ──
    const habits = [
      {
        id: 1,
        name: 'Morning Meditation',
        emoji: '🐠',
        strength: 92,
        streak: 45,
        total: 312,
        rate: '92%',
        archivedDate: 'Archived Feb 14, 2026',
        swimSpeed: 8,      // seconds for one pass — fast
        yPosition: 22,     // % from top
        size: 44,
        direction: 'right',
        delay: 0,
      },
      {
        id: 2,
        name: 'Read 30 Minutes',
        emoji: '🐡',
        strength: 74,
        streak: 18,
        total: 186,
        rate: '74%',
        archivedDate: 'Archived Jan 28, 2026',
        swimSpeed: 12,
        yPosition: 38,
        size: 38,
        direction: 'left',
        delay: 2,
      },
      {
        id: 3,
        name: 'Drink Water',
        emoji: '🐟',
        strength: 55,
        streak: 7,
        total: 98,
        rate: '55%',
        archivedDate: 'Archived Mar 2, 2026',
        swimSpeed: 16,
        yPosition: 52,
        size: 34,
        direction: 'right',
        delay: 4,
      },
      {
        id: 4,
        name: 'Journal Entry',
        emoji: '🦈',
        strength: 30,
        streak: 3,
        total: 42,
        rate: '30%',
        archivedDate: 'Archived Dec 10, 2025',
        swimSpeed: 22,     // slow
        yPosition: 68,
        size: 28,
        direction: 'left',
        delay: 1,
      },
      {
        id: 5,
        name: 'Stretch Routine',
        emoji: '🐙',
        strength: 15,
        streak: 1,
        total: 19,
        rate: '15%',
        archivedDate: 'Archived Nov 5, 2025',
        swimSpeed: 28,     // very slow, drifts at bottom
        yPosition: 78,
        size: 24,
        direction: 'right',
        delay: 6,
      },
    ];

    let currentFish = null;
    let fishElements = {};

    // ── Render fish ──
    function renderFish() {
      const tank = document.getElementById('fishTank');
      tank.innerHTML = '';
      habits.forEach(fish => {
        const el = document.createElement('div');
        el.className = 'fish';
        el.id = `fish-${fish.id}`;
        el.style.top = `${fish.yPosition}%`;
        el.style.left = '0';

        const isRight = fish.direction === 'right';
        const isSlow = fish.swimSpeed > 15;
        let animName;
        if (isRight) animName = isSlow ? 'swimRightSlow' : 'swimRight';
        else animName = isSlow ? 'swimLeftSlow' : 'swimLeft';

        el.style.animation = `${animName} ${fish.swimSpeed}s linear ${fish.delay}s infinite`;

        const strengthLabel = fish.strength >= 80 ? 'Strong swimmer' :
                              fish.strength >= 50 ? 'Steady swimmer' :
                              fish.strength >= 25 ? 'Drifting slowly' : 'Barely moving';
        const glowIntensity = Math.max(4, fish.strength / 100 * 16);

        el.innerHTML = `
          <div style="position:relative; display:inline-block;">
            <span class="fish-emoji" style="font-size:${fish.size}px; filter: drop-shadow(0 0 ${glowIntensity}px rgba(255,255,255,${0.2 + fish.strength/200}));">
              ${fish.emoji}
            </span>
            <span style="
              position:absolute;
              bottom:-16px;
              left:50%;
              transform:translateX(-50%);
              font-size:10px;
              color:rgba(255,255,255,0.7);
              white-space:nowrap;
              font-family:'DM Sans',sans-serif;
              text-shadow: 0 1px 3px rgba(0,0,0,0.3);
              pointer-events:none;
            ">${fish.name}</span>
          </div>
        `;

        el.addEventListener('click', () => catchFish(fish));
        tank.appendChild(el);
        fishElements[fish.id] = el;
      });
      updateCount();
    }

    // ── Catch fish ──
    function catchFish(fish) {
      currentFish = fish;

      // Pause swimming
      const el = fishElements[fish.id];
      if (el) {
        el.classList.add('caught');
        el.style.animationPlayState = 'paused';
      }

      // Populate card
      document.getElementById('caughtEmoji').textContent = fish.emoji;
      document.getElementById('caughtName').textContent = fish.name;

      const strengthLabel = fish.strength >= 80 ? 'Strong swimmer' :
                            fish.strength >= 50 ? 'Steady swimmer' :
                            fish.strength >= 25 ? 'Drifting slowly' : 'Barely moving';
      document.getElementById('caughtStrength').textContent =
        `${strengthLabel} \u2022 ${fish.strength}% strength`;

      document.getElementById('statStreak').textContent = `${fish.streak}d`;
      document.getElementById('statTotal').textContent = fish.total;
      document.getElementById('statRate').textContent = fish.rate;
      document.getElementById('archivedDate').textContent = fish.archivedDate;

      // Reset confirm state
      hideDeleteConfirm();

      // Show overlay
      document.getElementById('netOverlay').classList.add('active');
    }

    // ── Close card ──
    function closeCard() {
      document.getElementById('netOverlay').classList.remove('active');
      if (currentFish) {
        const el = fishElements[currentFish.id];
        if (el) {
          el.classList.remove('caught');
          el.style.animationPlayState = 'running';
        }
      }
      currentFish = null;
    }

    // ── Restore ──
    function handleRestore() {
      if (!currentFish) return;
      const name = currentFish.name;
      removeFish(currentFish.id);
      closeCard();
      showToast(`${name} released to the wild!`);
    }

    // ── Delete ──
    function showDeleteConfirm() {
      document.getElementById('actionButtons').style.display = 'none';
      document.getElementById('deleteConfirm').classList.add('active');
    }
    function hideDeleteConfirm() {
      document.getElementById('actionButtons').style.display = 'block';
      document.getElementById('deleteConfirm').classList.remove('active');
    }
    function handleDelete() {
      if (!currentFish) return;
      const name = currentFish.name;
      removeFish(currentFish.id);
      closeCard();
      showToast(`${name} swam away forever`);
    }

    // ── Remove fish from tank ──
    function removeFish(id) {
      const idx = habits.findIndex(h => h.id === id);
      if (idx > -1) habits.splice(idx, 1);
      const el = fishElements[id];
      if (el) {
        el.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        el.style.opacity = '0';
        el.style.transform = 'scale(0.3)';
        setTimeout(() => el.remove(), 500);
        delete fishElements[id];
      }
      updateCount();
    }

    // ── Update fish count ──
    function updateCount() {
      const n = habits.length;
      document.getElementById('fishCount').textContent =
        `${n} fish${n !== 1 ? '' : ''}`;
    }

    // ── Toast ──
    function showToast(message) {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.style.opacity = '1';
      toast.style.transform = 'translateX(-50%) translateY(0)';
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(-50%) translateY(20px)';
      }, 2200);
    }

    // ── Generate bubbles ──
    function createBubbles() {
      const container = document.getElementById('bubbles');
      for (let i = 0; i < 12; i++) {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        const size = 4 + Math.random() * 10;
        bubble.style.width = `${size}px`;
        bubble.style.height = `${size}px`;
        bubble.style.left = `${5 + Math.random() * 85}%`;
        bubble.style.bottom = `${Math.random() * 15}%`;
        bubble.style.animationDuration = `${6 + Math.random() * 10}s`;
        bubble.style.animationDelay = `${Math.random() * 8}s`;
        container.appendChild(bubble);
      }
    }

    // ── Close on background tap ──
    document.getElementById('netOverlay').addEventListener('click', function(e) {
      if (e.target === this) closeCard();
    });

    // ── Init ──
    renderFish();
    createBubbles();
  </script>
</body>
</html>
