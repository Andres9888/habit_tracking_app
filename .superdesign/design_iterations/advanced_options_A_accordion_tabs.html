<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variation A — Accordion with Tabs</title>
<link rel="stylesheet" href="advanced_options_theme.css" />
<style>
  body { display: flex; gap: 28px; padding: 40px; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
</style>
</head>
<body>

<script>
  // Rendered HTML fragment used for both static frames.
  function phone({ stateLabel, open }) {
    const tabHtml = (active) => `
      <div class="segmented">
        <button class="${active === 'algo' ? 'active' : ''}" data-tab="algo">Algorithm</button>
        <button class="${active === 'emoji' ? 'active' : ''}" data-tab="emoji">Growth Icons</button>
      </div>
    `;
    return `
      <div class="phone">
        <div class="drag-handle"></div>
        <div class="content">

          <!-- Streak Goal row (for continuity) -->
          <div class="section-label"><span class="line"></span><span class="text">Streak Goal</span><span class="line"></span></div>
          <div class="card streak-card">
            <div class="streak-label">Target days</div>
            <div class="streak-pills">
              <button class="streak-pill">Off</button>
              <button class="streak-pill">7</button>
              <button class="streak-pill">21</button>
              <button class="streak-pill active">30</button>
              <button class="streak-pill">66</button>
              <button class="streak-pill">100</button>
              <button class="streak-pill">365</button>
            </div>
          </div>

          <!-- ADVANCED -->
          <div class="section-label"><span class="line"></span><span class="text">Advanced</span><span class="line"></span></div>
          <div class="card expandable ${open ? 'open' : ''}" id="adv">
            <div class="row" style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="toggleExpand('adv')">
              <div class="icon-tile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>
              </div>
              <div style="flex:1;min-width:0;">
                <div class="row-title">Advanced</div>
                <div class="row-subtitle">Tune how this habit is measured</div>
              </div>
              <span class="chevron chev-rot">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
              </span>
            </div>

            <!-- Preview chips (visible when collapsed) -->
            ${open ? '' : `
            <div class="preview-chips">
              <span class="preview-chip">Algorithm · <strong>Balanced</strong></span>
              <span class="preview-chip">Growth · <span class="chip-emojis">🌱🌿🌳💪⚡</span></span>
            </div>`}

            <!-- Expanded body -->
            <div class="expandable-body">
              ${tabHtml('algo')}

              <div class="tab-pane" data-pane="algo">
                <div class="algo-card">
                  <div class="algo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                  </div>
                  <div class="algo-body">
                    <div class="algo-title-row">
                      <div class="algo-title">Forgiving</div>
                      <span class="algo-tag">Simple · 18d</span>
                    </div>
                    <div class="algo-desc">Forms fast and missing a day barely matters — you'll do it tomorrow anyway.</div>
                    <div class="algo-meta">A glass of water, taking a vitamin, one push-up.</div>
                  </div>
                </div>
                <div class="algo-card selected">
                  <div class="algo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
                  </div>
                  <div class="algo-body">
                    <div class="algo-title-row">
                      <div class="algo-title">Balanced</div>
                      <span class="algo-tag">Moderate · 66d</span>
                    </div>
                    <div class="algo-desc">The typical 66-day formation curve from UCL research — noticeable dip on a miss, recovers quickly.</div>
                    <div class="algo-meta">Journaling, reading, stretching.</div>
                  </div>
                </div>
                <div class="algo-card">
                  <div class="algo-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                  </div>
                  <div class="algo-body">
                    <div class="algo-title-row">
                      <div class="algo-title">Strict</div>
                      <span class="algo-tag">Complex · 120d</span>
                    </div>
                    <div class="algo-desc">Takes much longer to build — tight accountability keeps you showing up through the long climb.</div>
                    <div class="algo-meta">Running 5K, meditation, learning an instrument.</div>
                  </div>
                </div>
              </div>

              <div class="tab-pane" data-pane="emoji" style="display:none;">
                <div class="preset-row">
                  <button class="preset-chip active"><span class="emojis">🌱🌿🌳💪⚡</span> Plants</button>
                  <button class="preset-chip"><span class="emojis">💧🏃🏋️💪🏆</span> Fitness</button>
                  <button class="preset-chip"><span class="emojis">🌑🌓🌕🪐🌌</span> Space</button>
                  <button class="preset-chip"><span class="emojis">💭📖🎓🧠✨</span> Mind</button>
                  <button class="preset-chip"><span class="emojis">🪵🔥🌋⚡👑</span> Fire</button>
                </div>
                <div class="stage-row"><div class="stage-emoji">🌱</div><div class="stage-meta"><div class="stage-label">Starting</div><div class="stage-hint">Days 0–10</div></div><div class="stage-change">Change</div></div>
                <div class="stage-row"><div class="stage-emoji">🌿</div><div class="stage-meta"><div class="stage-label">Building</div><div class="stage-hint">Days 10–30</div></div><div class="stage-change">Change</div></div>
                <div class="stage-row"><div class="stage-emoji">🌳</div><div class="stage-meta"><div class="stage-label">Developing</div><div class="stage-hint">Days 30–60</div></div><div class="stage-change">Change</div></div>
                <div class="stage-row"><div class="stage-emoji">💪</div><div class="stage-meta"><div class="stage-label">Strong</div><div class="stage-hint">Days 60–100</div></div><div class="stage-change">Change</div></div>
                <div class="stage-row"><div class="stage-emoji">⚡</div><div class="stage-meta"><div class="stage-label">Automatic</div><div class="stage-hint">Days 100+</div></div><div class="stage-change">Change</div></div>
                <a class="reset-link">Reset to default</a>
              </div>
            </div>
          </div>

          <!-- Danger -->
          <div class="section-label danger"><span class="line"></span><span class="text">Danger Zone</span><span class="line"></span></div>
          <div class="danger-card">
            <div class="danger-row">📦 Archive habit</div>
            <div class="danger-row">🗑️ Delete habit</div>
          </div>
        </div>
      </div>
    `;
  }

  document.body.innerHTML = `
    <div class="col">
      <div class="state-label">Collapsed</div>
      ${phone({ open: false })}
    </div>
    <div class="col">
      <div class="state-label">Expanded (Algorithm tab)</div>
      ${phone({ open: true })}
    </div>
  `;

  // Interactive toggles
  window.toggleExpand = function(id) {
    const el = document.getElementById(id);
    if (el) el.classList.toggle('open');
  };
  document.querySelectorAll('.segmented button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      const tab = btn.dataset.tab;
      const parent = btn.closest('.expandable-body');
      parent.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      parent.querySelectorAll('.tab-pane').forEach(p => {
        p.style.display = p.dataset.pane === tab ? 'block' : 'none';
      });
    });
  });
</script>

</body>
</html>
