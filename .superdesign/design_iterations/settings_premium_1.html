<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chain Day · Settings — Premium Redesign Mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  /* ============================================================
     GROUNDED TOKENS — pulled from src/theme/colors/core.ts,
     settingsColors.ts, premiumHero.ts, darkColors.ts
     ============================================================ */
  :root {
    /* light — warm parchment */
    --canvas:        #F5F1ED;  /* light.background (L0) */
    --paper:         #FFFFFF;  /* light.cardElevated  */
    --surface:       #EDEAE5;  /* light.card (L1)     */
    --surface-muted: #FAF8F5;  /* light.surfaceMuted  */
    --hairline:      #DDD8D2;  /* border              */

    --text-1: #2D2A26;  /* text.primary   */
    --text-2: #6B6560;  /* text.secondary */
    --text-3: #6E6660;  /* text.tertiary  */
    --heading:#3D3833;  /* gray.700       */

    --brand:   #059669; /* primary.600 */
    --brand-7: #047857; /* primary.700 */

    /* settings tiles */
    --tile-green-ic: #047857;  --tile-green-bg: #E2F1EA;
    --tile-amber-ic: #8A6A33;  --tile-amber-bg: #F4E7D2;
    --tile-red-ic:   #B53030;  --tile-red-bg:   #FEE2E2;

    /* gold / streak */
    --gold-100: #FEF3CD;
    --gold-600: #936A08;
    --gold-700: #7D5907;
    --warn-bg:  #FEF3CD;  --warn-ic: #9A5504;

    --shadow-card: 0 1px 2px rgba(26,24,22,.05), 0 6px 18px -8px rgba(26,24,22,.14);
    --shadow-tile: 0 1px 1px rgba(26,24,22,.05);
    --radius-card: 20px;
    --radius-tile: 12px;
  }
  .dark {
    --canvas:        #111827;  /* dark.background */
    --paper:         #1F2937;  /* dark.surface    */
    --surface:       #232f3f;
    --surface-muted: #1a2432;
    --hairline:      #33404f;

    --text-1: #F3F1EE;
    --text-2: #A7B0BC;
    --text-3: #8C97A4;
    --heading:#ECE9E4;

    --brand:   #34D399;
    --brand-7: #34D399;

    --tile-green-ic: #34D399;  --tile-green-bg: rgba(52,211,153,.14);
    --tile-amber-ic: #E8C88A;  --tile-amber-bg: rgba(232,200,138,.14);
    --tile-red-ic:   #FCA5A5;  --tile-red-bg:   #4B1F1F;

    --gold-100: rgba(232,200,138,.12);
    --gold-600: #E8C88A;
    --gold-700: #E8C88A;
    --warn-bg: rgba(232,200,138,.16); --warn-ic: #E8C88A;

    --shadow-card: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px -10px rgba(0,0,0,.6);
    --shadow-tile: 0 1px 1px rgba(0,0,0,.25);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background:
      radial-gradient(1200px 700px at 50% -10%, #efe9e1 0%, #e6ded4 55%, #ddd4c8 100%);
    color: #3D3833;
    min-height: 100vh;
    padding: 44px 24px 72px;
    -webkit-font-smoothing: antialiased;
  }

  .page-head { text-align: center; max-width: 900px; margin: 0 auto 34px; }
  .page-head h1 {
    font-family: 'Literata', serif; font-weight: 600;
    font-size: 27px; color: #2D2A26; letter-spacing: -0.01em;
  }
  .page-head p { margin-top: 8px; color: #7c7268; font-size: 14px; }

  .stage {
    display: flex; gap: 46px; justify-content: center;
    align-items: flex-start; flex-wrap: wrap; max-width: 980px; margin: 0 auto;
  }
  .frame-wrap { display: flex; flex-direction: column; align-items: center; gap: 15px; }
  .frame-label {
    font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
    color: #8a8075;
  }
  .dark-wrap .frame-label { color: #8a8075; }

  /* ---------- phone frame ---------- */
  .phone {
    width: 390px; border-radius: 46px; padding: 11px;
    background: linear-gradient(160deg, #d9d0c4, #c3b8a8);
    box-shadow: 0 40px 80px -30px rgba(60,48,34,.55), 0 6px 16px rgba(60,48,34,.2);
  }
  .dark .phone, .phone.is-dark {
    background: linear-gradient(160deg, #2b2b30, #17171a);
    box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), 0 6px 16px rgba(0,0,0,.4);
  }
  .screen {
    border-radius: 36px; overflow: hidden; background: var(--canvas);
    height: 812px; position: relative; display: flex; flex-direction: column;
  }

  /* status bar */
  .statusbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 26px 6px; font-size: 13px; font-weight: 600; color: var(--text-1);
    flex-shrink: 0;
  }
  .statusbar .glyphs { display: flex; gap: 6px; align-items: center; }
  .statusbar svg { width: 15px; height: 15px; }

  /* modal header */
  .sheet-head { padding: 6px 20px 10px; flex-shrink: 0; }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--hairline); margin: 2px auto 14px; }
  .sheet-title-row { display: flex; align-items: baseline; justify-content: space-between; }
  .sheet-title {
    font-family: 'Literata', serif; font-weight: 600; font-size: 25px;
    color: var(--text-1); letter-spacing: -0.015em;
  }
  .sheet-done { font-size: 15px; font-weight: 600; color: var(--brand-7); }

  /* scroll body */
  .body { flex: 1; overflow-y: auto; padding: 8px 16px 26px; }
  .body::-webkit-scrollbar { width: 0; }

  /* ---------- profile hero ---------- */
  .hero {
    display: flex; align-items: center; gap: 13px;
    background: var(--paper); border: 1px solid var(--hairline);
    border-radius: var(--radius-card); padding: 15px 16px;
    box-shadow: var(--shadow-card); margin-bottom: 22px;
  }
  .avatar {
    width: 54px; height: 54px; border-radius: 15px; flex-shrink: 0;
    background: linear-gradient(150deg, #0b8a63, #04624a);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Literata', serif; color: #fff; font-size: 24px; font-weight: 600;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12);
  }
  .hero-id { flex: 1; min-width: 0; }
  .hero-name {
    font-family: 'Literata', serif; font-weight: 600; font-size: 20px;
    color: var(--text-1); letter-spacing: -0.01em; line-height: 1.15;
  }
  .plan-badge {
    display: inline-flex; align-items: center; gap: 4px; margin-top: 7px;
    background: var(--warn-bg); color: var(--warn-ic);
    padding: 2px 9px; border-radius: 8px; font-size: 11.5px; font-weight: 700;
    letter-spacing: .02em;
  }
  .plan-badge svg { width: 12px; height: 12px; }
  .hero-sub { margin-top: 7px; font-size: 13px; color: var(--text-3); }
  .chev { color: var(--text-3); flex-shrink: 0; }
  .chev svg { width: 20px; height: 20px; display: block; }

  /* ---------- section ---------- */
  .section { margin-bottom: 22px; }
  .section-head {
    display: flex; align-items: center; gap: 9px; padding: 0 4px 9px;
  }
  .section-glyph {
    width: 22px; height: 22px; border-radius: 7px; display: flex;
    align-items: center; justify-content: center; color: var(--brand-7);
    background: var(--tile-green-bg);
  }
  .section-glyph svg { width: 13px; height: 13px; }
  .section-title {
    font-size: 12.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-2);
  }

  .card {
    background: var(--paper); border: 1px solid var(--hairline);
    border-radius: var(--radius-card); box-shadow: var(--shadow-card);
    overflow: hidden;
  }

  /* ---------- row ---------- */
  .row { display: flex; align-items: center; gap: 13px; padding: 13px 15px; }
  .row + .row, .inset + .row, .row + .inset, .tray { border-top: 1px solid var(--hairline); }
  .tile {
    width: 38px; height: 38px; border-radius: var(--radius-tile); flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-tile);
  }
  .tile svg { width: 18px; height: 18px; }
  .t-green { background: var(--tile-green-bg); color: var(--tile-green-ic); }
  .t-amber { background: var(--tile-amber-bg); color: var(--tile-amber-ic); }
  .row-main { flex: 1; min-width: 0; }
  .row-label { font-size: 15.5px; font-weight: 600; color: var(--text-1); letter-spacing: -0.006em; }
  .row-sub { margin-top: 2px; font-size: 12.5px; color: var(--text-3); line-height: 1.3; }
  .row-right { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }

  .value-pill {
    font-size: 14px; font-weight: 500; color: var(--text-2);
  }
  .count-badge {
    min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px;
    background: var(--surface); color: var(--text-2);
    font-size: 12.5px; font-weight: 700; display: flex; align-items: center; justify-content: center;
  }

  /* toggle */
  .toggle { width: 46px; height: 28px; border-radius: 15px; position: relative; flex-shrink: 0;
    background: var(--hairline); transition: background .2s; }
  .toggle.on { background: var(--brand); }
  .toggle .knob {
    position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.28); transition: left .2s;
  }
  .toggle.on .knob { left: 21px; }

  /* segmented control */
  .segmented {
    display: flex; background: var(--surface); border-radius: 11px; padding: 3px; gap: 2px;
  }
  .seg { padding: 5px 11px; border-radius: 8px; font-size: 13px; font-weight: 600; color: var(--text-2); }
  .seg.active { background: var(--paper); color: var(--text-1); box-shadow: 0 1px 2px rgba(0,0,0,.14); }
  .dark .seg.active { background: #38465a; }

  /* ---------- reminders inset ---------- */
  .inset { padding: 8px 15px 11px; background: color-mix(in srgb, var(--text-1) 2%, transparent); }
  .inset-card {
    background: var(--surface-muted); border: 1px solid var(--hairline);
    border-radius: 16px; overflow: hidden;
  }
  .inset-time-row { display: flex; align-items: center; padding: 12px 14px; gap: 12px; }
  .inset-time-row .lbl { flex: 1; font-size: 15px; font-weight: 600; color: var(--text-1); }
  .time-pill {
    background: var(--tile-green-bg); color: var(--tile-green-ic);
    padding: 6px 13px; border-radius: 9px; font-size: 15px; font-weight: 700;
  }
  .upsell-row { padding: 12px 14px; border-top: 1px solid var(--hairline); }
  .upsell-row a { font-size: 12.5px; font-weight: 500; color: var(--brand); text-decoration: none; }

  /* tone tray */
  .tray { padding: 11px 15px 13px; }
  .tone-set { display: flex; gap: 8px; }
  .tone {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;
    padding: 10px 6px; border-radius: 13px; border: 1px solid var(--hairline);
    background: var(--surface-muted); color: var(--text-2);
    font-size: 12.5px; font-weight: 600;
  }
  .tone svg { width: 17px; height: 17px; }
  .tone.sel { border-color: var(--brand); background: var(--tile-green-bg); color: var(--tile-green-ic); }

  /* ---------- gold trial card ---------- */
  .trial {
    background: var(--gold-100); border: 1px solid color-mix(in srgb, var(--gold-700) 30%, transparent);
    border-radius: var(--radius-card); padding: 16px; box-shadow: var(--shadow-card);
    margin-bottom: 22px;
  }
  .trial-top { display: flex; align-items: center; gap: 14px; }
  .trial-crown {
    width: 44px; height: 44px; border-radius: var(--radius-tile); flex-shrink: 0;
    background: var(--gold-700); display: flex; align-items: center; justify-content: center;
  }
  .trial-crown svg { width: 22px; height: 22px; color: #fff; }
  .dark .trial-crown svg { color: #1A1816; }
  .trial-title { font-size: 15.5px; font-weight: 700; color: var(--text-1); }
  .trial-line { margin-top: 2px; font-size: 12.5px; font-weight: 600; color: var(--gold-600); }
  .trial-body { margin-top: 12px; font-size: 13.5px; color: var(--text-2); line-height: 1.45; }
  .trial-cta {
    margin-top: 15px; text-align: center; background: var(--brand); color: #fff;
    padding: 12px; border-radius: 13px; font-size: 15px; font-weight: 700;
  }
  .dark .trial-cta { color: #06251c; }

  /* ---------- footer ---------- */
  .footer { text-align: center; padding: 12px 0 8px; font-size: 12px; color: var(--text-3); }
  .footer a { color: var(--text-3); text-decoration: none; }

  @media (max-width: 880px) { .stage { gap: 30px; } }
</style>
</head>
<body>
  <header class="page-head">
    <h1>Chain Day — Settings, premium redesign</h1>
    <p>Editorial parchment mock · every row maps to live code in <code>SettingsPrimarySections</code> + <code>SettingsSecondarySections</code></p>
  </header>

  <div class="stage">
    <!-- ================= LIGHT (priority) ================= -->
    <div class="frame-wrap">
      <div class="frame-label">Light · Trial state</div>
      <div class="phone">
        <div class="screen" id="screen-light"></div>
      </div>
    </div>

    <!-- ================= DARK ================= -->
    <div class="frame-wrap dark-wrap">
      <div class="frame-label">Dark · Trial state</div>
      <div class="phone is-dark">
        <div class="screen dark" id="screen-dark"></div>
      </div>
    </div>
  </div>

<script>
  // Shared screen markup — rendered into both light & dark frames so the two
  // variants stay in lockstep. Real labels only; no lorem.
  const SCREEN = `
    <div class="statusbar">
      <span>9:41</span>
      <span class="glyphs">
        <i data-lucide="signal"></i><i data-lucide="wifi"></i><i data-lucide="battery-full"></i>
      </span>
    </div>

    <div class="sheet-head">
      <div class="grabber"></div>
      <div class="sheet-title-row">
        <span class="sheet-title">Settings</span>
        <span class="sheet-done">Done</span>
      </div>
    </div>

    <div class="body">

      <!-- 1 · PROFILE HERO -->
      <div class="hero">
        <div class="avatar">A</div>
        <div class="hero-id">
          <div class="hero-name">Andres</div>
          <span class="plan-badge"><i data-lucide="crown"></i>Trial</span>
          <div class="hero-sub">Edit name, photo &amp; account</div>
        </div>
        <span class="chev"><i data-lucide="chevron-right"></i></span>
      </div>

      <!-- 2 · LOOK & FEEL -->
      <section class="section">
        <div class="section-head">
          <span class="section-glyph"><i data-lucide="palette"></i></span>
          <span class="section-title">Look &amp; Feel</span>
        </div>
        <div class="card">
          <div class="row">
            <span class="tile t-green"><i data-lucide="calendar-days"></i></span>
            <div class="row-main">
              <div class="row-label">Calendar look</div>
              <div class="row-sub">Day shape, fill, chain style &amp; preview</div>
            </div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
          <div class="row">
            <span class="tile t-green"><i data-lucide="moon"></i></span>
            <div class="row-main"><div class="row-label">Theme</div></div>
            <div class="row-right">
              <div class="segmented">
                <span class="seg active">Light</span>
                <span class="seg">Dark</span>
                <span class="seg">System</span>
              </div>
            </div>
          </div>
          <div class="row">
            <span class="tile t-green"><i data-lucide="rows-3"></i></span>
            <div class="row-main">
              <div class="row-label">Compact habit cards</div>
              <div class="row-sub">Fit more on screen</div>
            </div>
            <div class="row-right"><div class="toggle"><span class="knob"></span></div></div>
          </div>
        </div>
      </section>

      <!-- 3 · REMINDERS -->
      <section class="section">
        <div class="section-head">
          <span class="section-glyph"><i data-lucide="bell-ring"></i></span>
          <span class="section-title">Reminders</span>
        </div>
        <div class="card">
          <div class="row">
            <span class="tile t-green"><i data-lucide="bell"></i></span>
            <div class="row-main">
              <div class="row-label">Streak reminders</div>
              <div class="row-sub">Nudge before an active streak slips</div>
            </div>
            <div class="row-right"><div class="toggle on"><span class="knob"></span></div></div>
          </div>

          <div class="inset">
            <div class="inset-card">
              <div class="inset-time-row">
                <span class="lbl">Remind me at</span>
                <span class="time-pill">8:30 PM</span>
              </div>
              <div class="upsell-row">
                <a href="#">Want a different time per habit? Learn more →</a>
              </div>
            </div>
          </div>

          <div class="row">
            <span class="tile t-green"><i data-lucide="volume-2"></i></span>
            <div class="row-main"><div class="row-label">Completion sound</div></div>
            <div class="row-right"><div class="toggle on"><span class="knob"></span></div></div>
          </div>
          <div class="tray">
            <div class="tone-set">
              <span class="tone sel"><i data-lucide="volume-1"></i>Chime</span>
              <span class="tone"><i data-lucide="droplet"></i>Pop</span>
              <span class="tone"><i data-lucide="trending-up"></i>Rise</span>
            </div>
          </div>
        </div>
      </section>

      <!-- 4 · HABITS -->
      <section class="section">
        <div class="section-head">
          <span class="section-glyph"><i data-lucide="sliders-horizontal"></i></span>
          <span class="section-title">Habits</span>
        </div>
        <div class="card">
          <div class="row">
            <span class="tile t-green"><i data-lucide="arrow-up-down"></i></span>
            <div class="row-main">
              <div class="row-label">Sort order</div>
              <div class="row-sub">How habits are ordered</div>
            </div>
            <span class="row-right"><span class="value-pill">Longest first</span><span class="chev"><i data-lucide="chevron-right"></i></span></span>
          </div>
          <div class="row">
            <span class="tile t-amber"><i data-lucide="book-open"></i></span>
            <div class="row-main">
              <div class="row-label">Archived habits</div>
              <div class="row-sub">View and restore hidden habits</div>
            </div>
            <span class="row-right"><span class="count-badge">3</span><span class="chev"><i data-lucide="chevron-right"></i></span></span>
          </div>
          <div class="row">
            <span class="tile t-amber"><i data-lucide="download"></i></span>
            <div class="row-main">
              <div class="row-label">Export my data</div>
              <div class="row-sub">Download habits as CSV or JSON</div>
            </div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
        </div>
      </section>

      <!-- 5 · PREMIUM (trial) — the plan-aware conversion card -->
      <div class="trial">
        <div class="trial-top">
          <span class="trial-crown"><i data-lucide="crown"></i></span>
          <div>
            <div class="trial-title">Chain Day Pro</div>
            <div class="trial-line">5 days left in your free trial</div>
          </div>
        </div>
        <div class="trial-body">Keep unlimited habits, custom reminders, and every theme when your trial ends.</div>
        <div class="trial-cta">Upgrade — $4.99/mo</div>
      </div>

      <!-- 6 · SUPPORT -->
      <section class="section">
        <div class="section-head">
          <span class="section-glyph"><i data-lucide="heart"></i></span>
          <span class="section-title">Support</span>
        </div>
        <div class="card">
          <div class="row">
            <span class="tile t-amber"><i data-lucide="star"></i></span>
            <div class="row-main"><div class="row-label">Rate Chain Day</div></div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
          <div class="row">
            <span class="tile t-amber"><i data-lucide="share-2"></i></span>
            <div class="row-main"><div class="row-label">Share with a friend</div></div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
          <div class="row">
            <span class="tile t-amber"><i data-lucide="sparkles"></i></span>
            <div class="row-main"><div class="row-label">What's new</div></div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
          <div class="row">
            <span class="tile t-amber"><i data-lucide="message-square"></i></span>
            <div class="row-main"><div class="row-label">Send feedback</div></div>
            <span class="row-right chev"><i data-lucide="chevron-right"></i></span>
          </div>
        </div>
      </section>

      <!-- 7 · FOOTER -->
      <div class="footer">
        <a href="#">Privacy</a> &nbsp;·&nbsp; <a href="#">Terms</a> &nbsp;·&nbsp; v1.4.2 (128)
      </div>

    </div>
  `;

  document.getElementById('screen-light').innerHTML = SCREEN;
  document.getElementById('screen-dark').innerHTML = SCREEN;
  lucide.createIcons();
</script>
</body>
</html>
