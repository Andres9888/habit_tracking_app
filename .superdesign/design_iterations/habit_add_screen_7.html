<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Add Screen - V7 Refined</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      font-family: 'Inter', sans-serif !important;
      -webkit-font-smoothing: antialiased;
    }

    .modal-bg {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .paper-bg {
      background: #faf9f7;
    }

    .color-swatch {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .color-swatch.selected {
      box-shadow: 0 0 0 2.5px #1a1a1a;
      transform: scale(1.15);
    }

    .pressable {
      transition: transform 0.15s ease-out;
    }

    .pressable:active {
      transform: scale(0.96);
    }

    input:focus {
      outline: none;
    }

    .emoji-chip {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .emoji-chip.selected {
      transform: scale(1.1);
      box-shadow: 0 0 0 2px #22C55E;
      background: #f0fdf4;
    }

    .template-card {
      transition: all 0.2s ease;
    }
    .template-card:hover {
      transform: translateY(-2px);
    }
    .template-card:active {
      transform: scale(0.97);
    }

    .reminder-option {
      transition: all 0.15s ease;
    }
    .reminder-option.selected {
      background: #f0fdf4;
      border-color: #22C55E;
    }

    ::-webkit-scrollbar {
      width: 0px;
    }

    .template-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .template-scroll::-webkit-scrollbar {
      display: none;
    }

    .science-badge {
      background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
    }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-end justify-center p-4">

  <!-- Phone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">

    <!-- Screen -->
    <div class="w-full h-full rounded-[40px] overflow-hidden relative modal-bg">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[88%] paper-bg rounded-t-3xl flex flex-col shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4">
          <button class="w-9 h-9 flex items-center justify-center rounded-full bg-stone-200/60 pressable">
            <i data-lucide="x" class="w-5 h-5 text-stone-600"></i>
          </button>
          <h1 class="text-lg font-semibold text-stone-900">New Habit</h1>
          <div class="w-9"></div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto pb-6">

          <!-- Quick Picks with Social Proof -->
          <div class="mb-4 px-5">
            <div class="flex items-center justify-between mb-2.5">
              <p class="text-xs font-semibold text-stone-500 uppercase tracking-wide">Popular habits</p>
              <button class="text-xs text-green-600 font-medium pressable flex items-center gap-1">
                See all
                <i data-lucide="chevron-right" class="w-3 h-3"></i>
              </button>
            </div>
          </div>
          <div class="template-scroll overflow-x-auto pl-5 mb-5">
            <div class="flex gap-2.5 pr-5">
              <!-- Template 1 - with science badge -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-white border border-stone-200 shadow-sm relative">
                <div class="science-badge absolute -top-1.5 -right-1.5 px-1.5 py-0.5 rounded-full text-[8px] font-bold text-amber-700">
                  🔬
                </div>
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #8B5CF6 0%, #7C3AED 100%);">
                  <span class="text-sm">🧘</span>
                </div>
                <p class="text-xs font-semibold text-stone-900 leading-tight">Meditate</p>
                <p class="text-[10px] text-stone-400 mt-0.5">18k users</p>
              </button>
              <!-- Template 2 - Selected -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-green-50 border-2 border-green-500 shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);">
                  <span class="text-sm">📖</span>
                </div>
                <p class="text-xs font-semibold text-green-800 leading-tight">Read</p>
                <p class="text-[10px] text-green-600 mt-0.5">24k users</p>
              </button>
              <!-- Template 3 - with science badge -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-white border border-stone-200 shadow-sm relative">
                <div class="science-badge absolute -top-1.5 -right-1.5 px-1.5 py-0.5 rounded-full text-[8px] font-bold text-amber-700">
                  🔬
                </div>
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #F97316 0%, #EA580C 100%);">
                  <span class="text-sm">💪</span>
                </div>
                <p class="text-xs font-semibold text-stone-900 leading-tight">Exercise</p>
                <p class="text-[10px] text-stone-400 mt-0.5">32k users</p>
              </button>
              <!-- Template 4 -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-white border border-stone-200 shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #0EA5E9 0%, #0284C7 100%);">
                  <span class="text-sm">💧</span>
                </div>
                <p class="text-xs font-semibold text-stone-900 leading-tight">Hydrate</p>
                <p class="text-[10px] text-stone-400 mt-0.5">15k users</p>
              </button>
              <!-- Template 5 -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-white border border-stone-200 shadow-sm relative">
                <div class="science-badge absolute -top-1.5 -right-1.5 px-1.5 py-0.5 rounded-full text-[8px] font-bold text-amber-700">
                  🔬
                </div>
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #FBBF24 0%, #F59E0B 100%);">
                  <span class="text-sm">📝</span>
                </div>
                <p class="text-xs font-semibold text-stone-900 leading-tight">Journal</p>
                <p class="text-[10px] text-stone-400 mt-0.5">9k users</p>
              </button>
              <!-- Template 6 -->
              <button class="template-card flex-shrink-0 w-[85px] p-2.5 rounded-xl bg-white border border-stone-200 shadow-sm">
                <div class="w-8 h-8 rounded-lg flex items-center justify-center mb-1.5" style="background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%);">
                  <span class="text-sm">😴</span>
                </div>
                <p class="text-xs font-semibold text-stone-900 leading-tight">Sleep early</p>
                <p class="text-[10px] text-stone-400 mt-0.5">11k users</p>
              </button>
            </div>
          </div>

          <!-- Divider -->
          <div class="px-5 mb-4">
            <div class="flex items-center gap-3">
              <div class="flex-1 h-px bg-stone-200"></div>
              <span class="text-[10px] text-stone-400 uppercase tracking-wide">or customize</span>
              <div class="flex-1 h-px bg-stone-200"></div>
            </div>
          </div>

          <div class="px-5">
            <!-- Habit Name Input - More prominent -->
            <div class="mb-5">
              <label class="text-xs font-medium text-stone-500 mb-1.5 block">Habit name</label>
              <div class="relative bg-white rounded-xl border-2 border-stone-200 shadow-sm overflow-hidden focus-within:border-green-500 transition-colors">
                <input
                  type="text"
                  value="Read"
                  class="w-full h-12 pl-4 pr-16 text-base font-medium text-stone-900 placeholder-stone-400 bg-transparent"
                  placeholder="e.g. Read for 20 minutes"
                />
                <div class="absolute right-3 top-1/2 -translate-y-1/2">
                  <span class="text-[10px] text-stone-400">4/50</span>
                </div>
              </div>
            </div>

            <!-- Icon & Color in one row -->
            <div class="mb-5">
              <label class="text-xs font-medium text-stone-500 mb-2 block">Style</label>
              <div class="flex gap-3">
                <!-- Emoji chips -->
                <div class="flex gap-1.5">
                  <button class="emoji-chip w-9 h-9 rounded-lg bg-white border border-stone-200 flex items-center justify-center selected">
                    <span class="text-base">📖</span>
                  </button>
                  <button class="emoji-chip w-9 h-9 rounded-lg bg-white border border-stone-200 flex items-center justify-center">
                    <span class="text-base">📚</span>
                  </button>
                  <button class="emoji-chip w-9 h-9 rounded-lg bg-white border border-stone-200 flex items-center justify-center">
                    <span class="text-base">📰</span>
                  </button>
                  <button class="emoji-chip w-9 h-9 rounded-lg bg-stone-100 border border-stone-200 flex items-center justify-center">
                    <i data-lucide="plus" class="w-3.5 h-3.5 text-stone-400"></i>
                  </button>
                </div>
                <!-- Divider -->
                <div class="w-px bg-stone-200"></div>
                <!-- Color chips -->
                <div class="flex gap-1.5">
                  <button class="color-swatch w-9 h-9 rounded-lg pressable" style="background: #EF4444;"></button>
                  <button class="color-swatch w-9 h-9 rounded-lg pressable selected" style="background: #22C55E;"></button>
                  <button class="color-swatch w-9 h-9 rounded-lg pressable" style="background: #3B82F6;"></button>
                  <button class="color-swatch w-9 h-9 rounded-lg bg-stone-100 border border-stone-200 flex items-center justify-center">
                    <i data-lucide="palette" class="w-3.5 h-3.5 text-stone-400"></i>
                  </button>
                </div>
              </div>
            </div>

            <!-- Reminder - Combined toggle + time -->
            <div class="mb-5">
              <label class="text-xs font-medium text-stone-500 mb-2 block">Reminder</label>
              <div class="flex gap-2">
                <button class="reminder-option flex-1 py-3 px-3 rounded-xl bg-white border border-stone-200 pressable flex items-center gap-2">
                  <span class="text-base">🔕</span>
                  <span class="text-sm font-medium text-stone-600">None</span>
                </button>
                <button class="reminder-option flex-1 py-3 px-3 rounded-xl pressable flex items-center gap-2 selected border-2">
                  <span class="text-base">🌅</span>
                  <div class="text-left">
                    <span class="text-sm font-medium text-green-700 block">Morning</span>
                    <span class="text-[10px] text-green-600">7:00 AM</span>
                  </div>
                </button>
                <button class="reminder-option flex-1 py-3 px-3 rounded-xl bg-white border border-stone-200 pressable flex items-center gap-2">
                  <span class="text-base">☀️</span>
                  <div class="text-left">
                    <span class="text-sm font-medium text-stone-600 block">Midday</span>
                    <span class="text-[10px] text-stone-400">12:00 PM</span>
                  </div>
                </button>
                <button class="reminder-option flex-1 py-3 px-3 rounded-xl bg-white border border-stone-200 pressable flex items-center gap-2">
                  <span class="text-base">🌙</span>
                  <div class="text-left">
                    <span class="text-sm font-medium text-stone-600 block">Evening</span>
                    <span class="text-[10px] text-stone-400">8:00 PM</span>
                  </div>
                </button>
              </div>
            </div>

            <!-- Motivation micro-copy -->
            <div class="text-center py-2">
              <p class="text-xs text-stone-400">✨ Start your streak today!</p>
            </div>

          </div>

          <!-- Bottom Spacing -->
          <div class="h-24"></div>
        </div>

        <!-- Sticky Create Button -->
        <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent pt-8">
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #22C55E 0%, #16A34A 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-base font-semibold text-white">Create Habit</span>
          </button>
          <div class="flex justify-center mt-3">
            <div class="w-32 h-1 rounded-full bg-stone-300"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
