<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', sans-serif !important;
        background: #0a0a0b !important;
        color: #e4e4e7 !important;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6 {
        font-family: 'Inter', sans-serif !important;
        color: #fafafa !important;
      }
      code,
      .mono {
        font-family: 'JetBrains Mono', monospace !important;
      }

      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      .kanban-col {
        min-height: 400px;
      }
      .task-card {
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          border-color 0.15s ease;
      }
      .task-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
      }
      .tab-btn {
        transition: all 0.2s ease;
      }
      .tab-btn.active {
        background: #18181b;
        color: #fafafa;
        border-color: #3f3f46;
      }
      .progress-fill {
        transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .cal-day {
        transition: all 0.15s ease;
      }
      .cal-day:hover {
        background: #1c1c1f !important;
      }
      .cal-day.today {
        border: 2px solid #a78bfa !important;
      }
      .filter-chip {
        transition: all 0.15s ease;
        cursor: pointer;
        user-select: none;
      }
      .filter-chip:hover {
        opacity: 0.85;
      }

      .badge-critical {
        background: #7f1d1d;
        color: #fca5a5;
        border: 1px solid #991b1b;
      }
      .badge-high {
        background: #78350f;
        color: #fbbf24;
        border: 1px solid #92400e;
      }
      .badge-medium {
        background: #1e3a5f;
        color: #93c5fd;
        border: 1px solid #1e40af;
      }
      .badge-low {
        background: #14332a;
        color: #6ee7b7;
        border: 1px solid #065f46;
      }

      .cat-security {
        border-left: 3px solid #ef4444;
      }
      .cat-bugs {
        border-left: 3px solid #f59e0b;
      }
      .cat-performance {
        border-left: 3px solid #8b5cf6;
      }
      .cat-appstore {
        border-left: 3px solid #3b82f6;
      }
      .cat-revenue {
        border-left: 3px solid #10b981;
      }
      .cat-legal {
        border-left: 3px solid #ec4899;
      }
      .cat-testing {
        border-left: 3px solid #06b6d4;
      }
      .cat-cleanup {
        border-left: 3px solid #6b7280;
      }

      .cat-dot-security {
        background: #ef4444;
      }
      .cat-dot-bugs {
        background: #f59e0b;
      }
      .cat-dot-performance {
        background: #8b5cf6;
      }
      .cat-dot-appstore {
        background: #3b82f6;
      }
      .cat-dot-revenue {
        background: #10b981;
      }
      .cat-dot-legal {
        background: #ec4899;
      }
      .cat-dot-testing {
        background: #06b6d4;
      }
      .cat-dot-cleanup {
        background: #6b7280;
      }

      .milestone-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .milestone-line {
        width: 2px;
        background: #27272a;
        flex-shrink: 0;
      }

      .view-panel {
        display: none;
        animation: fadeIn 0.2s ease;
      }
      .view-panel.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* Accomplishment glow */
      .cal-done {
        position: relative;
      }
      .cal-done::after {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: 8px;
        background: linear-gradient(
          135deg,
          rgba(52, 211, 153, 0.15),
          rgba(167, 139, 250, 0.15)
        );
        z-index: -1;
        pointer-events: none;
      }
      .score-ring {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .streak-badge {
        background: linear-gradient(135deg, #f59e0b, #ef4444);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      @keyframes celebratePulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.05);
        }
      }
      .celebrate {
        animation: celebratePulse 2s ease-in-out infinite;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.show {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-content {
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 12px;
        max-width: 520px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
        padding: 24px;
      }

            </div>

        <div class="flex flex-wrap items-center gap-1">

          <div id="milestoneTimeline"></div>
        </div>
      </div>
      <div id="view-stats" class="view-panel">

      </div>
    </main>

    <div class="modal-overlay" id="taskModal">

              return TASKS.find(function (t) {
                return t.id === id;
              });
            })
            .filter(Boolean);
          var isPast = d < today.getDate();
          var isFuture = d > 21;
          var hasTasks = plannedTasks.length > 0;

          // Check completion log for this day
          var dayLog = COMPLETED_LOG[dateStr];
          var doneCount = dayLog ? dayLog.tasks.length : 0;
          var hasDone = doneCount > 0;

          // Collect tasks completed on this day (from task doneDate field)
          var doneTasks = TASKS.filter(function (t) {
            return t.doneDate === dateStr;
          });
          if (doneTasks.length > doneCount) doneCount = doneTasks.length;
          hasDone = doneCount > 0;

          var cats = [];
          var allDayTasks = plannedTasks.concat(doneTasks);
          allDayTasks.forEach(function (t) {
            if (cats.indexOf(t.cat) === -1) cats.push(t.cat);

          cell.className =
            'cal-day rounded-lg p-1.5 min-h-[90px]' +
            (isToday ? ' today bg-zinc-800/50' : ' bg-zinc-900') +
            (isPast && !hasDone ? ' opacity-40' : '') +
            (isFuture ? ' opacity-30' : '') +
            (hasDone ? ' cal-done' : '');

          if (hasTasks || hasDone) {
            (function (ds) {
              cell.style.cursor = 'pointer';

                showDayDetail(ds);

          cellHeader.className = 'flex items-center justify-between mb-1';

        wrapper.appendChild(calGrid);

          if (doneTasks.length > 0) {
            var planHeader = document.createElement('div');
            planHeader.className =
              'text-xs text-zinc-500 font-semibold uppercase tracking-wider mb-2';
            planHeader.textContent = 'Planned';
            planSection.appendChild(planHeader);
          } else {
            var countLabel = document.createElement('div');
            countLabel.className = 'text-xs text-zinc-500 mb-3';
            countLabel.textContent =
              plannedTasks.length +
              ' task' +
              (plannedTasks.length !== 1 ? 's' : '') +
              ' planned';
            planSection.appendChild(countLabel);
          }

          plannedTasks.forEach(function (t) {
            var catInfo = CATEGORIES[t.cat];
            var tCard = document.createElement('div');
            tCard.className =
              'cat-' +
              t.cat +
              ' bg-zinc-800/50 rounded-lg p-3 border border-zinc-700/50 cursor-pointer hover:border-zinc-600 mb-2';
            tCard.addEventListener('click', function () {
              closeModal();
              setTimeout(function () {
                showTaskDetail(t.id);
              }, 200);
            });
            var tBadges = document.createElement('div');
            tBadges.className = 'flex items-center gap-2 mb-1';
            var tPri = document.createElement('span');
            tPri.className =
              'badge-' +
              t.priority +
              ' text-[10px] font-semibold mono px-1.5 py-0.5 rounded';
            tPri.textContent = getPriorityLabel(t.priority);
            tBadges.appendChild(tPri);
            var tCat = document.createElement('span');
            tCat.className = 'text-[10px] px-1.5 py-0.5 rounded-full';
            tCat.style.background = catInfo.color + '22';
            tCat.style.color = catInfo.color;
            tCat.textContent = catInfo.label;
            tBadges.appendChild(tCat);
            if (t.status === 'done') {
              var doneLabel = document.createElement('span');
              doneLabel.className = 'text-[10px] text-emerald-400';
              doneLabel.textContent = '\u2713 Done';
              tBadges.appendChild(doneLabel);
            }
            tCard.appendChild(tBadges);
            var tTitle = document.createElement('h4');
            tTitle.className =
              'text-sm font-medium' +
              (t.status === 'done' ? ' line-through text-zinc-500' : '');
            tTitle.textContent = t.title;
            tCard.appendChild(tTitle);
            var tFile = document.createElement('p');
            tFile.className = 'text-xs text-zinc-500 mono mt-0.5';
            tFile.textContent = t.file;
            tCard.appendChild(tFile);
            planSection.appendChild(tCard);
          });
          mc.appendChild(planSection);
        }

        document.getElementById('taskModal').classList.add('show');
      }

      function closeModal() {
        document.getElementById('taskModal').classList.remove('show');
      }

      document
        .getElementById('taskModal')
        .addEventListener('click', function (e) {
          if (e.target === e.currentTarget) closeModal();
        });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });

      function renderFilterChips() {
        var container = document.getElementById('filterChips');
        container.textContent = '';

        var allBtn = document.createElement('button');
        allBtn.className =
          'filter-chip text-[11px] px-2 py-1 rounded-full border ' +
          (activeFilter === null
            ? 'border-zinc-500 text-zinc-200 bg-zinc-800'
            : 'border-zinc-700 text-zinc-500');
        allBtn.textContent = 'All';
        allBtn.addEventListener('click', function () {
          setFilter(null);
        });
        container.appendChild(allBtn);

        Object.keys(CATEGORIES).forEach(function (key) {
          var cat = CATEGORIES[key];
          var btn = document.createElement('button');
          btn.className =
            'filter-chip text-[11px] px-2 py-1 rounded-full border ' +
            (activeFilter === key
              ? 'text-zinc-200 bg-zinc-800'
              : 'text-zinc-500');
          btn.style.borderColor = activeFilter === key ? cat.color : '#3f3f46';
          var dot = document.createElement('span');
          dot.className = 'inline-block w-1.5 h-1.5 rounded-full mr-1';
          dot.style.background = cat.color;
          btn.appendChild(dot);
          btn.appendChild(document.createTextNode(cat.label));
          btn.addEventListener('click', function () {
            setFilter(key);
          });
          container.appendChild(btn);
        });
      }

      function setFilter(cat) {
        activeFilter = cat;
        renderFilterChips();
        renderKanban();
      }

      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          document.querySelectorAll('.tab-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
          var view = btn.getAttribute('data-view');
          activeView = view;
          document.querySelectorAll('.view-panel').forEach(function (p) {
            p.classList.remove('active');
          });
          document.getElementById('view-' + view).classList.add('active');
        });
      });

      function updateProgress() {
        var total = TASKS.length;
        var done = TASKS.filter(function (t) {
          return t.status === 'done';
        }).length;
        var pct = Math.round((done / total) * 100);
        document.getElementById('progressBar').style.width = pct + '%';
        document.getElementById('progressText').textContent = pct + '%';
        document.getElementById('progressCount').textContent =
          done + '/' + total + ' tasks';
      }

      function updateDateDisplay() {
        var now = new Date();
        document.getElementById('dateDisplay').textContent =
          now.toLocaleDateString('en-US', {
            weekday: 'short',
            month: 'short',
            day: 'numeric',
            year: 'numeric',
          });
      }

      function init() {
        updateDateDisplay();
        renderFilterChips();
        renderKanban();
        renderCalendar();
        renderStats();
        updateProgress();
        lucide.createIcons();
      }

      document.addEventListener('DOMContentLoaded', init);
    </script>
  </body>
</html>
