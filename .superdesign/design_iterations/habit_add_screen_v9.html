<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Habit - V9 (Consistent with App Design System)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    /* App Design System */
    :root {
      /* Primary Emerald */
      --primary-50: #ECFDF5;
      --primary-100: #D1FAE5;
      --primary-300: #6EE7B7;
      --primary-400: #34D399;
      --primary-500: #10B981;
      --primary-600: #059669;
      --primary-700: #047857;

      /* Neutrals (Stone/Gray) */
      --gray-50: #faf9f7;
      --gray-100: #f5f5f4;
      --gray-200: #e7e5e4;
      --gray-300: #d6d3d1;
      --gray-400: #a8a29e;
      --gray-500: #78716c;
      --gray-600: #57534e;
      --gray-700: #44403c;
      --gray-800: #292524;
      --gray-900: #1c1917;

      /* Typography */
      --font-sans: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif;

      /* Spacing (8pt grid) */
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-5: 20px;
      --space-6: 24px;
      --space-8: 32px;
      --space-10: 40px;
      --space-12: 48px;

      /* Border Radius */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
      --radius-xl: 20px;
      --radius-full: 9999px;
    }

    * {
      font-family: var(--font-sans) !important;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    body {
      background: #1a1a1a;
    }

    .modal-bg {
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
    }

    .paper-bg {
      background: var(--gray-50);
    }

    /* Input styling */
    .habit-input {
      height: 56px;
      font-size: 17px;
      font-weight: 500;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 0 var(--space-4);
      padding-right: 48px;
      background: white;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      width: 100%;
    }

    .habit-input:focus {
      outline: none;
      border-color: var(--primary-500);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
    }

    .habit-input::placeholder {
      color: var(--gray-400);
      font-weight: 400;
    }

    /* Section label */
    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--gray-500);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: var(--space-3);
    }

    /* Emoji chips */
    .emoji-chip {
      width: 48px;
      height: 48px;
      border-radius: var(--radius-md);
      background: white;
      border: 1.5px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .emoji-chip:hover {
      border-color: var(--gray-300);
      transform: scale(1.02);
    }

    .emoji-chip.selected {
      border-color: var(--primary-500);
      border-width: 2px;
      background: var(--primary-50);
      transform: scale(1.05);
    }

    /* Color swatches */
    .color-swatch {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-full);
      transition: all 0.15s ease;
      cursor: pointer;
      border: 2px solid transparent;
    }

    .color-swatch:hover {
      transform: scale(1.1);
    }

    .color-swatch.selected {
      transform: scale(1.15);
      box-shadow: 0 0 0 3px white, 0 0 0 5px currentColor;
    }

    /* Reminder pills */
    .reminder-pill {
      flex: 1;
      padding: var(--space-3) var(--space-2);
      border-radius: var(--radius-md);
      background: white;
      border: 1.5px solid var(--gray-200);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      transition: all 0.15s ease;
      cursor: pointer;
    }

    .reminder-pill:hover {
      border-color: var(--gray-300);
    }

    .reminder-pill.selected {
      border-color: var(--primary-500);
      border-width: 2px;
      background: var(--primary-50);
    }

    .reminder-pill .emoji {
      font-size: 20px;
    }

    .reminder-pill .label {
      font-size: 12px;
      font-weight: 600;
      color: var(--gray-600);
    }

    .reminder-pill.selected .label {
      color: var(--primary-700);
    }

    .reminder-pill .time {
      font-size: 10px;
      color: var(--gray-400);
    }

    .reminder-pill.selected .time {
      color: var(--primary-600);
    }

    /* Create button */
    .create-btn {
      height: 56px;
      border-radius: var(--radius-lg);
      background: linear-gradient(135deg, var(--primary-500) 0%, var(--primary-600) 100%);
      color: white;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.15s ease;
      cursor: pointer;
      border: none;
      width: 100%;
    }

    .create-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    .create-btn:active {
      transform: scale(0.98);
    }

    /* Pressable */
    .pressable {
      transition: transform 0.1s ease;
      cursor: pointer;
    }

    .pressable:active {
      transform: scale(0.96);
    }

    /* Hide scrollbar */
    ::-webkit-scrollbar { width: 0; }

    /* Motivation text */
    .motivation-text {
      font-size: 13px;
      color: var(--gray-500);
      text-align: center;
    }

    .motivation-text span {
      color: var(--primary-600);
      font-weight: 600;
    }
  </style>
</head>
<body class="min-h-screen flex items-end justify-center p-4">
  <!-- iPhone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <!-- Screen Content -->
    <div class="w-full h-full rounded-[40px] overflow-hidden relative modal-bg">
      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[88%] paper-bg rounded-t-[24px] flex flex-col shadow-2xl">

        <!-- Header - Clean & Centered -->
        <div class="flex items-center justify-between px-5 py-4">
          <button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-stone-100 pressable">
            <i data-lucide="x" class="w-6 h-6 text-stone-400"></i>
          </button>
          <h1 class="text-[17px] font-semibold text-stone-800">New Habit</h1>
          <div class="w-10"></div>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-5 pb-8">

          <!-- Habit Name Section -->
          <div class="mb-6">
            <label class="section-label">Habit Name</label>
            <div class="relative">
              <input
                type="text"
                class="habit-input"
                placeholder="e.g. Read for 20 minutes"
                value="Read for 20 minutes"
              />
              <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-stone-400">20/50</span>
            </div>
            <p class="mt-2 text-xs text-stone-400">Tip: Be specific — time, trigger, place</p>
          </div>

          <!-- Icon Section -->
          <div class="mb-6">
            <label class="section-label">Icon</label>
            <div class="flex gap-3">
              <button class="emoji-chip selected">📖</button>
              <button class="emoji-chip">📚</button>
              <button class="emoji-chip">✍️</button>
              <button class="emoji-chip">🎯</button>
              <button class="emoji-chip">✨</button>
              <button class="emoji-chip flex items-center justify-center !bg-stone-100 !border-dashed">
                <i data-lucide="plus" class="w-5 h-5 text-stone-400"></i>
              </button>
            </div>
          </div>

          <!-- Color Section -->
          <div class="mb-6">
            <label class="section-label">Color</label>
            <div class="flex flex-wrap gap-3">
              <button class="color-swatch" style="background: #EF4444; color: #EF4444;"></button>
              <button class="color-swatch" style="background: #F97316; color: #F97316;"></button>
              <button class="color-swatch" style="background: #FBBF24; color: #FBBF24;"></button>
              <button class="color-swatch" style="background: #84CC16; color: #84CC16;"></button>
              <button class="color-swatch selected" style="background: #10B981; color: #10B981;"></button>
              <button class="color-swatch" style="background: #14B8A6; color: #14B8A6;"></button>
              <button class="color-swatch" style="background: #06B6D4; color: #06B6D4;"></button>
              <button class="color-swatch" style="background: #3B82F6; color: #3B82F6;"></button>
              <button class="color-swatch" style="background: #8B5CF6; color: #8B5CF6;"></button>
              <button class="color-swatch" style="background: #A855F7; color: #A855F7;"></button>
              <button class="color-swatch" style="background: #EC4899; color: #EC4899;"></button>
              <button class="color-swatch" style="background: #78716C; color: #78716C;"></button>
            </div>
          </div>

          <!-- Reminder Section -->
          <div class="mb-6">
            <label class="section-label">Daily Reminder</label>
            <div class="flex gap-2">
              <button class="reminder-pill">
                <span class="emoji">🔕</span>
                <span class="label">None</span>
              </button>
              <button class="reminder-pill selected">
                <span class="emoji">🌅</span>
                <span class="label">Morning</span>
                <span class="time">7:00 AM</span>
              </button>
              <button class="reminder-pill">
                <span class="emoji">☀️</span>
                <span class="label">Midday</span>
                <span class="time">12:00 PM</span>
              </button>
              <button class="reminder-pill">
                <span class="emoji">🌙</span>
                <span class="label">Evening</span>
                <span class="time">8:00 PM</span>
              </button>
            </div>
          </div>

          <!-- Spacer for sticky button -->
          <div class="h-32"></div>
        </div>

        <!-- Sticky Footer -->
        <div class="absolute bottom-0 left-0 right-0 px-5 pb-8 pt-4 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent">
          <!-- Motivation Text -->
          <p class="motivation-text mb-3">
            <span>Start your streak today</span> — consistency is key 🔥
          </p>

          <!-- Create Button -->
          <button class="create-btn">
            <i data-lucide="check" class="w-5 h-5"></i>
            Create Habit
          </button>

          <!-- Home Indicator -->
          <div class="flex justify-center mt-4">
            <div class="w-32 h-1 rounded-full bg-stone-300/60"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
