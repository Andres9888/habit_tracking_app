<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Habit Card Detail Hint — Refined</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
      * {
        font-family: 'Plus Jakarta Sans', sans-serif !important;
      }
      body {
        background: #e7e2db;
        margin: 0;
        padding: 32px 16px 48px;
      }
      .phone {
        width: 340px;
        margin: 0 auto;
        background: #f5f1ed;
        border-radius: 36px;
        padding: 16px 0 24px;
        box-shadow: 0 22px 50px -12px rgba(0, 0, 0, 0.28);
      }
      .hint {
        margin: 8px 24px 0;
        background: #edeae5;
        border: 1px solid #ddd8d2;
        border-radius: 16px;
        padding: 12px 14px;
        display: flex;
        align-items: flex-start;
        gap: 10px;
        animation: hintIn 280ms cubic-bezier(0.33, 1, 0.68, 1) both;
      }
      .hint.out {
        animation: hintOut 180ms cubic-bezier(0.33, 1, 0.68, 1) forwards;
      }
      @keyframes hintIn {
        from {
          opacity: 0;
          transform: translateY(-10px);
          max-height: 0;
          margin-top: 0;
          padding-top: 0;
          padding-bottom: 0;
        }
        to {
          opacity: 1;
          transform: translateY(0);
          max-height: 120px;
        }
      }
      @keyframes hintOut {
        from {
          opacity: 1;
          transform: translateY(0);
          max-height: 120px;
        }
        to {
          opacity: 0;
          transform: translateY(-8px);
          max-height: 0;
          margin-top: 0;
          padding-top: 0;
          padding-bottom: 0;
        }
      }
      .icon-wrap {
        background: #d1fae5;
        border-radius: 8px;
        padding: 6px;
        margin-top: 2px;
      }
      .title {
        font-size: 14px;
        font-weight: 600;
        color: #2d2a26;
        line-height: 1.3;
      }
      .body {
        font-size: 12px;
        color: #6b6560;
        margin-top: 2px;
        line-height: 1.4;
      }
      .got-it {
        font-size: 12px;
        font-weight: 600;
        color: #6b6560;
        background: #f5f1ed;
        border-radius: 999px;
        padding: 4px 10px;
        border: none;
        cursor: pointer;
        white-space: nowrap;
      }
      .calendar-strip {
        margin: 0 24px;
        height: 52px;
        border-radius: 14px;
        background: #edeae5;
        border: 1px solid #ddd8d2;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #8b847d;
        font-size: 11px;
        font-weight: 600;
      }
      .card-mini {
        margin: 12px 24px 0;
        background: #edeae5;
        border: 1px solid #ddd8d2;
        border-radius: 24px;
        padding: 14px;
        position: relative;
        overflow: hidden;
        transition: margin-top 280ms cubic-bezier(0.33, 1, 0.68, 1);
      }
      .accent {
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 4px;
        background: #059669;
      }
    </style>
  </head>
  <body>
    <p
      style="
        max-width: 340px;
        margin: 0 auto 20px;
        text-align: center;
        font-size: 12px;
        color: #6b6560;
        line-height: 1.5;
      "
    >
      Neutral parchment hint · fade+slide enter · collapse on dismiss
    </p>

    <div class="phone">
      <div class="calendar-strip">CALENDAR TIMELINE</div>
      <div class="hint" id="banner">
        <div class="icon-wrap">
          <i
            data-lucide="mouse-pointer-click"
            style="width: 16px; height: 16px; color: #059669"
          ></i>
        </div>
        <div style="flex: 1; min-width: 0">
          <div class="title">Two ways to use a card</div>
          <div class="body">
            Tap the card for details · tap a day to check in
          </div>
        </div>
        <button type="button" class="got-it" onclick="dismiss()">Got it</button>
      </div>
      <div class="card-mini" id="card">
        <div class="accent"></div>
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            padding-left: 4px;
          "
        >
          <span style="font-size: 22px">🏃</span>
          <span style="font-size: 15px; font-weight: 700; color: #2d2a26"
            >Morning Run</span
          >
          <span style="margin-left: auto; color: #c4bfb7; font-size: 18px"
            >›</span
          >
        </div>
      </div>
    </div>

    <p
      style="
        max-width: 340px;
        margin: 20px auto 0;
        text-align: center;
        font-size: 11px;
        color: #8b847d;
      "
    >
      <button
        onclick="reset()"
        style="
          background: #edeae5;
          border: 1px solid #ddd8d2;
          border-radius: 8px;
          padding: 6px 12px;
          cursor: pointer;
          font-size: 12px;
        "
      >
        Replay animation
      </button>
    </p>

    <script>
      lucide.createIcons();
      function dismiss() {
        const b = document.getElementById('banner');
        b.classList.add('out');
        b.addEventListener(
          'animationend',
          () => {
            b.style.display = 'none';
          },
          { once: true }
        );
      }
      function reset() {
        const b = document.getElementById('banner');
        b.style.display = 'flex';
        b.classList.remove('out');
        void b.offsetWidth;
        b.style.animation = 'none';
        void b.offsetWidth;
        b.style.animation = '';
      }
    </script>
  </body>
</html>
