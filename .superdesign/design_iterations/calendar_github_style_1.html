<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendar - GitHub-Style Heatmap</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { font-family: 'Inter', sans-serif; }

    /* Design System CSS Variables */
    :root {
      --color-background: #faf9f7;
      --color-card: #ffffff;
      --color-border: #e7e5e4;
      --color-text-primary: #1F2937;
      --color-text-secondary: #78716c;
      --color-text-tertiary: #9CA3AF;
      --radius: 0.5rem;

      /* Dynamic habit color (emerald default) */
      --habit-color: #10B981;
      --habit-color-50: #ECFDF5;
      --habit-color-100: #D1FAE5;
      --habit-color-200: #A7F3D0;
      --habit-color-300: #6EE7B7;
      --habit-color-400: #34D399;
      --habit-color-500: #10B981;
      --habit-color-600: #059669;
    }

    body { background: #78716c; }

    .phone-frame {
      width: 375px;
      height: 812px;
      background: var(--color-background);
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
    }

    .notch {
      width: 150px;
      height: 30px;
      background: #1c1917;
      border-radius: 0 0 20px 20px;
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
    }

    /* Card styling */
    .ds-card {
      background: var(--color-card);
      border-radius: calc(var(--radius) * 2);
      border: 1px solid var(--color-border);
    }

    /* GitHub-style heatmap cell */
    .gh-cell {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
      cursor: pointer;
    }

    .gh-cell:hover {
      transform: scale(1.3);
      box-shadow: 0 0 4px rgba(0,0,0,0.2);
      z-index: 10;
      position: relative;
    }

    /* Intensity levels */
    .gh-0 { background: #f5f5f4; }
    .gh-1 { background: var(--habit-color-100); }
    .gh-2 { background: var(--habit-color-200); }
    .gh-3 { background: var(--habit-color-300); }
    .gh-4 { background: var(--habit-color-400); }
    .gh-5 { background: var(--habit-color-500); }

    /* Today indicator */
    .gh-today {
      box-shadow: inset 0 0 0 2px var(--habit-color-600);
      background: var(--color-card);
    }

    /* Future cell */
    .gh-future {
      background: #fafafa;
      opacity: 0.5;
    }

    /* Calendar day cell */
    .cal-day {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius);
      position: relative;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      color: var(--color-text-primary);
    }

    .cal-day:hover {
      background: #f5f5f4;
    }

    .cal-day.completed {
      background: var(--habit-color-50);
    }

    .cal-day.completed::after {
      content: '';
      width: 6px;
      height: 6px;
      background: var(--habit-color);
      border-radius: 50%;
      position: absolute;
      bottom: 6px;
    }

    .cal-day.today {
      font-weight: 700;
      box-shadow: inset 0 0 0 2px var(--habit-color);
    }

    .cal-day.other-month {
      color: #d6d3d1;
    }

    .cal-day.future {
      color: var(--color-text-tertiary);
    }

    /* Badge styling */
    .ds-badge {
      border-radius: 9999px;
      padding: 6px 12px;
      font-size: 14px;
      font-weight: 500;
    }

    /* Button styling */
    .ds-btn {
      border-radius: 9999px;
      border: 1px solid var(--color-border);
      background: var(--color-card);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .ds-btn:hover {
      background: #f5f5f4;
    }

    .ds-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8">

      <button onclick="setTheme('purple')" class="w-8 h-8 rounded-full bg-violet-500 border-2 border-white shadow"></button>
      <button onclick="setTheme('orange')" class="w-8 h-8 rounded-full bg-orange-500 border-2 border-white shadow"></button>
      <button onclick="setTheme('pink')" class="w-8 h-8 rounded-full bg-pink-500 border-2 border-white shadow"></button>
    </div>
  </div>

  <script>
    const themes = {
      emerald: { main: '#10B981', 50: '#ECFDF5', 100: '#D1FAE5', 200: '#A7F3D0', 300: '#6EE7B7', 400: '#34D399', 500: '#10B981', 600: '#059669' },
      blue: { main: '#3B82F6', 50: '#EFF6FF', 100: '#DBEAFE', 200: '#BFDBFE', 300: '#93C5FD', 400: '#60A5FA', 500: '#3B82F6', 600: '#2563EB' },
      purple: { main: '#8B5CF6', 50: '#F5F3FF', 100: '#EDE9FE', 200: '#DDD6FE', 300: '#C4B5FD', 400: '#A78BFA', 500: '#8B5CF6', 600: '#7C3AED' },
      orange: { main: '#F97316', 50: '#FFF7ED', 100: '#FFEDD5', 200: '#FED7AA', 300: '#FDBA74', 400: '#FB923C', 500: '#F97316', 600: '#EA580C' },
      pink: { main: '#EC4899', 50: '#FDF2F8', 100: '#FCE7F3', 200: '#FBCFE8', 300: '#F9A8D4', 400: '#F472B6', 500: '#EC4899', 600: '#DB2777' }
    };

    function setTheme(color) {
      const theme = themes[color];
      const root = document.documentElement;
      root.style.setProperty('--habit-color', theme.main);
      root.style.setProperty('--habit-color-50', theme[50]);
      root.style.setProperty('--habit-color-100', theme[100]);
      root.style.setProperty('--habit-color-200', theme[200]);
      root.style.setProperty('--habit-color-300', theme[300]);
      root.style.setProperty('--habit-color-400', theme[400]);
      root.style.setProperty('--habit-color-500', theme[500]);
      root.style.setProperty('--habit-color-600', theme[600]);
    }
  </script>

</body>
</html>
