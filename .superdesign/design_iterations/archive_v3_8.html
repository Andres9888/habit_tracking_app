<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived Habits — Grouped by Recency</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif !important;
    background: #1a1a1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    padding: 40px 0;
  }

  .screen {
    width: 390px;
    min-height: 700px;
    background: #F5F1ED;
    position: relative;
    overflow: hidden;
  }

  .screen-content {
    padding: 0 16px 40px;
    overflow-y: auto;
  }

  /* Header */
  .page-header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: #F5F1ED;
    padding: 16px 16px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .header-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #2D2A26;
    transition: background 0.15s;
  }

  .header-btn:hover {
    background: rgba(0,0,0,0.06);
  }

  .header-title {
    font-family: 'Literata', serif !important;
    font-size: 22px;
    font-weight: 700;
    color: #2D2A26;
    line-height: 1.2;
  }

  .select-btn {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 14px;
    font-weight: 600;
    color: #059669;
    background: none;
    border: none;
    cursor: pointer;
    padding: 6px 10px;
    border-radius: 8px;
    transition: background 0.15s;
  }

  .select-btn:hover {
    background: rgba(5, 150, 105, 0.08);
  }

  /* Section */
  .section {
    margin-bottom: 24px;
    opacity: 0;
    transform: translateY(12px);
  }

  .section.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.4s ease-out, transform 0.4s ease-out;
  }

  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 4px;
    margin-bottom: 8px;
    cursor: pointer;
    user-select: none;
  }

  .section-header-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #9CA3AF;
  }

  .section-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 22px;
    height: 20px;
    padding: 0 6px;
    border-radius: 10px;
    background: rgba(5, 150, 105, 0.1);
    color: #059669;
    font-size: 11px;
    font-weight: 700;
    font-family: 'DM Sans', sans-serif !important;
  }

  .section-chevron {
    color: #9CA3AF;
    transition: transform 0.3s ease;
    flex-shrink: 0;
  }

  .section-chevron.collapsed {
    transform: rotate(-90deg);
  }

  .section-header-right {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .restore-all-btn {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px;
    font-weight: 600;
    color: #059669;
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 6px;
    transition: background 0.15s;
  }

  .restore-all-btn:hover {
    background: rgba(5, 150, 105, 0.08);
  }

  /* Section body collapse */
  .section-body {
    overflow: hidden;
    max-height: 500px;
    transition: max-height 0.35s ease, opacity 0.25s ease;
    opacity: 1;
  }

  .section-body.collapsed {
    max-height: 0;
    opacity: 0;
  }

  /* Habit row */
  .habit-row {
    display: flex;
    align-items: center;
    height: 64px;
    padding: 0 4px;
    position: relative;
  }

  .habit-row + .habit-row {
    border-top: 1px solid #DDD8D2;
  }

  .habit-emoji-circle {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    flex-shrink: 0;
    margin-right: 12px;
  }

  .habit-info {
    flex: 1;
    min-width: 0;
  }

  .habit-name {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 15px;
    font-weight: 600;
    color: #2D2A26;
    line-height: 1.3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .habit-ago {
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px;
    color: #6E6660;
    line-height: 1.3;
  }

  .habit-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .resume-pill {
    height: 32px;
    padding: 0 14px;
    border-radius: 16px;
    background: #059669;
    color: #fff;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }

  .resume-pill:hover {
    background: #047857;
  }

  .resume-pill:active {
    transform: scale(0.96);
  }

  .menu-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: #9CA3AF;
    transition: background 0.15s, color 0.15s;
    flex-shrink: 0;
  }

  .menu-btn:hover {
    background: rgba(0,0,0,0.06);
    color: #6E6660;
  }

  /* Menu dropdown */
  .menu-dropdown {
    position: absolute;
    right: 4px;
    top: 52px;
    z-index: 30;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.12), 0 1px 4px rgba(0,0,0,0.06);
    padding: 4px;
    min-width: 140px;
    opacity: 0;
    transform: scale(0.95) translateY(-4px);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }

  .menu-dropdown.open {
    opacity: 1;
    transform: scale(1) translateY(0);
    pointer-events: auto;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 8px 12px;
    border: none;
    background: none;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 14px;
    color: #B53030;
    cursor: pointer;
    border-radius: 6px;
    transition: background 0.12s;
  }

  .menu-item:hover {
    background: rgba(181, 48, 48, 0.06);
  }

  /* Delete all link */
  .delete-all-link {
    display: block;
    text-align: center;
    font-family: 'DM Sans', sans-serif !important;
    font-size: 13px;
    font-weight: 500;
    color: #B53030;
    background: none;
    border: none;
    cursor: pointer;
    padding: 16px;
    margin-top: 8px;
    transition: opacity 0.15s;
    width: 100%;
  }

  .delete-all-link:hover {
    opacity: 0.7;
  }

  /* Stagger entrance per row */
  .habit-row {
    opacity: 0;
    transform: translateY(8px);
  }

  .habit-row.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.3s ease-out, transform 0.3s ease-out;
  }

  /* Backdrop for closing menus */
  .backdrop {
    position: fixed;
    inset: 0;
    z-index: 25;
    display: none;
  }

  .backdrop.active {
    display: block;
  }
</style>
</head>
<body>

<div class="screen">
  <div class="page-header">
    <div class="header-left">
      <button class="header-btn" aria-label="Back">
        <i data-lucide="arrow-left" style="width:20px;height:20px;"></i>
      </button>
      <span class="header-title">Archived</span>
    </div>
    <button class="select-btn">Select</button>
  </div>

  <div class="screen-content">

    <!-- Recently Archived (last 7 days) -->
    <div class="section" data-section="recent">
      <div class="section-header" onclick="toggleSection('recent')">
        <div class="section-header-left">
          <span class="section-label">Recently Archived</span>
          <span class="section-count">2</span>
          <i data-lucide="chevron-down" class="section-chevron" style="width:16px;height:16px;" id="chevron-recent"></i>
        </div>
        <div class="section-header-right">
          <button class="restore-all-btn" onclick="event.stopPropagation()">Restore All</button>
        </div>
      </div>
      <div class="section-body" id="body-recent">
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(239, 68, 68, 0.1);">
            <span>🏃</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Morning Run</div>
            <div class="habit-ago">2 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(168, 85, 247, 0.1);">
            <span>🧘</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Meditation</div>
            <div class="habit-ago">5 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Last Month -->
    <div class="section" data-section="month">
      <div class="section-header" onclick="toggleSection('month')">
        <div class="section-header-left">
          <span class="section-label">Last Month</span>
          <span class="section-count">2</span>
          <i data-lucide="chevron-down" class="section-chevron" style="width:16px;height:16px;" id="chevron-month"></i>
        </div>
        <div class="section-header-right">
          <button class="restore-all-btn" onclick="event.stopPropagation()">Restore All</button>
        </div>
      </div>
      <div class="section-body" id="body-month">
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(34, 197, 94, 0.1);">
            <span>📖</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Read 30 Minutes</div>
            <div class="habit-ago">12 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(59, 130, 246, 0.1);">
            <span>💧</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Drink Water</div>
            <div class="habit-ago">23 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Older (collapsed by default) -->
    <div class="section" data-section="older">
      <div class="section-header" onclick="toggleSection('older')">
        <div class="section-header-left">
          <span class="section-label">Older</span>
          <span class="section-count">2</span>
          <i data-lucide="chevron-down" class="section-chevron collapsed" style="width:16px;height:16px;" id="chevron-older"></i>
        </div>
        <div class="section-header-right">
          <button class="restore-all-btn" onclick="event.stopPropagation()">Restore All</button>
        </div>
      </div>
      <div class="section-body collapsed" id="body-older">
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(251, 191, 36, 0.1);">
            <span>✍️</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Journal Entry</div>
            <div class="habit-ago">47 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
        <div class="habit-row" style="position:relative;">
          <div class="habit-emoji-circle" style="background: rgba(236, 72, 153, 0.1);">
            <span>🎨</span>
          </div>
          <div class="habit-info">
            <div class="habit-name">Practice Drawing</div>
            <div class="habit-ago">83 days ago</div>
          </div>
          <div class="habit-actions">
            <button class="resume-pill">Resume</button>
            <button class="menu-btn" onclick="toggleMenu(this)">
              <i data-lucide="more-vertical" style="width:16px;height:16px;"></i>
            </button>
          </div>
          <div class="menu-dropdown">
            <button class="menu-item">
              <i data-lucide="trash-2" style="width:14px;height:14px;"></i>
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Delete all -->
    <button class="delete-all-link">Delete All Archived</button>

  </div>
</div>

<!-- Backdrop for closing menus -->
<div class="backdrop" id="backdrop" onclick="closeAllMenus()"></div>

<script>
  // Initialize Lucide icons
  lucide.createIcons();

  // Section collapse toggle
  function toggleSection(name) {
    const body = document.getElementById('body-' + name);
    const chevron = document.getElementById('chevron-' + name);
    body.classList.toggle('collapsed');
    chevron.classList.toggle('collapsed');
  }

  // Three-dot menu
  function toggleMenu(btn) {
    event.stopPropagation();
    closeAllMenus();
    const dropdown = btn.closest('.habit-row').querySelector('.menu-dropdown');
    dropdown.classList.add('open');
    document.getElementById('backdrop').classList.add('active');
  }

  function closeAllMenus() {
    document.querySelectorAll('.menu-dropdown.open').forEach(el => el.classList.remove('open'));
    document.getElementById('backdrop').classList.remove('active');
  }

  // Stagger entrance animation per section
  function animateEntrance() {
    const sections = document.querySelectorAll('.section');
    sections.forEach((section, sIndex) => {
      setTimeout(() => {
        section.classList.add('visible');

        // Stagger rows within section
        const rows = section.querySelectorAll('.habit-row');
        rows.forEach((row, rIndex) => {
          setTimeout(() => {
            row.classList.add('visible');
          }, 80 * rIndex);
        });
      }, 150 * sIndex);
    });
  }

  // Run entrance on load
  window.addEventListener('DOMContentLoaded', () => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        animateEntrance();
      });
    });
  });
</script>

</body>
</html>
