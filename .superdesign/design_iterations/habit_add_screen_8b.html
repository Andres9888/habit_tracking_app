<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Add Screen - V8-B (Minimal)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    .paper-bg { background: #faf9f7; }
    .color-swatch { transition: all 0.15s ease-out; }
    .color-swatch.selected { box-shadow: 0 0 0 2.5px #1a1a1a; transform: scale(1.12); }
    .pressable { transition: transform 0.1s ease-out; }
    .pressable:active { transform: scale(0.96); }
    input:focus { outline: none; }
    .emoji-chip { transition: all 0.15s ease-out; }
    .emoji-chip.selected { box-shadow: 0 0 0 2px #10B981; background: #ECFDF5; }
    .option-btn { transition: all 0.15s ease; }
    .option-btn.selected { background: #ECFDF5; border-color: #10B981; }
    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-end justify-center p-4">
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative modal-bg">
      <div class="absolute bottom-0 left-0 right-0 h-[75%] paper-bg rounded-t-3xl flex flex-col shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4">
          <button class="w-9 h-9 flex items-center justify-center rounded-full bg-stone-200/60 pressable">
            <i data-lucide="x" class="w-5 h-5 text-stone-500"></i>
          </button>
          <h1 class="text-lg font-semibold text-[#1F2937]">New Habit</h1>
          <div class="w-9"></div>
        </div>

        <div class="flex-1 overflow-y-auto px-5 pb-6">

          <!-- Hero Input with inline emoji -->
          <div class="mb-6">
            <div class="flex gap-3 items-center bg-white rounded-2xl border-2 border-stone-200 p-3 focus-within:border-[#10B981] transition-colors">
              <button class="w-12 h-12 rounded-xl bg-[#ECFDF5] flex items-center justify-center pressable border-2 border-[#10B981]">
                <span class="text-2xl">📖</span>
              </button>
              <div class="flex-1">
                <input type="text" value="Read for 20 minutes" class="w-full text-lg font-semibold text-[#1F2937] placeholder-[#9CA3AF] bg-transparent" placeholder="Your new habit..."/>
                <p class="text-xs text-[#78716c] mt-0.5">Tap icon to change</p>
              </div>
            </div>
          </div>

          <!-- Color - Inline compact -->
          <div class="mb-6">
            <div class="flex items-center gap-3">
              <span class="text-sm font-medium text-[#78716c]">Color</span>
              <div class="flex gap-2 flex-1 justify-end">
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #EF4444;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #F97316;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #FBBF24;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable selected" style="background: #10B981;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #3B82F6;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #8B5CF6;"></button>
                <button class="color-swatch w-8 h-8 rounded-full pressable" style="background: #EC4899;"></button>
              </div>
            </div>
          </div>

          <!-- Reminder - Super simple -->
          <div class="mb-6">
            <div class="flex items-center justify-between p-4 bg-white rounded-xl border border-stone-200">
              <div class="flex items-center gap-3">
                <span class="text-xl">🔔</span>
                <div>
                  <p class="text-sm font-medium text-[#1F2937]">Daily reminder</p>
                  <p class="text-xs text-[#10B981]">7:00 AM</p>
                </div>
              </div>
              <button class="w-12 h-7 rounded-full bg-[#10B981] p-0.5 pressable">
                <div class="w-6 h-6 rounded-full bg-white shadow-sm transform translate-x-5"></div>
              </button>
            </div>
          </div>

          <!-- Quick time shortcuts -->
          <div class="flex gap-2 mb-6">
            <button class="option-btn flex-1 py-2 px-3 rounded-lg bg-white border border-stone-200 pressable text-center selected border-2">
              <span class="text-xs font-medium text-[#047857]">🌅 Morning</span>
            </button>
            <button class="option-btn flex-1 py-2 px-3 rounded-lg bg-white border border-stone-200 pressable text-center">
              <span class="text-xs font-medium text-[#78716c]">☀️ Midday</span>
            </button>
            <button class="option-btn flex-1 py-2 px-3 rounded-lg bg-white border border-stone-200 pressable text-center">
              <span class="text-xs font-medium text-[#78716c]">🌙 Evening</span>
            </button>
          </div>

          <!-- Templates link -->
          <div class="text-center">
            <button class="text-sm text-[#10B981] font-medium pressable">
              <i data-lucide="sparkles" class="w-4 h-4 inline mr-1"></i>
              Browse habit ideas
            </button>
          </div>
        </div>

        <!-- Sticky CTA -->
        <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent pt-8">
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-base font-semibold text-white">Create Habit</span>
          </button>
          <div class="flex justify-center mt-3"><div class="w-32 h-1 rounded-full bg-stone-300"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
