<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Onboarding — Rich Empty State</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0 !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }
    body {
      font-family: 'DM Sans', sans-serif !important;
      -webkit-font-smoothing: antialiased !important;
      background: #1a1a1a !important;
    }
    .font-literata {
      font-family: 'Literata', serif !important;
    }
    .font-dm {
      font-family: 'DM Sans', sans-serif !important;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace !important;
    }

    @keyframes addPulse {
      0%, 100% { box-shadow: 0 4px 12px rgba(5,150,105,0.3); }
      50% { box-shadow: 0 4px 24px rgba(5,150,105,0.5); }
    }

    @keyframes sproutGrow {
      0% { transform: scaleY(0); transform-origin: bottom; opacity: 0; }
      60% { transform: scaleY(1.05); opacity: 1; }
      100% { transform: scaleY(1); opacity: 1; }
    }

    @keyframes leafSway {
      0%, 100% { transform: rotate(-3deg); }
      50% { transform: rotate(3deg); }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes chipFadeIn {
      from { opacity: 0; transform: translateY(10px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .add-btn-pulse {
      animation: addPulse 2s ease-in-out infinite !important;
    }

    .sprout-anim {
      animation: sproutGrow 1s ease-out 0.3s both !important;
    }

    .leaf-sway {
      animation: leafSway 3s ease-in-out infinite !important;
    }

    .fade-in-up {
      animation: fadeInUp 0.7s ease-out 0.6s both !important;
    }

    .chip-1 { animation: chipFadeIn 0.5s ease-out 1.0s both !important; }
    .chip-2 { animation: chipFadeIn 0.5s ease-out 1.15s both !important; }
    .chip-3 { animation: chipFadeIn 0.5s ease-out 1.3s both !important; }

    .chip-hover:hover {
      border-color: #059669 !important;
      background: #F0EDEA !important;
      cursor: pointer !important;
    }

    .chip-hover {
      transition: all 0.2s ease !important;
    }
  </style>
</head>
<body>
  <!-- PAGE WRAPPER -->
  <div style="display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a1a;padding:20px;">
    <!-- PHONE FRAME -->
    <div style="width:375px;height:812px;border-radius:40px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,0.5);position:relative;background:#F5F1ED;">

      <!-- STATUS BAR -->
      <div style="height:54px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 24px 8px;background:#F5F1ED;">
        <span style="font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;color:#2D2A26;">9:41</span>
        <div style="display:flex;gap:6px;align-items:center;">
          <i data-lucide="signal" style="width:16px;height:16px;color:#2D2A26;"></i>
          <i data-lucide="wifi" style="width:16px;height:16px;color:#2D2A26;"></i>
          <i data-lucide="battery-full" style="width:16px;height:16px;color:#2D2A26;"></i>
        </div>
      </div>

      <!-- HEADER -->
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 24px 4px;">
        <h1 class="font-literata" style="font-size:22px !important;font-weight:700 !important;color:#2D2A26 !important;line-height:1.2 !important;">Today</h1>
        <i data-lucide="settings" style="width:22px;height:22px;color:#6B6560;cursor:pointer;"></i>
      </div>
      <div style="padding:0 24px 16px;">
        <span class="font-dm" style="font-size:14px !important;color:#6B6560 !important;">Tuesday, April 1</span>
      </div>

      <!-- MAIN CONTENT AREA -->
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px;height:calc(100% - 54px - 48px - 30px - 80px);overflow:hidden;">

        <!-- SEEDLING ILLUSTRATION -->
        <div class="sprout-anim" style="margin-bottom:28px !important;">
          <svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
            <!-- Surface line -->
            <line x1="20" y1="78" x2="100" y2="78" stroke="#DDD8D2" stroke-width="1.5" stroke-linecap="round"/>

            <!-- Pot -->
            <path d="M38 78 L42 102 L78 102 L82 78 Z" fill="#C4BFB7" stroke="#A89F96" stroke-width="1.5"/>
            <!-- Pot rim -->
            <rect x="34" y="74" width="52" height="6" rx="2" fill="#A89F96"/>
            <!-- Pot soil -->
            <ellipse cx="60" cy="80" rx="20" ry="3" fill="#A89F96" opacity="0.4"/>

            <!-- Stem -->
            <g class="leaf-sway" style="transform-origin: 60px 78px;">
              <path d="M60 78 L60 42" stroke="#047857" stroke-width="2.5" stroke-linecap="round"/>

              <!-- Left leaf -->
              <path d="M60 55 C50 48, 40 50, 38 42 C36 34, 48 32, 60 55" fill="#059669" opacity="0.9"/>
              <path d="M60 55 C50 48, 42 46, 40 40" stroke="#047857" stroke-width="1" fill="none" opacity="0.5"/>

              <!-- Right leaf -->
              <path d="M60 46 C70 39, 80 41, 82 33 C84 25, 72 23, 60 46" fill="#10B981" opacity="0.85"/>
              <path d="M60 46 C70 39, 78 37, 80 31" stroke="#047857" stroke-width="1" fill="none" opacity="0.5"/>

              <!-- Tiny top leaf (sprouting) -->
              <path d="M60 42 C56 36, 54 32, 56 28 C58 24, 60 30, 60 42" fill="#059669" opacity="0.7"/>
            </g>
          </svg>
        </div>

        <!-- TEXT -->
        <div class="fade-in-up" style="text-align:center;margin-bottom:28px !important;">
          <h2 class="font-literata" style="font-size:20px !important;font-weight:700 !important;color:#2D2A26 !important;margin-bottom:10px !important;line-height:1.3 !important;">Your habit journey starts here</h2>
          <p class="font-dm" style="font-size:15px !important;color:#6B6560 !important;max-width:280px;margin:0 auto !important;line-height:1.5 !important;">Start with one small habit. Consistency beats perfection.</p>
        </div>

        <!-- QUICK START CHIPS -->
        <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:16px !important;">
          <div class="chip-1 chip-hover" style="display:flex;align-items:center;gap:8px;background:#EDEAE5;border:1.5px solid #DDD8D2;border-radius:9999px;padding:10px 18px !important;">
            <span style="font-size:16px;">&#9728;&#65039;</span>
            <span class="font-dm" style="font-size:14px !important;color:#2D2A26 !important;font-weight:500 !important;">Morning Routine</span>
          </div>
          <div class="chip-2 chip-hover" style="display:flex;align-items:center;gap:8px;background:#EDEAE5;border:1.5px solid #DDD8D2;border-radius:9999px;padding:10px 18px !important;">
            <span style="font-size:16px;">&#127939;</span>
            <span class="font-dm" style="font-size:14px !important;color:#2D2A26 !important;font-weight:500 !important;">Daily Exercise</span>
          </div>
          <div class="chip-3 chip-hover" style="display:flex;align-items:center;gap:8px;background:#EDEAE5;border:1.5px solid #DDD8D2;border-radius:9999px;padding:10px 18px !important;">
            <span style="font-size:16px;">&#128214;</span>
            <span class="font-dm" style="font-size:14px !important;color:#2D2A26 !important;font-weight:500 !important;">Read 10 Pages</span>
          </div>
        </div>

        <!-- HELPER TEXT -->
        <div class="fade-in-up" style="display:flex;align-items:center;gap:4px;animation-delay:1.5s !important;">
          <span class="font-dm" style="font-size:13px !important;color:#C4BFB7 !important;">Tap a suggestion or create your own</span>
          <i data-lucide="chevron-down" style="width:14px;height:14px;color:#C4BFB7;"></i>
        </div>
      </div>

      <!-- BOTTOM ACTION BAR -->
      <div style="position:absolute;bottom:0;left:0;right:0;height:80px;background:#EDEAE5;border-top:1px solid #DDD8D2;display:flex;align-items:center;justify-content:center;padding:0 24px !important;">
        <!-- Archive -->
        <div style="position:absolute;left:40px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
          <i data-lucide="archive" style="width:20px;height:20px;color:#6B6560;"></i>
          <span class="font-dm" style="font-size:11px !important;color:#6B6560 !important;">Archive</span>
        </div>

        <!-- Add Button -->
        <div class="add-btn-pulse" style="width:56px;height:56px;border-radius:50%;background:#059669;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-bottom:8px !important;">
          <i data-lucide="plus" style="width:28px;height:28px;color:#FFFFFF;stroke-width:2.5;"></i>
        </div>

        <!-- Settings -->
        <div style="position:absolute;right:40px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;">
          <i data-lucide="settings" style="width:20px;height:20px;color:#6B6560;"></i>
          <span class="font-dm" style="font-size:11px !important;color:#6B6560 !important;">Settings</span>
        </div>
      </div>

    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
