<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BEFORE — Template Preview Modal (Habit Detail)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif !important}</style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100">
  <main class="mx-auto max-w-md px-0 pb-8 pt-6" data-component="TemplatePreviewModal">
    <!-- Backdrop strip to evoke modal-over-screen -->
    <div class="mx-2 rounded-t-3xl bg-slate-900 shadow-2xl">
      <div class="flex justify-center pb-1 pt-2"><div class="h-1.5 w-9 rounded-full bg-slate-600" data-component="DragHandle"></div></div>

      <!-- ImportHeader: Cancel | "Add this habit" pill -->
      <div class="flex items-center justify-between px-4 pb-3 pt-2" data-component="ImportHeader">
        <button class="rounded-full px-3 py-1 text-sm font-medium text-slate-300">Cancel</button>
        <button class="rounded-full bg-emerald-500 px-5 py-2 text-sm font-bold text-emerald-950">Add this habit</button>
      </div>

      <div class="space-y-6 px-5 pb-8">
        <!-- TemplatePreview: big icon tile + description -->
        <section class="flex flex-col items-center text-center" data-component="TemplatePreview">
          <div class="grid h-20 w-20 place-items-center rounded-2xl bg-sky-500/20 text-4xl">💧</div>
          <p class="mt-3 text-sm text-slate-400">Stay hydrated through the day. Helps energy, focus, recovery.</p>
        </section>

        <!-- Editable name input (large, centered) -->
        <section data-component="NameInput">
          <input
            value="Drink Water"
            class="w-full rounded-2xl border-2 border-slate-700 bg-slate-800 px-5 py-4 text-center text-2xl font-medium text-white"
          />
        </section>

        <!-- EmojiPicker: "Choose an icon" -->
        <section data-component="EmojiPicker">
          <p class="mb-2 text-center text-[10px] font-semibold uppercase tracking-[0.1em] text-slate-500">Choose an icon</p>
          <div class="flex flex-wrap justify-center gap-2">
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-emerald-400 bg-emerald-500/15 text-xl">💧</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🥤</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">☕</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🍵</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🧊</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🌊</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🚰</span>
            <span class="grid h-10 w-10 place-items-center rounded-xl border border-slate-700 bg-slate-800 text-xl">🔆</span>
          </div>
        </section>

        <!-- ColorPickerSection: "Pick a color" -->
        <section data-component="ColorPickerSection">
          <p class="mb-2 text-center text-[10px] font-semibold uppercase tracking-[0.1em] text-slate-500">Pick a color</p>
          <div class="flex justify-center gap-2">
            <span class="h-8 w-8 rounded-full border-2 border-white/80 bg-sky-400"></span>
            <span class="h-8 w-8 rounded-full bg-emerald-400"></span>
            <span class="h-8 w-8 rounded-full bg-amber-400"></span>
            <span class="h-8 w-8 rounded-full bg-rose-400"></span>
            <span class="h-8 w-8 rounded-full bg-violet-400"></span>
            <span class="h-8 w-8 rounded-full bg-fuchsia-400"></span>
            <span class="h-8 w-8 rounded-full bg-teal-400"></span>
          </div>
        </section>

        <!-- EnhancedReminderSelector -->
        <section class="rounded-2xl border border-slate-700 bg-slate-800/60 p-4" data-component="EnhancedReminderSelector">
          <div class="flex items-center justify-between">
            <div>
              <p class="text-sm font-semibold">Daily reminder</p>
              <p class="text-[11px] text-slate-400">Get a nudge so you don't forget</p>
            </div>
            <div class="h-6 w-11 rounded-full bg-emerald-500 p-0.5"><div class="ml-auto h-5 w-5 rounded-full bg-white"></div></div>
          </div>
          <div class="mt-3 rounded-lg border border-slate-700 bg-slate-900 px-3 py-2 text-sm">⏰ 9:00 AM</div>
        </section>

        <!-- AdvancedOptionsSection -->
        <section class="rounded-2xl border border-slate-700 bg-slate-800/60 p-4" data-component="AdvancedOptionsSection">
          <div class="flex items-center justify-between">
            <p class="text-sm font-semibold">Advanced options</p>
            <span class="text-slate-400">▾</span>
          </div>
          <div class="mt-3 space-y-2 text-xs text-slate-400">
            <p>Strength algorithm · Progress emojis · Streak goal</p>
          </div>
        </section>

        <!-- TemplateInfo: meta footer -->
        <section class="rounded-xl border border-slate-700 bg-slate-900 px-4 py-3 text-[11px] text-slate-400" data-component="TemplateInfo">
          <p>Category: Health & Fitness · Frequency: daily</p>
        </section>
      </div>
    </div>

    <!--
      NOTE: No "Promise" / "Why this works" / "How you'll do it" / "Who you'll become" /
      Pairings sections exist in the current preview. Sheet opens directly on customization
      (icon, color, reminder, advanced options) rather than on a confidence narrative.
    -->
  </main>
</body>
</html>
