<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Variation B — Stacked Settings Rows</title>
<link rel="stylesheet" href="advanced_options_theme.css" />
<style>
  body { display: flex; gap: 28px; padding: 40px; flex-wrap: wrap; justify-content: center; }
  .col { display: flex; flex-direction: column; align-items: center; }
  .stacked-rows { display: flex; flex-direction: column; gap: 10px; }
  /* Sheet overlay */
  .sheet-overlay {
    position: absolute; left: 0; right: 0; bottom: 0; top: 40%;
    background: var(--surface);
    border-top-left-radius: 24px; border-top-right-radius: 24px;
    padding: 18px 20px 24px 20px;
    box-shadow: 0 -18px 40px rgba(0,0,0,0.5);
    border-top: 1px solid var(--border);
  }
  .sheet-overlay .sheet-drag { width:36px;height:4px;border-radius:2px;background:#3a3a42;margin:0 auto 14px auto;}
  .sheet-title { font-size: 17px; font-weight: 700; margin: 0 0 4px 0; }
  .sheet-sub { font-size: 12.5px; color: var(--text-tertiary); margin: 0 0 14px 0; }
</style>
</head>
<body>

<script>
  function phone({ sheet }) {
    const sheetHtml = (kind) => {
      if (!kind) return '';
      if (kind === 'algo') {
        return `
          <div class="sheet-overlay">
            <div class="sheet-drag"></div>
            <div class="sheet-title">Strength Algorithm</div>
            <div class="sheet-sub">How this habit's strength is calculated.</div>
            <div class="algo-card">
              <div class="algo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div>
              <div class="algo-body">
                <div class="algo-title-row"><div class="algo-title">Forgiving</div><span class="algo-tag">Simple · 18d</span></div>
                <div class="algo-desc">Forms fast and missing a day barely matters.</div>
              </div>
            </div>
            <div class="algo-card selected">
              <div class="algo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
              <div class="algo-body">
                <div class="algo-title-row"><div class="algo-title">Balanced</div><span class="algo-tag">Moderate · 66d</span></div>
                <div class="algo-desc">UCL 66-day curve — noticeable dip on miss, recovers quickly.</div>
              </div>
            </div>
            <div class="algo-card">
              <div class="algo-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></div>
              <div class="algo-body">
                <div class="algo-title-row"><div class="algo-title">Strict</div><span class="algo-tag">Complex · 120d</span></div>
                <div class="algo-desc">Takes longer to build — tight accountability keeps you showing up.</div>
              </div>
            </div>
          </div>
        `;
      }
      if (kind === 'emoji') {
        return `
          <div class="sheet-overlay">
            <div class="sheet-drag"></div>
            <div class="sheet-title">Growth Icons</div>
            <div class="sheet-sub">The emoji shown as this habit grows stronger.</div>
            <div class="preset-row">
              <button class="preset-chip active"><span class="emojis">🌱🌿🌳💪⚡</span> Plants</button>
              <button class="preset-chip"><span class="emojis">💧🏃🏋️💪🏆</span> Fitness</button>
              <button class="preset-chip"><span class="emojis">🌑🌓🌕🪐🌌</span> Space</button>
              <button class="preset-chip"><span class="emojis">💭📖🎓🧠✨</span> Mind</button>
              <button class="preset-chip"><span class="emojis">🪵🔥🌋⚡👑</span> Fire</button>
            </div>
            <div class="stage-row"><div class="stage-emoji">🌱</div><div class="stage-meta"><div class="stage-label">Starting</div></div><div class="stage-change">Change</div></div>
            <div class="stage-row"><div class="stage-emoji">🌿</div><div class="stage-meta"><div class="stage-label">Building</div></div><div class="stage-change">Change</div></div>
            <div class="stage-row"><div class="stage-emoji">🌳</div><div class="stage-meta"><div class="stage-label">Developing</div></div><div class="stage-change">Change</div></div>
            <div class="stage-row"><div class="stage-emoji">💪</div><div class="stage-meta"><div class="stage-label">Strong</div></div><div class="stage-change">Change</div></div>
            <div class="stage-row"><div class="stage-emoji">⚡</div><div class="stage-meta"><div class="stage-label">Automatic</div></div><div class="stage-change">Change</div></div>
          </div>
        `;
      }
    };

    return `
      <div class="phone" style="position:relative;">
        <div class="drag-handle"></div>
        <div class="content">

          <div class="section-label"><span class="line"></span><span class="text">Streak Goal</span><span class="line"></span></div>
          <div class="card streak-card">
            <div class="streak-label">Target days</div>
            <div class="streak-pills">
              <button class="streak-pill">Off</button>
              <button class="streak-pill">7</button>
              <button class="streak-pill">21</button>
              <button class="streak-pill active">30</button>
              <button class="streak-pill">66</button>
              <button class="streak-pill">100</button>
              <button class="streak-pill">365</button>
            </div>
          </div>

          <div class="section-label"><span class="line"></span><span class="text">Advanced</span><span class="line"></span></div>
          <div class="stacked-rows">
            <div class="card row" data-open-sheet="algo">
              <div class="icon-tile">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              </div>
              <div style="flex:1;min-width:0;">
                <div class="row-title">Strength Algorithm</div>
                <div class="row-subtitle">Balanced · 66-day formation curve</div>
              </div>
              <span class="chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </span>
            </div>
            <div class="card row" data-open-sheet="emoji">
              <div class="icon-tile" style="background:rgba(255,191,0,0.14);color:#f5b638;">
                <span style="font-size:18px;">🌱</span>
              </div>
              <div style="flex:1;min-width:0;">
                <div class="row-title">Growth Icons</div>
                <div class="row-subtitle">Plants · 🌱 🌿 🌳 💪 ⚡</div>
              </div>
              <span class="chevron">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
              </span>
            </div>
          </div>

          <div class="section-label danger"><span class="line"></span><span class="text">Danger Zone</span><span class="line"></span></div>
          <div class="danger-card">
            <div class="danger-row">📦 Archive habit</div>
            <div class="danger-row">🗑️ Delete habit</div>
          </div>
        </div>

        ${sheetHtml(sheet)}
      </div>
    `;
  }

  document.body.innerHTML = `
    <div class="col">
      <div class="state-label">Default (rows show current values)</div>
      ${phone({ sheet: null })}
    </div>
    <div class="col">
      <div class="state-label">Algorithm row tapped → sheet</div>
      ${phone({ sheet: 'algo' })}
    </div>
    <div class="col">
      <div class="state-label">Growth Icons row tapped → sheet</div>
      ${phone({ sheet: 'emoji' })}
    </div>
  `;
</script>

</body>
</html>
