<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Add Screen - V8-C (Card-Based)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    .paper-bg { background: #faf9f7; }
    .color-swatch { transition: all 0.15s ease-out; }
    .color-swatch.selected { box-shadow: 0 0 0 2.5px #1a1a1a; transform: scale(1.12); }
    .pressable { transition: transform 0.1s ease-out; }
    .pressable:active { transform: scale(0.96); }
    input:focus { outline: none; }
    .emoji-chip { transition: all 0.15s ease-out; }
    .emoji-chip.selected { box-shadow: 0 0 0 2px #10B981; background: #ECFDF5; }
    .card { background: white; border-radius: 16px; border: 1px solid #e7e5e4; }
    .option-btn { transition: all 0.15s ease; }
    .option-btn.selected { background: #ECFDF5; border-color: #10B981; }
    ::-webkit-scrollbar { width: 0px; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-end justify-center p-4">
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative modal-bg">
      <div class="absolute bottom-0 left-0 right-0 h-[88%] paper-bg rounded-t-3xl flex flex-col shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4">
          <button class="w-9 h-9 flex items-center justify-center rounded-full bg-stone-200/60 pressable">
            <i data-lucide="x" class="w-5 h-5 text-stone-500"></i>
          </button>
          <h1 class="text-lg font-semibold text-[#1F2937]">New Habit</h1>
          <button class="text-sm text-[#10B981] font-medium pressable">Templates</button>
        </div>

        <div class="flex-1 overflow-y-auto px-5 pb-6">

          <!-- Card 1: Name & Icon -->
          <div class="card p-4 mb-3">
            <div class="flex gap-4">
              <button class="w-16 h-16 rounded-2xl flex items-center justify-center pressable border-2 border-[#10B981]" style="background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);">
                <span class="text-3xl">📖</span>
              </button>
              <div class="flex-1">
                <label class="text-xs font-medium text-[#78716c] mb-1 block">HABIT NAME</label>
                <input type="text" value="Read for 20 minutes" class="w-full text-lg font-semibold text-[#1F2937] placeholder-[#9CA3AF] bg-transparent" placeholder="What will you do?"/>
              </div>
            </div>
            <!-- Emoji suggestions -->
            <div class="flex gap-2 mt-3 pt-3 border-t border-stone-100">
              <span class="text-xs text-[#78716c] mr-1">Suggestions:</span>
              <button class="emoji-chip w-8 h-8 rounded-lg bg-stone-50 flex items-center justify-center selected"><span class="text-base">📖</span></button>
              <button class="emoji-chip w-8 h-8 rounded-lg bg-stone-50 flex items-center justify-center"><span class="text-base">📚</span></button>
              <button class="emoji-chip w-8 h-8 rounded-lg bg-stone-50 flex items-center justify-center"><span class="text-base">📰</span></button>
              <button class="emoji-chip w-8 h-8 rounded-lg bg-stone-50 flex items-center justify-center"><span class="text-base">✍️</span></button>
              <button class="w-8 h-8 rounded-lg bg-stone-50 flex items-center justify-center pressable">
                <i data-lucide="plus" class="w-3 h-3 text-[#78716c]"></i>
              </button>
            </div>
          </div>

          <!-- Card 2: Color -->
          <div class="card p-4 mb-3">
            <label class="text-xs font-medium text-[#78716c] mb-3 block">COLOR</label>
            <div class="flex justify-between">
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #EF4444;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #F97316;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #FBBF24;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable selected" style="background: #10B981;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #14B8A6;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #3B82F6;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #8B5CF6;"></button>
              <button class="color-swatch w-9 h-9 rounded-full pressable" style="background: #EC4899;"></button>
            </div>
          </div>

          <!-- Card 3: Reminder -->
          <div class="card p-4 mb-3">
            <div class="flex items-center justify-between mb-3">
              <label class="text-xs font-medium text-[#78716c]">REMINDER</label>
              <button class="w-10 h-6 rounded-full bg-[#10B981] p-0.5 pressable">
                <div class="w-5 h-5 rounded-full bg-white shadow-sm transform translate-x-4"></div>
              </button>
            </div>
            <div class="grid grid-cols-3 gap-2">
              <button class="option-btn py-3 rounded-xl bg-stone-50 border border-stone-200 pressable flex flex-col items-center selected border-2">
                <span class="text-lg">🌅</span>
                <span class="text-xs font-semibold text-[#047857] mt-1">Morning</span>
                <span class="text-[10px] text-[#10B981]">7:00 AM</span>
              </button>
              <button class="option-btn py-3 rounded-xl bg-stone-50 border border-stone-200 pressable flex flex-col items-center">
                <span class="text-lg">☀️</span>
                <span class="text-xs font-medium text-[#78716c] mt-1">Midday</span>
                <span class="text-[10px] text-[#9CA3AF]">12:00 PM</span>
              </button>
              <button class="option-btn py-3 rounded-xl bg-stone-50 border border-stone-200 pressable flex flex-col items-center">
                <span class="text-lg">🌙</span>
                <span class="text-xs font-medium text-[#78716c] mt-1">Evening</span>
                <span class="text-[10px] text-[#9CA3AF]">8:00 PM</span>
              </button>
            </div>
          </div>

          <!-- Motivation -->
          <div class="text-center py-3">
            <p class="text-xs text-[#78716c]">✨ Small steps lead to big changes</p>
          </div>

          <div class="h-20"></div>
        </div>

        <!-- Sticky CTA -->
        <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent pt-8">
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-base font-semibold text-white">Create Habit</span>
          </button>
          <div class="flex justify-center mt-3"><div class="w-32 h-1 rounded-full bg-stone-300"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
