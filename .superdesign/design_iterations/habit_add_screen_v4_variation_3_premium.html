<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>V4 Variation 3: Premium & Spacious</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif;
    }
    .pressable:active {
      transform: scale(0.98);
    }
    .gradient-bg {
      background: linear-gradient(180deg, #FAFAFA 0%, #FFFFFF 100%);
    }
    .preview-gradient {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
    }
    .emoji-chip {
      transition: all 0.2s ease;
    }
    .emoji-chip:hover {
      transform: translateY(-2px);
    }
    .emoji-chip.selected {
      background: linear-gradient(135deg, #ECFDF5 0%, #D1FAE5 100%);
      border-color: #10B981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    .color-swatch {
      transition: all 0.2s ease;
      position: relative;
    }
    .color-swatch:hover {
      transform: scale(1.1);
    }
    .color-swatch.selected::before {
      content: '✓';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-shadow: 0 1px 2px rgba(0,0,0,0.2);
    }
    .section-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, #E5E7EB 50%, transparent 100%);
    }
  </style>
</head>
<body class="bg-stone-900 min-h-screen flex items-end justify-center p-4">

  <!-- Phone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">

    <!-- Screen -->
    <div class="w-full h-full rounded-[40px] overflow-hidden relative gradient-bg">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[92%] gradient-bg rounded-t-3xl flex flex-col">

        <!-- Premium Header -->
        <div class="px-6 py-5 border-b border-stone-100">
          <div class="flex items-center justify-between mb-2">
            <button class="pressable" aria-label="Close">
              <i data-lucide="x" class="w-5 h-5 text-stone-400"></i>
            </button>
            <div class="w-5"></div>
          </div>
          <h1 class="text-2xl font-bold text-stone-900">Create New Habit</h1>
          <p class="text-sm text-stone-500 mt-1">Design your perfect routine</p>
        </div>

        <!-- Scrollable Content -->
        <div class="flex-1 overflow-y-auto px-6 pb-6">

          <!-- Premium Live Preview -->
          <div class="mt-6 mb-8 p-5 rounded-3xl preview-gradient">
            <div class="flex items-center gap-4">
              <div class="w-20 h-20 rounded-2xl bg-white/20 backdrop-blur-sm flex items-center justify-center border border-white/30">
                <span class="text-4xl">📖</span>
              </div>
              <div class="flex-1">
                <p class="text-2xl font-bold text-white">Read daily</p>
                <div class="flex items-center gap-2 mt-2">
                  <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/20 backdrop-blur-sm border border-white/30">
                    <span class="text-xs font-semibold text-white">Daily</span>
                  </div>
                  <div class="flex items-center gap-1 px-2.5 py-1 rounded-full bg-white/20 backdrop-blur-sm border border-white/30">
                    <span class="text-xs font-semibold text-white">☀️ Afternoon</span>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Habit Name - Large -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">Habit Name</label>
            <input
              type="text"
              value="Read daily"
              class="w-full text-2xl font-bold text-stone-900 placeholder-stone-300 bg-white rounded-2xl px-5 py-4 border-2 border-stone-200 focus:border-emerald-500 outline-none transition-colors"
              placeholder="What do you want to achieve?"
            />
          </div>

          <div class="section-divider mb-8"></div>

          <!-- Emoji Selection - Spacious -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">Choose an Icon</label>
            <div class="flex gap-3">
              <button class="emoji-chip w-14 h-14 rounded-2xl bg-white border-2 border-stone-200 flex items-center justify-center pressable selected shadow-sm">
                <span class="text-3xl">📖</span>
              </button>
              <button class="emoji-chip w-14 h-14 rounded-2xl bg-white border-2 border-stone-200 flex items-center justify-center pressable shadow-sm">
                <span class="text-3xl">📚</span>
              </button>
              <button class="emoji-chip w-14 h-14 rounded-2xl bg-white border-2 border-stone-200 flex items-center justify-center pressable shadow-sm">
                <span class="text-3xl">✍️</span>
              </button>
              <button class="emoji-chip w-14 h-14 rounded-2xl bg-white border-2 border-stone-200 flex items-center justify-center pressable shadow-sm">
                <span class="text-3xl">🎯</span>
              </button>
              <button class="emoji-chip w-14 h-14 rounded-2xl bg-white border-2 border-stone-200 flex items-center justify-center pressable shadow-sm">
                <span class="text-3xl">✨</span>
              </button>
            </div>
          </div>

          <!-- Color Picker - Large Swatches -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">Pick a Color</label>
            <div class="flex gap-3">
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable shadow-md" style="background: #EF4444;"></button>
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable shadow-md" style="background: #F97316;"></button>
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable shadow-md" style="background: #FBBF24;"></button>
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable selected shadow-md" style="background: #10B981;"></button>
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable shadow-md" style="background: #3B82F6;"></button>
              <button class="relative color-swatch w-12 h-12 rounded-2xl pressable shadow-md" style="background: #8B5CF6;"></button>
            </div>
          </div>

          <div class="section-divider mb-8"></div>

          <!-- Time of Day - Premium Buttons -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">Best Time for This Habit</label>
            <div class="grid grid-cols-3 gap-3">
              <button class="py-4 rounded-2xl bg-white border-2 border-stone-200 pressable shadow-sm">
                <div class="text-2xl mb-1">🌅</div>
                <div class="text-sm font-semibold text-stone-600">Morning</div>
              </button>
              <button class="py-4 rounded-2xl bg-emerald-50 border-2 border-emerald-500 pressable shadow-sm">
                <div class="text-2xl mb-1">☀️</div>
                <div class="text-sm font-bold text-emerald-700">Afternoon</div>
              </button>
              <button class="py-4 rounded-2xl bg-white border-2 border-stone-200 pressable shadow-sm">
                <div class="text-2xl mb-1">🌙</div>
                <div class="text-sm font-semibold text-stone-600">Evening</div>
              </button>
            </div>
          </div>

          <!-- Reminder - Premium Card -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">Set a Reminder</label>
            <div class="flex items-center justify-between p-5 rounded-2xl bg-white border-2 border-amber-200 shadow-sm">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full bg-gradient-to-br from-amber-400 to-amber-500 flex items-center justify-center shadow-md">
                  <i data-lucide="bell" class="w-5 h-5 text-white"></i>
                </div>
                <div>
                  <p class="text-base font-semibold text-stone-900">Daily Reminder</p>
                  <p class="text-sm text-amber-600 font-medium">12:00 PM</p>
                </div>
              </div>
              <button class="w-14 h-8 rounded-full bg-emerald-500 p-1 pressable relative shadow-md">
                <div class="w-6 h-6 rounded-full bg-white shadow-sm absolute right-1 top-1"></div>
              </button>
            </div>
          </div>

          <!-- Frequency - Premium -->
          <div class="mb-8">
            <label class="block text-sm font-semibold text-stone-700 mb-3">How Often?</label>
            <div class="flex gap-2">
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">S</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">M</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">T</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">W</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">T</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">F</button>
              <button class="w-11 h-11 rounded-2xl bg-emerald-500 text-white text-sm font-bold pressable shadow-md">S</button>
            </div>
            <p class="text-sm text-stone-500 mt-3">Every day of the week</p>
          </div>

          <div class="h-24"></div>
        </div>

        <!-- Premium Sticky Button -->
        <div class="p-6 bg-white/80 backdrop-blur-xl border-t border-stone-100">
          <button class="w-full h-16 rounded-2xl bg-gradient-to-r from-emerald-500 to-emerald-600 text-white font-bold text-lg pressable shadow-xl flex items-center justify-center gap-2">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
            Create My Habit
          </button>
          <div class="flex justify-center mt-4">
            <div class="w-32 h-1.5 rounded-full bg-stone-300"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>

</body>
</html>
