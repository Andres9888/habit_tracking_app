<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Archived Habits - Empty State</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Inter', sans-serif !important;
    }
    body {
      background: #1e293b !important;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      background: #ffffff;
      border-radius: 40px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    .status-bar {
      height: 47px;
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 24px;
    }
    .float-animation {
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    .sparkle {
      animation: sparkle 2s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <!-- Status Bar -->
    <div class="status-bar">
      <span class="text-sm font-semibold text-slate-900">9:41</span>
      <div class="flex gap-1">
        <span class="text-xs">📶</span>
        <span class="text-xs">🔋</span>
      </div>
    </div>

    <!-- Header -->
    <div class="bg-white px-5 py-4 flex items-center justify-between border-b border-slate-100">
      <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
        <span class="text-lg text-slate-600">←</span>
      </button>
      <h1 class="text-xl font-bold text-slate-900">Archived Habits</h1>
      <button class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center hover:bg-slate-200 transition-colors">
        <span class="text-lg text-slate-500">✕</span>
      </button>
    </div>

    <!-- Empty State Content -->
    <div class="flex flex-col items-center justify-center px-8" style="height: calc(100% - 120px);">

      <!-- Illustration -->
      <div class="relative mb-8">
        <!-- Main Box -->
        <div class="float-animation">
          <div class="w-32 h-28 bg-gradient-to-br from-slate-100 to-slate-200 rounded-2xl flex items-center justify-center shadow-lg relative">
            <!-- Box flaps -->
            <div class="absolute -top-3 left-2 right-2 h-6 bg-gradient-to-b from-slate-200 to-slate-100 rounded-t-lg transform -skew-x-3"></div>
            <div class="absolute -top-3 left-2 right-2 h-6 bg-gradient-to-b from-slate-300 to-slate-200 rounded-t-lg transform skew-x-3 opacity-70"></div>

            <!-- Sparkles around box -->
            <div class="absolute -top-6 -right-4 text-2xl sparkle" style="animation-delay: 0s;">✨</div>
            <div class="absolute -bottom-2 -left-6 text-xl sparkle" style="animation-delay: 0.7s;">✨</div>
            <div class="absolute top-4 -right-8 text-lg sparkle" style="animation-delay: 1.4s;">⭐</div>

            <!-- Box icon -->
            <span class="text-5xl mt-2">📦</span>
          </div>
        </div>

        <!-- Small habits floating away -->
        <div class="absolute -top-12 left-0 text-2xl opacity-40" style="animation: float 4s ease-in-out infinite; animation-delay: 0.5s;">🧘</div>
        <div class="absolute -top-8 right-0 text-xl opacity-30" style="animation: float 3.5s ease-in-out infinite; animation-delay: 1s;">📚</div>
      </div>

      <!-- Text Content -->
      <h2 class="text-2xl font-bold text-slate-900 mb-3 text-center">
        All Clear!
      </h2>
      <p class="text-base text-slate-500 text-center mb-2 max-w-xs">
        No archived habits here.
      </p>
      <p class="text-sm text-slate-400 text-center max-w-xs mb-8">
        When you swipe left to archive a habit, it'll appear here for safekeeping.
      </p>

      <!-- Helpful Tip Card -->
      <div class="bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl p-4 w-full max-w-xs border border-blue-100">
        <div class="flex items-start gap-3">
          <div class="text-2xl">💡</div>
          <div>
            <p class="text-sm font-medium text-slate-700 mb-1">Pro Tip</p>
            <p class="text-xs text-slate-500 leading-relaxed">
              Archive habits you want to pause without losing your progress. You can restore them anytime!
            </p>
          </div>
        </div>
      </div>

      <!-- Back Button -->
      <button class="mt-8 px-6 py-3 bg-slate-900 text-white font-semibold rounded-xl hover:bg-slate-800 transition-colors flex items-center gap-2">
        <span>←</span>
        <span>Back to Settings</span>
      </button>

    </div>
  </div>
</body>
</html>
