<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Empty Habits - Minimal Design v1</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #faf9f7 !important;
      min-height: 100vh;
      margin: 0 !important;
      padding: 0 !important;
    }

    /* Gentle breathing animation for seedling */
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes fade-in-up {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .animate-breathe {
      animation: breathe 3s ease-in-out infinite;
    }

    .animate-fade-in-up {
      animation: fade-in-up 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .delay-100 { animation-delay: 0.1s; opacity: 0; }
    .delay-200 { animation-delay: 0.2s; opacity: 0; }
    .delay-300 { animation-delay: 0.3s; opacity: 0; }
    .delay-400 { animation-delay: 0.4s; opacity: 0; }

    /* Input field */
    .habit-input {
      transition: all 0.2s ease;
      caret-color: #10b981;
    }

    .habit-input:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    .habit-input::placeholder {
      color: #a8a29e;
    }

    /* Suggestion chips */
    .chip {
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
    }

    .chip:hover {
      transform: translateY(-2px) scale(1.05);
      box-shadow: 0 6px 20px -4px rgba(0, 0, 0, 0.15);
    }

    .chip:active {
      transform: scale(0.95);
    }

    .chip.selected {
      background-color: #10b981 !important;
      border-color: #10b981 !important;
      color: white !important;
    }

    .chip.selected span {
      filter: grayscale(0) !important;
    }

    /* CTA Button */
    .cta-btn {
      transition: all 0.2s ease;
      opacity: 0.4;
      pointer-events: none;
    }

    .cta-btn.active {
      opacity: 1;
      pointer-events: auto;
    }

    .cta-btn.active:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.4);
    }

    .cta-btn.active:active {
      transform: scale(0.98);
    }

    /* Secondary link */
    .secondary-link {
      transition: all 0.2s ease;
    }

    .secondary-link:hover {
      color: #78716c;
    }

    /* Phone frame */
    .phone-frame {
      width: 390px;
      height: 844px;
      background: #faf9f7;
      border-radius: 44px;
      box-shadow:
        0 50px 100px -20px rgba(0, 0, 0, 0.25),
        0 30px 60px -30px rgba(0, 0, 0, 0.3),
        inset 0 0 0 12px #1c1917;
      overflow: hidden;
      position: relative;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 32px;
      background: #1c1917;
      border-radius: 20px;
      z-index: 100;
    }

    /* Content container */
    .content-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 56px 32px 32px;
    }

    /* Success state */
    @keyframes success-pop {
      0% { transform: scale(0.8); opacity: 0; }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .success-icon {
      animation: success-pop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes confetti {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100px) rotate(720deg); opacity: 0; }
    }

    .confetti {
      position: absolute;
      animation: confetti 1s ease-out forwards;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-8" style="background: linear-gradient(135deg, #1c1917 0%, #292524 100%);">

  <!-- Phone Frame -->
  <div class="phone-frame">
    <div class="content-container" id="mainContent">

      <!-- Seedling Icon -->
      <div class="animate-fade-in-up flex justify-center mb-8">
        <div class="animate-breathe">
          <div class="w-20 h-20 rounded-3xl bg-gradient-to-br from-emerald-100 to-green-50 flex items-center justify-center shadow-lg" style="box-shadow: 0 8px 24px -4px rgba(16, 185, 129, 0.15);">
            <span class="text-4xl">🌱</span>
          </div>
        </div>
      </div>

      <!-- Question -->
      <div class="animate-fade-in-up delay-100 text-center mb-8">
        <h1 class="text-2xl font-bold text-stone-800 mb-2 tracking-tight leading-tight">
          What's one small thing<br/>you want to do daily?
        </h1>
      </div>

      <!-- Input Field -->
      <div class="animate-fade-in-up delay-200 mb-6">
        <input
          type="text"
          id="habitInput"
          class="habit-input w-full px-5 py-4 text-base font-medium text-stone-800 bg-white border-2 border-stone-200 rounded-2xl"
          placeholder="Type your habit..."
          autocomplete="off"
        />
      </div>

      <!-- Suggestion Chips - 3-2-1 Pyramid -->
      <div class="animate-fade-in-up delay-300 flex flex-col items-center gap-2 mb-8">
        <!-- Row 1: 3 chips -->
        <div class="flex justify-center gap-2">
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Drink water">
            <span class="text-lg">💧</span>
            Water
          </button>
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Walk 5 minutes">
            <span class="text-lg">🚶</span>
            Walk
          </button>
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Write one line">
            <span class="text-lg">📝</span>
            Write
          </button>
        </div>
        <!-- Row 2: 2 chips -->
        <div class="flex justify-center gap-2">
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Breathe for 2 minutes">
            <span class="text-lg">🧘</span>
            Breathe
          </button>
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Read 5 pages">
            <span class="text-lg">📚</span>
            Read
          </button>
        </div>
        <!-- Row 3: 1 chip -->
        <div class="flex justify-center gap-2">
          <button class="chip flex items-center gap-2 px-4 py-2.5 bg-white border border-stone-200 rounded-full text-sm font-semibold text-stone-700" data-habit="Stretch for 5 minutes">
            <span class="text-lg">🤸</span>
            Stretch
          </button>
        </div>
      </div>

      <!-- CTA Button -->
      <div class="animate-fade-in-up delay-400">
        <button id="ctaBtn" class="cta-btn w-full py-4 bg-emerald-500 text-white text-base font-bold rounded-2xl">
          Start my journey →
        </button>
      </div>

      <!-- Secondary Links -->
      <div class="animate-fade-in-up delay-400 flex justify-center gap-6 mt-6">
        <button class="secondary-link text-sm font-medium text-stone-400">
          Browse templates
        </button>
        <span class="text-stone-300">•</span>
        <button class="secondary-link text-sm font-medium text-stone-400">
          Create custom habit
        </button>
      </div>

    </div>

    <!-- Success State (hidden by default) -->
    <div class="content-container hidden" id="successState">
      <div class="text-center">
        <div class="success-icon w-24 h-24 mx-auto mb-6 rounded-full bg-emerald-100 flex items-center justify-center">
          <span class="text-5xl">🌿</span>
        </div>
        <h2 class="text-2xl font-bold text-stone-800 mb-2">You're growing!</h2>
        <p class="text-base text-stone-500 mb-8" id="successMessage">
          "Drink water" added to your habits
        </p>
        <button id="addAnotherBtn" class="w-full py-4 bg-stone-800 text-white text-base font-bold rounded-2xl">
          Add another habit
        </button>
      </div>
    </div>

  </div>

  <script>
    const input = document.getElementById('habitInput');
    const ctaBtn = document.getElementById('ctaBtn');
    const chips = document.querySelectorAll('.chip');
    const mainContent = document.getElementById('mainContent');
    const successState = document.getElementById('successState');
    const successMessage = document.getElementById('successMessage');
    const addAnotherBtn = document.getElementById('addAnotherBtn');

    let selectedHabit = '';

    // Update CTA button state
    function updateCtaState() {
      if (input.value.trim() || selectedHabit) {
        ctaBtn.classList.add('active');
      } else {
        ctaBtn.classList.remove('active');
      }
    }

    // Input handling
    input.addEventListener('input', () => {
      // Deselect chips when typing
      chips.forEach(c => c.classList.remove('selected'));
      selectedHabit = '';
      updateCtaState();
    });

    // Chip selection
    chips.forEach(chip => {
      chip.addEventListener('click', () => {
        // Deselect all chips
        chips.forEach(c => c.classList.remove('selected'));

        // Select this chip
        chip.classList.add('selected');
        selectedHabit = chip.dataset.habit;
        input.value = selectedHabit;

        updateCtaState();
      });
    });

    // CTA click
    ctaBtn.addEventListener('click', () => {
      if (!ctaBtn.classList.contains('active')) return;

      const habit = input.value.trim() || selectedHabit;
      successMessage.textContent = `"${habit}" added to your habits`;

      // Show success state
      mainContent.classList.add('hidden');
      successState.classList.remove('hidden');

      // Create confetti
      createConfetti();
    });

    // Add another button
    addAnotherBtn.addEventListener('click', () => {
      // Reset and show main content
      input.value = '';
      selectedHabit = '';
      chips.forEach(c => c.classList.remove('selected'));
      updateCtaState();

      successState.classList.add('hidden');
      mainContent.classList.remove('hidden');
    });

    // Confetti effect
    function createConfetti() {
      const colors = ['#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#3b82f6'];
      const container = successState;

      for (let i = 0; i < 20; i++) {
        const confetti = document.createElement('div');
        confetti.className = 'confetti';
        confetti.style.left = `${Math.random() * 100}%`;
        confetti.style.top = '50%';
        confetti.style.width = '8px';
        confetti.style.height = '8px';
        confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        confetti.style.animationDelay = `${Math.random() * 0.3}s`;
        confetti.style.animationDuration = `${0.8 + Math.random() * 0.4}s`;

        container.appendChild(confetti);

        // Remove after animation
        setTimeout(() => confetti.remove(), 1500);
      }
    }
  </script>
</body>
</html>
