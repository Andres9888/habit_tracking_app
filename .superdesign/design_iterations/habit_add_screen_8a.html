<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Add Screen - V8-A (With Quick Picks)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * { font-family: 'Inter', sans-serif !important; -webkit-font-smoothing: antialiased; }
    .modal-bg { background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(4px); }
    .paper-bg { background: #faf9f7; }
    .color-swatch { transition: all 0.15s ease-out; }
    .color-swatch.selected { box-shadow: 0 0 0 2.5px #1a1a1a; transform: scale(1.12); }
    .pressable { transition: transform 0.1s ease-out; }
    .pressable:active { transform: scale(0.96); }
    input:focus { outline: none; }
    .emoji-chip { transition: all 0.15s ease-out; }
    .emoji-chip.selected { box-shadow: 0 0 0 2px #10B981; background: #ECFDF5; }
    .reminder-option { transition: all 0.15s ease; }
    .reminder-option.selected { background: #ECFDF5; border-color: #10B981; }
    .template-card { transition: all 0.15s ease; }
    .template-card:active { transform: scale(0.97); }
    .template-card.selected { background: #ECFDF5; border-color: #10B981; }
    ::-webkit-scrollbar { width: 0px; }
    .template-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    .template-scroll::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="bg-gray-900 min-h-screen flex items-end justify-center p-4">
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative modal-bg">
      <div class="absolute bottom-0 left-0 right-0 h-[88%] paper-bg rounded-t-3xl flex flex-col shadow-2xl">

        <!-- Header -->
        <div class="flex items-center justify-between px-5 py-4">
          <button class="w-9 h-9 flex items-center justify-center rounded-full bg-stone-200/60 pressable">
            <i data-lucide="x" class="w-5 h-5 text-stone-500"></i>
          </button>
          <h1 class="text-lg font-semibold text-[#1F2937]">New Habit</h1>
          <div class="w-9"></div>
        </div>

        <div class="flex-1 overflow-y-auto pb-6">

          <!-- Quick Picks - Compact -->
          <div class="px-5 mb-3">
            <p class="text-xs font-medium text-[#78716c] mb-2">Quick start</p>
          </div>
          <div class="template-scroll overflow-x-auto pl-5 mb-4">
            <div class="flex gap-2 pr-5">
              <button class="template-card flex-shrink-0 py-2 px-3 rounded-xl bg-white border border-stone-200 flex items-center gap-2">
                <span class="text-lg">🧘</span>
                <span class="text-sm font-medium text-[#1F2937]">Meditate</span>
              </button>
              <button class="template-card flex-shrink-0 py-2 px-3 rounded-xl flex items-center gap-2 selected border-2">
                <span class="text-lg">📖</span>
                <span class="text-sm font-medium text-[#047857]">Read</span>
              </button>
              <button class="template-card flex-shrink-0 py-2 px-3 rounded-xl bg-white border border-stone-200 flex items-center gap-2">
                <span class="text-lg">💪</span>
                <span class="text-sm font-medium text-[#1F2937]">Exercise</span>
              </button>
              <button class="template-card flex-shrink-0 py-2 px-3 rounded-xl bg-white border border-stone-200 flex items-center gap-2">
                <span class="text-lg">💧</span>
                <span class="text-sm font-medium text-[#1F2937]">Hydrate</span>
              </button>
              <button class="template-card flex-shrink-0 py-2 px-3 rounded-xl bg-white border border-stone-200 flex items-center gap-2">
                <span class="text-lg">📝</span>
                <span class="text-sm font-medium text-[#1F2937]">Journal</span>
              </button>
            </div>
          </div>

          <div class="px-5">
            <!-- Name Input -->
            <div class="mb-5">
              <label class="text-sm font-semibold text-[#1F2937] mb-2 block">Habit name</label>
              <div class="relative bg-white rounded-xl border-2 border-stone-200 overflow-hidden focus-within:border-[#10B981] transition-colors">
                <input type="text" value="Read" class="w-full h-12 pl-4 pr-14 text-base font-medium text-[#1F2937] placeholder-[#9CA3AF] bg-transparent" placeholder="e.g. Meditate for 10 min"/>
                <span class="absolute right-4 top-1/2 -translate-y-1/2 text-xs text-[#9CA3AF]">4/50</span>
              </div>
            </div>

            <!-- Icon -->
            <div class="mb-5">
              <div class="flex items-center justify-between mb-2">
                <label class="text-sm font-semibold text-[#1F2937]">Icon</label>
                <button class="text-xs text-[#10B981] font-medium pressable">More →</button>
              </div>
              <div class="flex gap-2">
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center selected"><span class="text-xl">📖</span></button>
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center"><span class="text-xl">📚</span></button>
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center"><span class="text-xl">📰</span></button>
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center"><span class="text-xl">✍️</span></button>
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center"><span class="text-xl">🎯</span></button>
                <button class="emoji-chip w-11 h-11 rounded-xl bg-white border border-stone-200 flex items-center justify-center"><span class="text-xl">✨</span></button>
              </div>
            </div>

            <!-- Color -->
            <div class="mb-5">
              <label class="text-sm font-semibold text-[#1F2937] mb-2 block">Color</label>
              <div class="flex flex-wrap gap-2.5">
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #EF4444;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #F97316;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #FBBF24;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable selected" style="background: #10B981;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #14B8A6;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #3B82F6;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #8B5CF6;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #EC4899;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #78716C;"></button>
                <button class="color-swatch w-10 h-10 rounded-full pressable" style="background: #1F2937;"></button>
              </div>
            </div>

            <!-- Reminder -->
            <div class="mb-5">
              <label class="text-sm font-semibold text-[#1F2937] mb-2 block">Reminder</label>
              <div class="grid grid-cols-4 gap-2">
                <button class="reminder-option py-2.5 px-2 rounded-xl bg-white border border-stone-200 pressable flex flex-col items-center">
                  <span class="text-base mb-0.5">🔕</span>
                  <span class="text-xs font-medium text-[#78716c]">None</span>
                </button>
                <button class="reminder-option py-2.5 px-2 rounded-xl pressable flex flex-col items-center selected border-2">
                  <span class="text-base mb-0.5">🌅</span>
                  <span class="text-xs font-medium text-[#047857]">Morning</span>
                  <span class="text-[10px] text-[#10B981]">7 AM</span>
                </button>
                <button class="reminder-option py-2.5 px-2 rounded-xl bg-white border border-stone-200 pressable flex flex-col items-center">
                  <span class="text-base mb-0.5">☀️</span>
                  <span class="text-xs font-medium text-[#78716c]">Midday</span>
                  <span class="text-[10px] text-[#9CA3AF]">12 PM</span>
                </button>
                <button class="reminder-option py-2.5 px-2 rounded-xl bg-white border border-stone-200 pressable flex flex-col items-center">
                  <span class="text-base mb-0.5">🌙</span>
                  <span class="text-xs font-medium text-[#78716c]">Evening</span>
                  <span class="text-[10px] text-[#9CA3AF]">8 PM</span>
                </button>
              </div>
            </div>

            <!-- Browse Templates -->
            <button class="w-full py-3 px-4 rounded-xl bg-white border border-stone-200 pressable flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg bg-stone-100 flex items-center justify-center">
                  <i data-lucide="sparkles" class="w-4 h-4 text-[#78716c]"></i>
                </div>
                <span class="text-sm font-medium text-[#1F2937]">Browse all templates</span>
              </div>
              <i data-lucide="chevron-right" class="w-5 h-5 text-[#9CA3AF]"></i>
            </button>
          </div>

          <div class="h-24"></div>
        </div>

        <!-- Sticky CTA -->
        <div class="absolute bottom-0 left-0 right-0 p-5 bg-gradient-to-t from-[#faf9f7] via-[#faf9f7] to-transparent pt-8">
          <button class="w-full h-14 rounded-2xl flex items-center justify-center gap-2 pressable shadow-lg" style="background: linear-gradient(135deg, #10B981 0%, #059669 100%);">
            <i data-lucide="check" class="w-5 h-5 text-white"></i>
            <span class="text-base font-semibold text-white">Create Habit</span>
          </button>
          <div class="flex justify-center mt-3"><div class="w-32 h-1 rounded-full bg-stone-300"></div></div>
        </div>
      </div>
    </div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
