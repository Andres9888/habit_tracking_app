<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Templates – Monetization Redesign v2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Literata:wght@700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      html {
        font-size: 16px !important;
      }
      body {
        font-family: 'DM Sans', sans-serif !important;
        background: #111827 !important;
        color: #f9fafb !important;
        overflow-x: hidden !important;
        -webkit-font-smoothing: antialiased;
      }
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      span,
      a,
      button,
      input {
        font-family: 'DM Sans', sans-serif !important;
      }
      button {
        border: none;
        background: none;
        cursor: pointer;
        font-family: inherit;
      }
      input {
        font-family: inherit;
      }
      a {
        text-decoration: none;
        color: inherit;
      }

      /* ═══ PHONE ═══ */
      .phone {
        width: 393px;
        height: 852px;
        margin: 30px auto;
        background: #111827;
        border-radius: 44px;
        border: 3px solid #1f2937;
        overflow: hidden;
        position: relative;
        box-shadow:
          0 30px 100px rgba(0, 0, 0, 0.7),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
      }
      .notch {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 34px;
        background: #111827;
        border-radius: 0 0 20px 20px;
        z-index: 100;
      }
      .statusbar {
        height: 54px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        padding: 0 28px 6px;
        font-size: 14px;
        font-weight: 600;
        color: #f9fafb;
      }
      .statusbar-r {
        display: flex;
        gap: 6px;
        align-items: center;
        font-size: 12px;
      }

      /* ═══ SCREEN ═══ */
      .screen {
        height: calc(100% - 54px);
        overflow-y: auto;
        overflow-x: hidden;
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
      .screen::-webkit-scrollbar {
        display: none;
      }

      /* ═══ VIEWS — stacked, transform-based transitions ═══ */
      .view {
        position: absolute;
        top: 54px;
        left: 0;
        right: 0;
        bottom: 0;
        background: #111827;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        transform: translateX(100%);
        transition: transform 280ms cubic-bezier(0.16, 1, 0.3, 1);
        z-index: 50;
      }
      .view.active {
        transform: translateX(0);
      }
      .view::-webkit-scrollbar {
        display: none;
      }

      /* ═══ HEADER ═══ */
      .hdr {
        padding: 8px 16px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .hdr-l {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .hdr-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: rgba(52, 211, 153, 0.1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .hdr-title {
        font-family: 'Literata', serif !important;
        font-size: 22px !important;
        font-weight: 700 !important;
        letter-spacing: -0.35px;
        color: #f9fafb;
        line-height: 28px;
      }
      .icon-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.06);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9ca3af;
        transition: all 150ms;
        flex-shrink: 0;
      }
      .icon-btn:active {
        transform: scale(0.9);
        background: rgba(255, 255, 255, 0.1);
      }

      /* ═══ SEARCH ═══ */
      .search-wrap {
        padding: 12px 16px 4px;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 10px;
        height: 44px;
        padding: 0 14px;
        background: #1f2937;
        border: 1.5px solid #374151;
        border-radius: 12px;
        transition: all 200ms;
      }
      .search:focus-within {
        border-color: rgba(52, 211, 153, 0.3);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.06);
      }
      .search input {
        flex: 1;
        background: none;
        border: none;
        color: #f9fafb;
        font-size: 17px;
        outline: none;
      }
      .search input::placeholder {
        color: #8e95a2;
      }
      .search-ic {
        color: #8e95a2;
        flex-shrink: 0;
      }

      /* ═══ USAGE BANNER ═══ */
      .usage {
        margin: 12px 16px 0;
        padding: 12px 16px;
        border-radius: 16px;
        background: #1f2937;
        border: 1px solid #374151;
        display: flex;
        align-items: center;
        gap: 12px;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .usage-dots {
        display: flex;
        gap: 6px;
      }
      .usage-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 6px rgba(52, 211, 153, 0.4);
      }
      .usage-dot.empty {
        background: transparent;
        box-shadow: none;
        border: 1.5px dashed #374151;
      }
      .usage-txt {
        flex: 1;
      }
      .usage-count {
        font-size: 13px;
        font-weight: 600;
        color: #f9fafb;
      }
      .usage-sub {
        font-size: 11px;
        color: #9ca3af;
        margin-top: 1px;
      }
      .usage-cta {
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 700;
        background: #34d399;
        color: #111827;
        white-space: nowrap;
        transition: all 150ms;
        height: 32px;
        display: flex;
        align-items: center;
      }
      .usage-cta:active {
        transform: scale(0.95);
      }

      /* ═══ SECTION HEADERS ═══ */
      .sec-hdr {
        padding: 20px 16px 10px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sec-title {
        font-size: 20px !important;
        font-weight: 600 !important;
        color: #f9fafb;
        letter-spacing: -0.2px;
      }
      .sec-action {
        font-size: 13px;
        color: #34d399;
        font-weight: 600;
      }
      .sec-action:active {
        opacity: 0.7;
      }

      /* ═══ FEATURED COLLECTION ═══ */
      .feat {
        margin: 14px 16px 0;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(52, 211, 153, 0.12);
        background: linear-gradient(160deg, #0d2818 0%, #111827 60%);
        position: relative;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .feat-shimmer {
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(52, 211, 153, 0.04),
          transparent
        );
        animation: shimSlide 4s ease-in-out infinite;
      }
      .feat-inner {
        position: relative;
        z-index: 1;
        padding: 16px;
      }
      .feat-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 13px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: #34d399;
        background: rgba(52, 211, 153, 0.1);
        padding: 4px 10px;
        border-radius: 8px;
        margin-bottom: 10px;
      }
      .feat-badge-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #34d399;
        animation: pulse 2s ease-in-out infinite;
      }
      .feat-title {
        font-family: 'Literata', serif !important;
        font-size: 17px !important;
        font-weight: 700 !important;
        color: #f9fafb;
        margin-bottom: 4px;
        letter-spacing: -0.2px;
      }
      .feat-desc {
        font-size: 14px;
        color: #9ca3af;
        margin-bottom: 12px;
        line-height: 1.4;
      }
      .feat-chips {
        display: flex;
        gap: 7px;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .feat-chip {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 5px 9px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid #374151;
        font-size: 13px;
        font-weight: 500;
        color: #d1d5db;
      }
      .feat-chip-em {
        font-size: 14px;
      }
      .feat-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .feat-users {
        font-size: 13px;
        color: #9ca3af;
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .feat-cta {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 8px 14px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 700;
        background: #34d399;
        color: #111827;
        transition: all 150ms;
        height: 44px;
      }
      .feat-cta:active {
        transform: scale(0.96);
      }

      /* ═══ POPULAR CARDS ═══ */
      .pop-scroll {
        display: flex;
        gap: 12px;
        padding: 0 16px 4px;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
      }
      .pop-scroll::-webkit-scrollbar {
        display: none;
      }
      .pop-card {
        flex-shrink: 0;
        width: 200px;
        padding: 14px;
        padding-left: 18px;
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 16px;
        scroll-snap-align: start;
        position: relative;
        overflow: hidden;
        transition: transform 150ms;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .pop-card:active {
        transform: scale(0.97);
      }
      .pop-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        border-radius: 16px 16px 0 0;
      }
      .pop-icon {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        margin-bottom: 8px;
      }
      .pop-badges {
        display: flex;
        gap: 4px;
        align-items: center;
        margin-bottom: 5px;
        flex-wrap: wrap;
      }
      .pop-sci {
        font-size: 13px;
        font-weight: 500;
        color: #34d399;
        background: rgba(52, 211, 153, 0.08);
        padding: 2px 6px;
        border-radius: 8px;
      }
      .pop-name {
        font-size: 17px !important;
        font-weight: 700 !important;
        color: #f9fafb;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .pop-meta {
        font-size: 12px;
        font-weight: 500;
        color: #8e95a2;
        margin-bottom: 9px;
      }
      .pop-add {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 700;
        transition: all 150ms;
      }
      .pop-add:active {
        transform: scale(0.95);
      }
      .pop-add.done {
        pointer-events: none;
      }

      /* ═══ PREMIUM PACKS ═══ */
      .prem-scroll {
        display: flex;
        gap: 12px;
        padding: 0 16px 4px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      .prem-scroll::-webkit-scrollbar {
        display: none;
      }
      .prem-pack {
        flex-shrink: 0;
        width: 210px;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid rgba(123, 82, 196, 0.12);
        transition: transform 150ms;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .prem-pack:active {
        transform: scale(0.97);
      }
      .prem-bg {
        padding: 16px;
        position: relative;
      }
      .prem-lock {
        position: absolute;
        top: 10px;
        right: 10px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: rgba(123, 82, 196, 0.12);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
      }
      .prem-emojis {
        display: flex;
        gap: 4px;
        margin-bottom: 9px;
      }
      .prem-emoji {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        background: rgba(255, 255, 255, 0.05);
      }
      .prem-name {
        font-size: 17px !important;
        font-weight: 700 !important;
        color: #f9fafb;
        margin-bottom: 2px;
      }
      .prem-meta {
        font-size: 13px;
        color: #9ca3af;
        margin-bottom: 9px;
      }
      .prem-cta {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 4px;
        width: 100%;
        padding: 7px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        background: rgba(123, 82, 196, 0.1);
        color: #c4b5fd;
        transition: all 150ms;
        height: 44px;
      }
      .prem-cta:active {
        transform: scale(0.95);
      }

      /* ═══ CATEGORY GRID ═══ */
      .cat-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        padding: 0 16px 24px;
      }
      .cat-card {
        padding: 16px;
        border-radius: 16px;
        border: 1px solid #374151;
        position: relative;
        overflow: hidden;
        transition: transform 150ms;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .cat-card:active {
        transform: scale(0.97);
      }
      .cat-ic {
        font-size: 26px;
        margin-bottom: 8px;
        display: block;
      }
      .cat-nm {
        font-size: 17px !important;
        font-weight: 600 !important;
        color: #f9fafb;
        margin-bottom: 2px;
      }
      .cat-ct {
        font-size: 13px;
        color: #9ca3af;
      }
      .pro-tag {
        position: absolute;
        top: 10px;
        right: 10px;
        font-size: 13px;
        font-weight: 600;
        color: #c4b5fd;
        background: rgba(123, 82, 196, 0.12);
        padding: 2px 6px;
        border-radius: 8px;
      }

      /* ═══ VIEW HEADERS ═══ */
      .v-hdr {
        padding: 16px 16px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        background: #111827;
        z-index: 10;
      }
      .v-title {
        font-size: 20px !important;
        font-weight: 600 !important;
        color: #f9fafb;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .v-sub {
        font-size: 14px;
        color: #9ca3af;
        margin-top: 1px;
      }
      .v-info {
        flex: 1;
      }

      /* ═══ TEMPLATE LIST CARDS ═══ */
      .tl {
        padding: 8px 16px 30px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .tc {
        background: #1f2937;
        border: 1px solid #374151;
        border-radius: 16px;
        padding: 16px;
        position: relative;
        overflow: hidden;
        transition: transform 150ms;
        box-shadow: 0 2px 8px rgba(45, 42, 38, 0.08);
      }
      .tc:active {
        transform: scale(0.98);
      }
      .tc-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 4px;
        height: 100%;
        border-radius: 0 4px 4px 0;
      }
      .tc.locked {
        opacity: 0.85;
      }
      .tc.locked::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(123, 82, 196, 0.03),
          transparent
        );
        pointer-events: none;
      }
      .tc-top {
        display: flex;
        gap: 12px;
        margin-bottom: 8px;
      }
      .tc-em {
        width: 46px;
        height: 46px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
        flex-shrink: 0;
        position: relative;
      }
      .tc-lock {
        position: absolute;
        bottom: -3px;
        right: -3px;
        width: 17px;
        height: 17px;
        border-radius: 5px;
        background: linear-gradient(135deg, #7b52c4, #6366f1);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 8px;
        box-shadow: 0 2px 6px rgba(123, 82, 196, 0.4);
      }
      .tc-info {
        flex: 1;
        min-width: 0;
      }
      .tc-nm {
        font-size: 20px !important;
        font-weight: 700 !important;
        color: #f9fafb;
        margin-bottom: 2px;
        letter-spacing: -0.2px;
        line-height: 26px;
      }
      .tc-desc {
        font-size: 14px;
        color: #9ca3af;
        line-height: 1.4;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .tc-bot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .tc-tags {
        display: flex;
        gap: 5px;
        align-items: center;
        flex-wrap: wrap;
      }
      .tag {
        font-size: 13px;
        font-weight: 500;
        padding: 3px 7px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.04);
        color: #9ca3af;
      }
      .tag.sci {
        background: rgba(52, 211, 153, 0.07);
        color: #34d399;
      }
      .tag.pro {
        background: rgba(123, 82, 196, 0.08);
        color: #c4b5fd;
      }
      .tc-acts {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .tc-prev {
        padding: 6px 12px;
        border-radius: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #9ca3af;
        background: rgba(255, 255, 255, 0.04);
        transition: all 150ms;
        display: flex;
        align-items: center;
      }
      .tc-prev:active {
        transform: scale(0.95);
      }
      .tc-add {
        padding: 6px 12px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 3px;
        transition: all 150ms;
        height: 32px;
      }
      .tc-add:active {
        transform: scale(0.93);
      }
      .tc-add.done {
        pointer-events: none;
      }
      .tc-add.lk {
        background: rgba(123, 82, 196, 0.1) !important;
        color: #c4b5fd !important;
      }

      /* ═══ PREVIEW MODAL ═══ */
      .pv-ov {
        position: absolute;
        inset: 0;
        z-index: 80;
        pointer-events: none;
        opacity: 0;
        transition: opacity 300ms;
      }
      .pv-ov.open {
        pointer-events: all;
        opacity: 1;
      }
      .pv-bg {
        position: absolute;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(6px);
      }
      .pv-sheet {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 88%;
        background: #fafaf9;
        border-radius: 24px 24px 0 0;
        transform: translateY(100%);
        transition: transform 400ms cubic-bezier(0.34, 1.56, 0.64, 1);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .pv-ov.open .pv-sheet {
        transform: translateY(0);
      }
      .pv-handle {
        width: 40px;
        height: 4px;
        background: #c4bfb7;
        border-radius: 4px;
        margin: 10px auto 0;
        flex-shrink: 0;
      }
      .pv-x {
        position: absolute;
        top: 12px;
        right: 16px;
        width: 40px;
        height: 40px;
        border-radius: 20px;
        background: rgba(0, 0, 0, 0.04);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #6e6660;
        z-index: 5;
      }
      .pv-x:active {
        transform: scale(0.9);
      }
      .pv-scroll {
        flex: 1;
        overflow-y: auto;
        padding: 16px 20px 0;
      }
      .pv-scroll::-webkit-scrollbar {
        display: none;
      }
      .pv-hero {
        text-align: center;
        padding: 16px 0 28px;
      }
      .pv-hero-ic {
        width: 96px;
        height: 96px;
        border-radius: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        font-size: 48px;
        margin-bottom: 20px;
        position: relative;
      }
      .pv-hero-glow {
        position: absolute;
        inset: 0;

                burst(pop.color);
              };
            })(i, p)
          );
          acts.appendChild(ab);
          bot.appendChild(acts);
          card.appendChild(bot);
          list.appendChild(card);
        });
        document.getElementById('seeAllView').classList.add('active');
      }
      function closeSeeAll() {
        document.getElementById('seeAllView').classList.remove('active');
      }

      // ═══ CATEGORY VIEW ═══
      function openCat(catId, icon, name) {
        var templates = TPL[catId] || [];
        var sciCount = templates.filter(function (t) {
          return t.sci;
        }).length;
        document.getElementById('catViewIcon').textContent = icon + ' ';
        document.getElementById('catViewName').textContent = name;
        document.getElementById('catViewSub').textContent =
          templates.length +
          ' templates \u00B7 ' +
          sciCount +
          ' research-backed';
        var list = document.getElementById('catList');
        list.textContent = '';
        templates.forEach(function (t, i) {
          var key = catId + '-' + i;
          var isAdded = addedSet.has(key);
          var isLocked = !!t.premium;
          var card = document.createElement('div');
          card.className = 'tc' + (isLocked ? ' locked' : '');
          card.style.animation =
            'fadeUp .28s cubic-bezier(.16,1,.3,1) ' + (i * 60 + 60) + 'ms both';
          var acc2 = document.createElement('div');
          acc2.className = 'tc-accent';
          acc2.style.background = t.color;
          card.appendChild(acc2);
          card.addEventListener('click', function () {
            openPv(catId, i);
          });
          var top = document.createElement('div');
          top.className = 'tc-top';
          var em = document.createElement('div');
          em.className = 'tc-em';
          em.style.background = t.color + '12';
          em.textContent = t.icon;
          if (isLocked) {
            var lk = document.createElement('div');
            lk.className = 'tc-lock';
            lk.textContent = '\uD83D\uDD12';
            em.appendChild(lk);
          }
          top.appendChild(em);
          var info = document.createElement('div');
          info.className = 'tc-info';
          var nm = document.createElement('div');
          nm.className = 'tc-nm';
          nm.textContent = t.name;
          info.appendChild(nm);
          var desc = document.createElement('div');
          desc.className = 'tc-desc';
          desc.textContent = t.desc;
          info.appendChild(desc);
          top.appendChild(info);
          card.appendChild(top);
          var bot = document.createElement('div');
          bot.className = 'tc-bot';
          var tags = document.createElement('div');
          tags.className = 'tc-tags';
          if (t.sci) {
            var st = document.createElement('span');
            st.className = 'tag sci';
            st.textContent = '\uD83D\uDD2C Science';
            tags.appendChild(st);
          }
          if (isLocked) {
            var pt = document.createElement('span');
            pt.className = 'tag pro';
            pt.textContent = '\u2728 Premium';
            tags.appendChild(pt);
          }
          var ft = document.createElement('span');
          ft.className = 'tag';
          ft.textContent = t.freq;
          tags.appendChild(ft);
          bot.appendChild(tags);
          var acts = document.createElement('div');
          acts.className = 'tc-acts';
          var pb = document.createElement('button');
          pb.className = 'tc-prev';
          pb.textContent = 'Preview';
          pb.addEventListener('click', function (e) {
            e.stopPropagation();
            openPv(catId, i);
          });
          acts.appendChild(pb);
          var ab = document.createElement('button');
          ab.className =
            'tc-add' + (isAdded ? ' done' : '') + (isLocked ? ' lk' : '');
          ab.id = 'ab-' + key;
          ab.style.background = isAdded
            ? 'rgba(52,211,153,.1)'
            : isLocked
              ? 'rgba(139,92,246,.1)'
              : t.color + '14';
          ab.style.color = isAdded ? '#34D399' : isLocked ? '#C4B5FD' : t.color;
          ab.textContent = isAdded
            ? '\u2713 Added'
            : isLocked
              ? '\uD83D\uDD13 Unlock'
              : '+ Add';
          ab.addEventListener(
            'click',
            (function (cid, idx, locked, tpl) {
              return function (e) {
                e.stopPropagation();
                if (addedSet.has(cid + '-' + idx)) return;
                if (locked) {
                  showPaywall();
                  return;
                }
                if (used >= LIMIT) {
                  showPaywall();
                  return;
                }
                addedSet.add(cid + '-' + idx);
                used++;
                renderUsage();
                var b = document.getElementById('ab-' + cid + '-' + idx);
                if (b) {
                  b.style.background = 'rgba(52,211,153,.1)';
                  b.style.color = '#34D399';
                  b.textContent = '\u2713 Added';
                  b.classList.add('done');
                }
                showToast(tpl.icon, tpl.name);
                burst(tpl.color);
              };
            })(catId, i, isLocked, t)
          );
          acts.appendChild(ab);
          bot.appendChild(acts);
          card.appendChild(bot);
          list.appendChild(card);
        });
        document.getElementById('catView').classList.add('active');
      }
      function closeCat() {
        document.getElementById('catView').classList.remove('active');
      }

      // ═══ PREVIEW ═══
      function openPv(catId, index) {
        var t = TPL[catId][index];
        var isAdded = addedSet.has(catId + '-' + index);
        var isLocked = !!t.premium;
        var content = document.getElementById('pvContent');
        content.textContent = '';
        var hero = document.createElement('div');
        hero.className = 'pv-hero';
        var hic = document.createElement('div');
        hic.className = 'pv-hero-ic';
        hic.style.background = t.color + '20';
        hic.textContent = t.icon;
        var glow = document.createElement('div');
        glow.className = 'pv-hero-glow';
        glow.style.background = t.color;
        hic.appendChild(glow);
        hero.appendChild(hic);
        var hnm = document.createElement('div');
        hnm.className = 'pv-hero-nm';
        hnm.textContent = t.name;
        hero.appendChild(hnm);
        var pills = document.createElement('div');
        pills.className = 'pv-pills';
        ['\u23F0 ' + t.freq, '\u23F3 5-10 min'].forEach(function (txt) {
          var p = document.createElement('span');
          p.className = 'pv-pill';
          p.textContent = txt;
          pills.appendChild(p);
        });
        if (t.sci) {
          var sp = document.createElement('span');
          sp.className = 'pv-pill';
          sp.style.color = '#059669';
          sp.style.background = 'rgba(16,185,129,.06)';
          sp.style.borderColor = '#6EE7B7';
          sp.textContent = '\uD83D\uDD2C Research';
          pills.appendChild(sp);
        }
        if (isLocked) {
          var lp = document.createElement('span');
          lp.className = 'pv-pill';
          lp.style.color = '#C4B5FD';
          lp.style.background = 'rgba(139,92,246,.06)';
          lp.textContent = '\u2728 Premium';
          pills.appendChild(lp);
        }
        hero.appendChild(pills);
        content.appendChild(hero);
        var asec = document.createElement('div');
        asec.className = 'pv-sec';
        var at = document.createElement('div');
        at.className = 'pv-sec-t';
        at.textContent = 'About';
        asec.appendChild(at);
        var ap = document.createElement('div');
        ap.className = 'pv-sec-p';
        ap.textContent = t.desc;
        asec.appendChild(ap);
        content.appendChild(asec);
        if (t.sci && t.ref) {
          var ssec = document.createElement('div');
          ssec.className = 'pv-sec';
          var st = document.createElement('div');
          st.className = 'pv-sec-t';
          st.textContent = 'Research';
          ssec.appendChild(st);
          var sb = document.createElement('div');
          sb.className = 'sci-box';
          var sh = document.createElement('div');
          sh.className = 'sci-hdr';
          sh.textContent = '\uD83D\uDD2C Science-Backed';
          sb.appendChild(sh);
          var stxt = document.createElement('div');
          stxt.className = 'sci-txt';
          stxt.textContent = t.ref;
          sb.appendChild(stxt);
          ssec.appendChild(sb);
          content.appendChild(ssec);
        }
        if (t.tips && t.tips.length) {
          var tsec = document.createElement('div');
          tsec.className = 'pv-sec';
          var tt = document.createElement('div');
          tt.className = 'pv-sec-t';
          tt.textContent = 'Tips for Success';
          tsec.appendChild(tt);
          var tl = document.createElement('div');
          tl.className = 'tips-list';
          t.tips.forEach(function (tip) {
            var item = document.createElement('div');
            item.className = 'tip';
            var dot = document.createElement('div');
            dot.className = 'tip-dot';
            item.appendChild(dot);
            var txt = document.createElement('span');
            txt.textContent = tip;
            item.appendChild(txt);
            tl.appendChild(item);
          });
          tsec.appendChild(tl);
          content.appendChild(tsec);
        }
        var foot = document.getElementById('pvFoot');
        foot.textContent = '';
        var qa = document.createElement('button');
        qa.className = 'btn-qa' + (isAdded ? ' done' : '');
        qa.id = 'pvAdd';
        if (isLocked) {
          qa.style.background = 'linear-gradient(135deg,#7B52C4,#6366F1)';
          qa.style.color = '#fff';
          qa.textContent = '\uD83D\uDD13 Unlock Premium';
        } else if (isAdded) {
          qa.style.background = 'rgba(52,211,153,.12)';
          qa.style.color = '#34D399';
          qa.textContent = '\u2713 Added';
        } else {
          qa.style.background = t.color;
          qa.style.color = '#fff';
          qa.textContent = '+ Quick Add';
        }
        qa.addEventListener(
          'click',
          (function (cid, idx, locked, tpl) {
            return function () {
              if (locked) {
                showPaywall();
                return;
              }
              if (addedSet.has(cid + '-' + idx)) return;
              if (used >= LIMIT) {
                showPaywall();
                return;
              }
              addedSet.add(cid + '-' + idx);
              used++;
              renderUsage();
              var b = document.getElementById('pvAdd');
              if (b) {
                b.style.background = 'rgba(52,211,153,.12)';
                b.style.color = '#34D399';
                b.textContent = '\u2713 Added';
                b.classList.add('done');
              }
              var lb = document.getElementById('ab-' + cid + '-' + idx);
              if (lb) {
                lb.style.background = 'rgba(52,211,153,.1)';
                lb.style.color = '#34D399';
                lb.textContent = '\u2713 Added';
                lb.classList.add('done');
              }
              showToast(tpl.icon, tpl.name);
              burst(tpl.color);
              setTimeout(closePv, 800);
            };
          })(catId, index, isLocked, t)
        );
        foot.appendChild(qa);
        var custLink = document.createElement('button');
        custLink.className = 'btn-cust';
        custLink.textContent = isLocked ? 'Learn more' : 'Customize';
        custLink.addEventListener('click', closePv);
        foot.appendChild(custLink);
        document.getElementById('pvOv').classList.add('open');
      }
      function closePv() {
        document.getElementById('pvOv').classList.remove('open');
      }

      // ═══ PACK CONFIRM ═══
      function showPackConfirm(pack) {
        document.getElementById('pcTitle').textContent = pack.title;
        document.getElementById('pcDesc').textContent =
          'These ' + pack.habits.length + ' habits will be added to your list';
        var list = document.getElementById('pcList');
        list.textContent = '';
        pack.habits.forEach(function (h) {
          var item = document.createElement('div');
          item.className = 'pc-item';
          var em = document.createElement('div');
          em.className = 'pc-item-em';
          em.style.background = 'rgba(52,211,153,.08)';
          em.textContent = h.emoji;
          item.appendChild(em);
          var info = document.createElement('div');
          info.style.flex = '1';
          var nm = document.createElement('div');
          nm.className = 'pc-item-nm';
          nm.textContent = h.name;
          info.appendChild(nm);
          var freq = document.createElement('div');
          freq.className = 'pc-item-freq';
          freq.textContent = h.freq;
          info.appendChild(freq);
          item.appendChild(info);
          var chk = document.createElement('span');
          chk.className = 'pc-item-chk';
          chk.textContent = '✓';
          item.appendChild(chk);
          list.appendChild(item);
        });
        var btn = document.getElementById('pcConfirm');
        btn.textContent = 'Add All ' + pack.habits.length;
        btn.onclick = function () {
          if (used + pack.habits.length > LIMIT) {
            closePc();
            setTimeout(showPaywall, 300);
            return;
          }
          // Animate checkmarks one by one
          var checks = list.querySelectorAll('.pc-item-chk');
          checks.forEach(function (c, i) {
            setTimeout(function () {
              c.classList.add('on');
            }, i * 200);
          });
          setTimeout(
            function () {
              used += pack.habits.length;
              renderUsage();
              closePc();
              showToast('📦', pack.habits.length + ' habits added');
              burst('#34D399');
            },
            checks.length * 200 + 300
          );
        };
        document.getElementById('pcOv').classList.add('open');
      }
      function closePc() {
        document.getElementById('pcOv').classList.remove('open');
      }

      // ═══ PAYWALL ═══
      function showPaywall() {
        document.getElementById('pwOv').classList.add('open');
      }
      function closePw() {
        document.getElementById('pwOv').classList.remove('open');
      }

      // ═══ TOAST ═══
      function showToast(icon, name) {
        document.getElementById('toastIc').textContent = icon;
        document.getElementById('toastNm').textContent = name;
        var rem = LIMIT - used;
        document.getElementById('toastSub').textContent =
          rem > 0
            ? 'Added \u00B7 ' +
              rem +
              ' free slot' +
              (rem !== 1 ? 's' : '') +
              ' left'
            : 'Added to your habits';
        var t = document.getElementById('toast');
        t.classList.add('show');
        setTimeout(function () {
          t.classList.remove('show');
        }, 5000);
      }

      // ═══ CONFETTI ═══
      function burst(color) {
        var box = document.getElementById('confBox');
        var colors = [
          color,
          '#F59E0B',
          '#7B52C4',
          '#EC4899',
          '#34D399',
          '#3B82F6',
        ];
        for (var i = 0; i < 18; i++) {
          var p = document.createElement('div');
          p.className = 'conf';
          p.style.left = '50%';
          p.style.top = '55%';
          p.style.background = colors[i % colors.length];
          p.style.setProperty('--tx', (Math.random() - 0.5) * 260 + 'px');
          p.style.setProperty('--ty', -(Math.random() * 320 + 80) + 'px');
          p.style.setProperty('--tr', (Math.random() - 0.5) * 720 + 'deg');
          p.style.animationDelay = Math.random() * 80 + 'ms';
          p.style.width = 5 + Math.random() * 5 + 'px';
          p.style.height = 5 + Math.random() * 5 + 'px';
          p.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
          p.classList.add('go');
          box.appendChild(p);
          (function (el) {
            setTimeout(function () {
              el.remove();
            }, 1000);
          })(p);
        }
      }

      // ═══ INIT ═══
      renderUsage();
      renderFeatured();
      renderPopular();
      renderPremPacks();
      renderCats();
      renderPwPerks();
    </script>
  </body>
</html>
