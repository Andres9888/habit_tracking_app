<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chain Day – Social Auth Welcome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="social_auth_welcome_theme.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'DM Sans', sans-serif !important;
        background: #111 !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }
      h1,
      h2,
      h3 {
        font-family: 'Literata', serif !important;
      }

      /* Phone frame */
      .phone {
        width: 375px;
        height: 812px;
        border-radius: 44px;
        overflow: hidden;
        position: relative;
        box-shadow:
          0 0 0 2px rgba(255, 255, 255, 0.06),
          0 25px 60px -12px rgba(0, 0, 0, 0.7),
          0 0 80px -20px rgba(5, 150, 105, 0.15);
      }
      .phone::before {
        content: '';
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 126px;
        height: 34px;
        background: #1c1917;
        border-radius: 0 0 18px 18px;
        z-index: 50;
      }
      .phone-inner {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Logo animations */
      @keyframes breathe {
        0%,
        100% {
          transform: scale(1) translateY(0);
        }
        50% {
          transform: scale(1.04) translateY(-4px);
        }
      }
      .logo-animate {
        animation: breathe 4s ease-in-out infinite;
      }

      /* Staggered entrance */
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .enter-1 {
        animation: fadeSlideUp 0.6s ease-out 0s both;
      }
      .enter-2 {
        animation: fadeSlideUp 0.6s ease-out 0.2s both;
      }
      .enter-3 {
        animation: fadeSlideUp 0.6s ease-out 0.35s both;
      }
      .enter-4 {
        animation: fadeSlideUp 0.6s ease-out 0.5s both;
      }
      .enter-5 {
        animation: fadeSlideUp 0.6s ease-out 0.58s both;
      }
      .enter-6 {
        animation: fadeSlideUp 0.6s ease-out 0.66s both;
      }
      .enter-7 {
        animation: fadeSlideUp 0.6s ease-out 0.74s both;
      }
      .enter-8 {
        animation: fadeSlideUp 0.6s ease-out 0.85s both;
      }
      .enter-9 {
        animation: fadeSlideUp 0.6s ease-out 0.95s both;
      }
      .enter-10 {
        animation: fadeSlideUp 0.4s ease-out 1s both;
      }

      /* Button interactions */
      .btn-social {
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease;
        cursor: pointer;
        border: none;
        outline: none;
      }
      .btn-social:active {
        transform: scale(0.97);
      }
      .btn-social:hover {
        transform: translateY(-1px);
      }

      /* Value prop item */
      .value-item {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 14px;
      }
      .value-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div
      class="phone"
      style="
        background: linear-gradient(
          180deg,
          #faf8f5 0%,
          #f5f1ed 40%,
          #faf8f5 100%
        );
      "
    >
      <div class="phone-inner" style="padding: 58px 24px 28px">
        <!-- ═══ HERO SECTION ═══ -->
        <div
          style="
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-bottom: 8px;
          "
        >
          <!-- Animated Logo -->
          <div
            class="logo-animate enter-1"
            style="
              width: 80px;
              height: 80px;
              border-radius: 20px;
              background: linear-gradient(
                135deg,
                #059669 0%,
                #10b981 50%,
                #34d399 100%
              );
              display: flex;
              align-items: center;
              justify-content: center;
              box-shadow: 0 8px 24px rgba(5, 150, 105, 0.3);
              margin-bottom: 20px;
            "
          >
            <svg
              width="40"
              height="40"
              viewBox="0 0 24 24"
              fill="none"
              stroke="white"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
              />
              <path
                d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
              />
            </svg>
          </div>

          <!-- Title -->
          <h1
            class="enter-2"
            style="
              font-family: 'Literata', serif !important;
              font-size: 34px;
              font-weight: 700;
              color: #2d2a26;
              text-align: center;
              letter-spacing: -0.85px;
              line-height: 41px;
              margin-bottom: 6px;
            "
          >
            Chain Day
          </h1>

          <!-- Subtitle -->
          <p
            class="enter-3"
            style="
              font-family: 'DM Sans', sans-serif !important;
              font-size: 17px;
              color: #6b6560;
              text-align: center;
              line-height: 24px;
              margin-bottom: 24px;
            "
          >
            Build habits that last
          </p>

          <!-- Social Proof Badge -->
          <div
            class="enter-4"
            style="
              display: inline-flex;
              align-items: center;
              gap: 6px;
              padding: 8px 16px;
              border-radius: 9999px;
              background: linear-gradient(135deg, #fef3c7, #fde68a);
              border: 1px solid #fcd34d;
              margin-bottom: 24px;
            "
          >
            <span style="font-size: 13px; line-height: 1">&#11088;</span>
            <span
              style="
                font-size: 13px;
                font-weight: 600;
                color: #92400e;
                font-family: 'DM Sans', sans-serif;
              "
              >10,000+ building better habits</span
            >
          </div>

          <!-- Value Props -->
          <div
            style="
              width: 100%;
              border-radius: 16px;
              background: rgba(237, 234, 229, 0.6);
              padding: 4px 0;
            "
          >
            <div class="value-item enter-5">
              <div class="value-icon" style="background: #d1fae5">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#059669"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"
                  />
                  <path
                    d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
                  />
                </svg>
              </div>
              <span style="font-size: 15px; font-weight: 500; color: #2d2a26"
                >Start your chain</span
              >
            </div>
            <div class="value-item enter-6">
              <div class="value-icon" style="background: #d1fae5">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#059669"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />
                </svg>
              </div>
              <span style="font-size: 15px; font-weight: 500; color: #2d2a26"
                >Track your streak</span
              >
            </div>
            <div class="value-item enter-7">
              <div class="value-icon" style="background: #d1fae5">
                <svg
                  width="18"
                  height="18"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#059669"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M6 9H4.5a2.5 2.5 0 0 1 0-5C7 4 9 7 12 7s5-3 7.5-3a2.5 2.5 0 0 1 0 5H18"
                  />
                  <path d="M18 15h1.5a2.5 2.5 0 0 0 0-5H18" />
                  <path d="M6 15H4.5a2.5 2.5 0 0 1 0-5H6" />
                  <line x1="6" y1="9" x2="6" y2="15" />
                  <line x1="18" y1="9" x2="18" y2="15" />
                  <path d="M6 15a6 6 0 0 0 12 0" />
                </svg>
              </div>
              <span style="font-size: 15px; font-weight: 500; color: #2d2a26"
                >Build momentum</span
              >
            </div>
          </div>
        </div>

        <!-- ═══ ACTION SECTION ═══ -->
        <div
          style="
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-top: 8px;
          "
        >
          <!-- Apple Button -->
          <button
            class="btn-social enter-8"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              width: 100%;
              padding: 16px;
              border-radius: 16px;
              background: #000;
              color: white;
              font-family: 'DM Sans', sans-serif;
              font-size: 15px;
              font-weight: 600;
            "
          >
            <svg width="20" height="20" viewBox="0 0 24 24" fill="white">
              <path
                d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"
              />
            </svg>
            Continue with Apple
          </button>

          <!-- Google Button -->
          <button
            class="btn-social enter-9"
            style="
              display: flex;
              align-items: center;
              justify-content: center;
              gap: 10px;
              width: 100%;
              padding: 16px;
              border-radius: 16px;
              background: white;
              color: #1c1917;
              font-family: 'DM Sans', sans-serif;
              font-size: 15px;
              font-weight: 600;
              border: 1px solid #ddd8d2;
            "
          >
            <svg width="20" height="20" viewBox="0 0 24 24">
              <path
                fill="#4285F4"
                d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"
              />
              <path
                fill="#34A853"
                d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"
              />
              <path
                fill="#FBBC05"
                d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"
              />
              <path
                fill="#EA4335"
                d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"
              />
            </svg>
            Continue with Google
          </button>
        </div>

        <!-- ═══ LEGAL FOOTER ═══ -->
        <div
          class="enter-10"
          style="
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding-top: 16px;
            padding-bottom: 4px;
          "
        >
          <span
            style="
              font-size: 12px;
              color: #a8a29e;
              font-family: 'DM Sans', sans-serif;
            "
            >Terms</span
          >
          <span style="font-size: 12px; color: #c4bfb7">&#183;</span>
          <span
            style="
              font-size: 12px;
              color: #a8a29e;
              font-family: 'DM Sans', sans-serif;
            "
            >Privacy</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
