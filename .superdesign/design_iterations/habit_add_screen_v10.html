<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Habit - V10 (Fresh Minimal Design)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <style>
    * {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
      -webkit-font-smoothing: antialiased;
      box-sizing: border-box;
    }

    :root {
      --bg: #faf9f7;
      --primary: #10B981;
      --primary-light: #ECFDF5;
      --text: #1c1917;
      --text-secondary: #78716c;
      --border: #e7e5e4;
    }

    body { background: #111; }

    .pressable { transition: transform 0.1s ease; cursor: pointer; }
    .pressable:active { transform: scale(0.96); }

    .emoji-hero {
      width: 80px;
      height: 80px;
      font-size: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      border-radius: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      transition: all 0.2s ease;
    }

    .emoji-chip {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: white;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: all 0.15s ease;
    }

    .emoji-chip:hover { border-color: #d6d3d1; }
    .emoji-chip.selected {
      border-color: var(--primary);
      border-width: 2px;
      background: var(--primary-light);
    }

    .color-dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: all 0.15s ease;
      border: 2px solid transparent;
    }

    .color-dot:hover { transform: scale(1.15); }
    .color-dot.selected {
      transform: scale(1.2);
      box-shadow: 0 0 0 2px white, 0 0 0 4px currentColor;
    }

    .reminder-chip {
      padding: 10px 16px;
      border-radius: 20px;
      background: white;
      border: 1.5px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .reminder-chip:hover { border-color: #d6d3d1; }
    .reminder-chip.selected {
      border-color: var(--primary);
      border-width: 2px;
      background: var(--primary-light);
      color: #047857;
    }

    .habit-input {
      width: 100%;
      height: 52px;
      border: none;
      background: transparent;
      font-size: 20px;
      font-weight: 500;
      text-align: center;
      color: var(--text);
    }

    .habit-input::placeholder {
      color: #a8a29e;
      font-weight: 400;
    }

    .habit-input:focus { outline: none; }

    .create-btn {
      width: 100%;
      height: 56px;
      border-radius: 16px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: white;
      font-size: 17px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.35);
      border: none;
      transition: all 0.15s ease;
    }

    .create-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }

    ::-webkit-scrollbar { width: 0; }
  </style>
</head>
<body class="min-h-screen flex items-end justify-center p-4">
  <!-- iPhone Frame -->
  <div class="w-full max-w-[390px] h-[844px] bg-black rounded-[50px] p-3 shadow-2xl relative overflow-hidden">
    <div class="w-full h-full rounded-[40px] overflow-hidden relative" style="background: rgba(0,0,0,0.4); backdrop-filter: blur(8px);">

      <!-- Modal Sheet -->
      <div class="absolute bottom-0 left-0 right-0 h-[82%] rounded-t-[28px] flex flex-col" style="background: var(--bg);">

        <!-- Header - Minimal -->
        <div class="flex items-center justify-end px-5 py-4">
          <button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-stone-100 pressable">
            <i data-lucide="x" class="w-5 h-5 text-stone-400"></i>
          </button>
        </div>

        <!-- Content -->
        <div class="flex-1 overflow-y-auto px-6">

          <!-- Hero Emoji + Input -->
          <div class="flex flex-col items-center mb-8">
            <div class="emoji-hero mb-5">
              📖
            </div>
            <input
              type="text"
              class="habit-input"
              placeholder="Name your habit..."
              value="Read for 20 minutes"
            />
            <div class="w-16 h-0.5 bg-stone-200 rounded-full mt-1"></div>
          </div>

          <!-- Emoji Row -->
          <div class="flex justify-center gap-2 mb-8">
            <button class="emoji-chip selected">📖</button>
            <button class="emoji-chip">💪</button>
            <button class="emoji-chip">🏃</button>
            <button class="emoji-chip">🧘</button>
            <button class="emoji-chip">✨</button>
            <button class="emoji-chip" style="background: #f5f5f4; border-style: dashed;">
              <i data-lucide="plus" class="w-5 h-5 text-stone-400"></i>
            </button>
          </div>

          <!-- Colors -->
          <div class="flex justify-center gap-2.5 mb-8">
            <button class="color-dot" style="background: #EF4444; color: #EF4444;"></button>
            <button class="color-dot" style="background: #F97316; color: #F97316;"></button>
            <button class="color-dot" style="background: #FBBF24; color: #FBBF24;"></button>
            <button class="color-dot" style="background: #84CC16; color: #84CC16;"></button>
            <button class="color-dot selected" style="background: #10B981; color: #10B981;"></button>
            <button class="color-dot" style="background: #14B8A6; color: #14B8A6;"></button>
            <button class="color-dot" style="background: #06B6D4; color: #06B6D4;"></button>
            <button class="color-dot" style="background: #3B82F6; color: #3B82F6;"></button>
            <button class="color-dot" style="background: #8B5CF6; color: #8B5CF6;"></button>
            <button class="color-dot" style="background: #A855F7; color: #A855F7;"></button>
            <button class="color-dot" style="background: #EC4899; color: #EC4899;"></button>
            <button class="color-dot" style="background: #78716C; color: #78716C;"></button>
          </div>

          <!-- Reminder Chips -->
          <div class="flex justify-center gap-2 flex-wrap mb-6">
            <button class="reminder-chip">
              <span>🔕</span>
              <span>None</span>
            </button>
            <button class="reminder-chip selected">
              <span>🌅</span>
              <span>Morning</span>
            </button>
            <button class="reminder-chip">
              <span>☀️</span>
              <span>Midday</span>
            </button>
            <button class="reminder-chip">
              <span>🌙</span>
              <span>Evening</span>
            </button>
          </div>

        </div>

        <!-- Sticky Footer -->
        <div class="px-6 pb-8 pt-4" style="background: linear-gradient(to top, var(--bg) 80%, transparent);">
          <button class="create-btn pressable">
            <i data-lucide="check" class="w-5 h-5"></i>
            Create Habit
          </button>
          <div class="flex justify-center mt-4">
            <div class="w-32 h-1 rounded-full bg-stone-300/50"></div>
          </div>
        </div>

      </div>
    </div>
  </div>

  <script>lucide.createIcons();</script>
</body>
</html>
