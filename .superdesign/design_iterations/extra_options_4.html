<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=390,initial-scale=1" />
    <title>V4 · Card Grid</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Literata:opsz,wght@7..72,500;7..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #f5f1ed;
        --card: #edeae5;
        --border: #ddd8d2;
        --surface: #edeae5;
        --p100: #d1fae5;
        --p500: #10b981;
        --p600: #059669;
        --p700: #047857;
        --t1: #2d2a26;
        --t2: #6b6560;
        --t3: #6e6660;
        --streakLt: #fef3c7;
        --streakTx: #92400e;
        --sans:
          'DM Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI',
          Roboto, sans-serif;
        --serif: 'Literata', Georgia, serif;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }
      html,
      body {
        background: var(--bg);
        width: 390px;
        overflow: hidden;
      }
      body {
        font-family: var(--sans);
        color: var(--t1);
      }
      .frame {
        width: 390px;
        min-height: 760px;
        background: var(--bg);
        position: relative;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .statusbar {
        height: 44px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 22px;
        font-size: 14px;
        font-weight: 600;
        color: var(--t1);
      }
      .nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 6px 20px 2px;
      }
      .nav .cancel {
        font-size: 15px;
        color: var(--t2);
        font-weight: 500;
      }
      .nav .h {
        font-family: var(--serif);
        font-size: 20px;
        font-weight: 600;
        color: var(--t1);
      }
      .nav .spacer {
        width: 48px;
      }
      .scroll {
        flex: 0 0 auto;
        padding: 8px 0 0;
      }
      .namewrap {
        padding: 22px 24px 14px;
        text-align: center;
      }
      .eyebrow {
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.5px;
        color: var(--t3);
        text-transform: uppercase;
      }
      .name {
        margin-top: 10px;
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 600;
        color: var(--t1);
      }
      .name .cursor {
        color: var(--p600);
        font-weight: 400;
      }
      .stylerow {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 2px 24px 6px;
      }
      .emojibubble {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        background: #dbeafe;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .dots {
        display: flex;
        gap: 7px;
      }
      .dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        border: 2px solid transparent;
      }
      .dot.sel {
        border-color: var(--t1);
        transform: scale(1.05);
      }
      .divider {
        height: 1px;
        background: var(--border);
        margin: 14px 24px;
      }
      /* ---- shared section chrome ---- */
      .sec {
        margin: 6px 24px 0;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 1px 2px rgba(45, 42, 38, 0.05);
      }
      .rowicon {
        width: 38px;
        height: 38px;
        border-radius: 11px;
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .chev {
        color: var(--t3);
      }
      .optrow {
        display: flex;
        align-items: center;
        gap: 13px;
        padding: 14px 15px;
      }
      .optrow + .optrow {
        border-top: 1px solid var(--border);
      }
      .optrow .txt {
        flex: 1;
        min-width: 0;
      }
      .optrow .ttl {
        font-size: 15px;
        font-weight: 600;
        color: var(--t1);
      }
      .optrow .sub {
        font-size: 12.5px;
        color: var(--t2);
        margin-top: 2px;
      }
      .optrow .desc {
        font-size: 12px;
        color: var(--t3);
        margin-top: 3px;
        line-height: 1.35;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11px;
        font-weight: 600;
      }
      .createbar {
        margin-top: 18px;
        padding: 14px 24px 30px;
      }
      .createbtn {
        height: 54px;
        border-radius: 14px;
        background: var(--p600);
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.3px;
        box-shadow: 0 6px 16px rgba(5, 150, 105, 0.28);
      }
      .hdrlabel {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 2px 10px;
      }
      .hdrlabel .l {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.6px;
        color: var(--t2);
        text-transform: uppercase;
      }
      .hdrlabel .opt {
        font-size: 11px;
        font-weight: 600;
        color: var(--p700);
        background: var(--p100);
        border-radius: 999px;
        padding: 2px 8px;
      }
      .tag {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.4px;
        text-transform: uppercase;
        color: var(--t3);
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 2px 6px;
      }
      .caption {
        font-size: 12px;
        color: var(--t3);
        line-height: 1.4;
      }
      .badge {
        font-size: 26px;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <div class="statusbar">
        <span>9:41</span
        ><span style="letter-spacing: 2px; font-size: 13px"
          >📶 &nbsp; 100%</span
        >
      </div>
      <div class="nav">
        <span class="cancel">Cancel</span><span class="h">New Habit</span
        ><span class="spacer"></span>
      </div>
      <div class="scroll">
        <div class="namewrap">
          <div class="eyebrow">What do you want to build?</div>
          <div class="name">Read before bed<span class="cursor">|</span></div>
        </div>
        <div class="stylerow">
          <div class="emojibubble">📖</div>
          <div class="dots">
            <span class="dot" style="background: #059669"></span>
            <span class="dot sel" style="background: #2563eb"></span>
            <span class="dot" style="background: #d97706"></span>
            <span class="dot" style="background: #7c3aed"></span>
            <span class="dot" style="background: #dc2626"></span>
          </div>
          <div
            class="pill"
            style="
              background: var(--card);
              border: 1px solid var(--border);
              color: var(--t2);
            "
          >
            ⏰ 9:30 PM
          </div>
        </div>
        <div class="divider"></div>

        <div class="sec">
          <div class="hdrlabel">
            <span class="l">Customize how it grows</span
            ><span class="opt">Optional</span>
          </div>
          <div style="display: flex; gap: 10px">
            <div
              style="
                flex: 1;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 13px 11px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
              "
            >
              <div
                style="
                  width: 34px;
                  height: 34px;
                  border-radius: 10px;
                  background: var(--p100);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 16px;
                  color: var(--p700);
                "
              >
                📈
              </div>
              <div
                style="
                  font-size: 13px;
                  font-weight: 700;
                  color: var(--t1);
                  line-height: 1.2;
                "
              >
                Strength
              </div>
              <div
                style="font-size: 11.5px; color: var(--t2); font-weight: 600"
              >
                Average
              </div>
              <div
                style="
                  margin-top: 2px;
                  font-size: 11px;
                  font-weight: 700;
                  color: var(--p700);
                "
              >
                Edit ›
              </div>
            </div>

            <div
              style="
                flex: 1;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 13px 11px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
              "
            >
              <div
                style="
                  width: 34px;
                  height: 34px;
                  border-radius: 10px;
                  background: var(--p100);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 16px;
                  color: var(--p700);
                "
              >
                🥉
              </div>
              <div
                style="
                  font-size: 13px;
                  font-weight: 700;
                  color: var(--t1);
                  line-height: 1.2;
                "
              >
                Icons
              </div>
              <div
                style="font-size: 11.5px; color: var(--t2); font-weight: 600"
              >
                Ranks
              </div>
              <div
                style="
                  margin-top: 2px;
                  font-size: 11px;
                  font-weight: 700;
                  color: var(--p700);
                "
              >
                Edit ›
              </div>
            </div>

            <div
              style="
                flex: 1;
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 14px;
                padding: 13px 11px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
              "
            >
              <div
                style="
                  width: 34px;
                  height: 34px;
                  border-radius: 10px;
                  background: var(--streakLt);
                  display: flex;
                  align-items: center;
                  justify-content: center;
                  font-size: 16px;
                  color: var(--streakTx);
                "
              >
                ◎
              </div>
              <div
                style="
                  font-size: 13px;
                  font-weight: 700;
                  color: var(--t1);
                  line-height: 1.2;
                "
              >
                Streak
              </div>
              <div
                style="font-size: 11.5px; color: var(--t2); font-weight: 600"
              >
                Off
              </div>
              <div
                style="
                  margin-top: 2px;
                  font-size: 11px;
                  font-weight: 700;
                  color: var(--p700);
                "
              >
                Edit ›
              </div>
            </div>
          </div>
          <div class="caption" style="margin: 10px 4px 0">
            Defaults work great — tap a card only if you want to tweak it.
          </div>
        </div>
      </div>
      <div class="createbar"><div class="createbtn">Create Habit</div></div>
    </div>
  </body>
</html>
