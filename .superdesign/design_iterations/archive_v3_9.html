<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archived Habits — Strength-First</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Literata:wght@700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'DM Sans', sans-serif !important;
    background: #F5F1ED !important;
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 0;
  }
  .app-shell {
    width: 390px;
    min-height: 100vh;
    background: #F5F1ED;
    position: relative;
    overflow-x: hidden;
  }

  /* Header */
  .archive-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 56px 20px 16px;
    background: #F5F1ED;
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .archive-header h1 {
    font-family: 'Literata', serif !important;
    font-size: 22px !important;
    font-weight: 700 !important;
    color: #2D2A26 !important;
    line-height: 1.2;
  }
  .header-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    background: transparent;
    border: none;
    cursor: pointer;
    color: #2D2A26;
    transition: background 0.15s;
  }
  .header-btn:hover { background: rgba(45,42,38,0.06); }

  /* Summary bar */
  .summary-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 16px 20px;
    margin: 0 20px 20px;
    box-shadow: 0 2px 8px rgba(45,42,38,0.06);
  }
  .summary-label {
    font-size: 13px;
    font-weight: 600;
    color: #6E6660;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .summary-value {
    font-size: 20px;
    font-weight: 700;
    color: #2D2A26;
  }
  .gradient-bar-bg {
    width: 100%;
    height: 8px;
    border-radius: 4px;
    background: #EDEAE5;
    overflow: hidden;
    position: relative;
  }
  .gradient-bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, #F43F5E 0%, #EAB308 25%, #14B8A6 50%, #10B981 75%, #A855F7 100%);
    transition: width 0.8s ease-out;
  }
  .gradient-bar-marker {
    position: absolute;
    top: -3px;
    width: 3px;
    height: 14px;
    border-radius: 2px;
    background: #2D2A26;
    transition: left 0.8s ease-out;
  }

  /* Habit cards */
  .card-list {
    padding: 0 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .habit-card {
    background: #FFFFFF;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 2px 8px rgba(45,42,38,0.06);
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(16px);
    animation: cardIn 0.4s ease-out forwards;
  }
  .habit-card:nth-child(1) { animation-delay: 0.1s; }
  .habit-card:nth-child(2) { animation-delay: 0.2s; }
  .habit-card:nth-child(3) { animation-delay: 0.3s; }
  .habit-card:nth-child(4) { animation-delay: 0.4s; }

  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Left accent bar */
  .accent-bar {
    position: absolute;
    left: 0;
    top: 16px;
    bottom: 16px;
    width: 4px;
    border-radius: 0 2px 2px 0;
  }

  /* Card top row: ring + info */
  .card-top {
    display: flex;
    align-items: center;
    gap: 16px;
    padding-left: 12px;
  }

  /* SVG Progress Ring */
  .ring-container {
    position: relative;
    width: 48px;
    height: 48px;
    flex-shrink: 0;
  }
  .ring-bg {
    fill: none;
    stroke: #EDEAE5;
    stroke-width: 4;
  }
  .ring-fg {
    fill: none;
    stroke-width: 4;
    stroke-linecap: round;
    transform: rotate(-90deg);
    transform-origin: center;
    transition: stroke-dashoffset 1s ease-out;
  }
  .ring-text {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    font-weight: 700;
    color: #2D2A26;
  }

  /* Info section */
  .card-info {
    flex: 1;
    min-width: 0;
  }
  .habit-name {
    font-size: 16px !important;
    font-weight: 600 !important;
    color: #2D2A26 !important;
    margin-bottom: 2px;
    line-height: 1.3;
  }
  .habit-date {
    font-size: 13px;
    color: #6E6660;
    margin-bottom: 8px;
  }

  /* Stat badges */
  .stat-badges {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 99px;
  }
  .badge-streak {
    background: #FEF3C7;
    color: #92400E;
  }
  .badge-completions {
    background: #DBEAFE;
    color: #1E40AF;
  }

  /* Resume button */
  .btn-resume {
    width: 100%;
    height: 44px;
    background: #059669 !important;
    color: #FFFFFF !important;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s, transform 0.1s;
  }
  .btn-resume:hover { background: #047857 !important; }
  .btn-resume:active { transform: scale(0.98); }

  /* Delete link */
  .delete-link {
    text-align: center;
  }
  .delete-link button {
    background: none;
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: #9CA3AF;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.15s;
  }
  .delete-link button:hover { color: #EF4444; }

  /* Ring draw animation */
  @keyframes ringDraw {
    from { stroke-dashoffset: var(--circumference); }
    to { stroke-dashoffset: var(--target-offset); }
  }
</style>
</head>
<body>
<div class="app-shell">

  <!-- Header -->
  <header class="archive-header">
    <button class="header-btn" aria-label="Go back">
      <i data-lucide="arrow-left" style="width:22px;height:22px;"></i>
    </button>
    <h1>Archived Habits</h1>
    <button class="header-btn" aria-label="Close">
      <i data-lucide="x" style="width:22px;height:22px;"></i>
    </button>
  </header>

  <!-- Summary Bar -->
  <div class="summary-card">
    <div class="summary-label">
      <span>Average Strength</span>
      <span class="summary-value" id="avgValue">57%</span>
    </div>
    <div class="gradient-bar-bg">
      <div class="gradient-bar-fill" id="gradientFill" style="width: 100%;"></div>
      <div class="gradient-bar-marker" id="avgMarker" style="left: 57%;"></div>
    </div>
  </div>

  <!-- Card List (sorted by strength, strongest first) -->
  <div class="card-list">

    <!-- Card 1: Meditation — 85% (purple tier) -->
    <div class="habit-card">
      <div class="accent-bar" style="background: #A855F7;"></div>
      <div class="card-top">
        <div class="ring-container">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" cx="24" cy="24" r="20"
              stroke="#A855F7"
              data-percent="85"
              style="stroke-dasharray: 125.66; stroke-dashoffset: 125.66;">
            </circle>
          </svg>
          <div class="ring-text">85%</div>
        </div>
        <div class="card-info">
          <div class="habit-name">Meditation</div>
          <div class="habit-date">Archived Dec 15, 2025</div>
          <div class="stat-badges">
            <span class="badge badge-streak">
              <i data-lucide="flame" style="width:12px;height:12px;"></i>
              42 day streak
            </span>
            <span class="badge badge-completions">
              <i data-lucide="check-circle" style="width:12px;height:12px;"></i>
              186 done
            </span>
          </div>
        </div>
      </div>
      <button class="btn-resume">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
        Resume Habit
      </button>
      <div class="delete-link">
        <button>delete permanently</button>
      </div>
    </div>

    <!-- Card 2: Morning Run — 62% (emerald tier) -->
    <div class="habit-card">
      <div class="accent-bar" style="background: #10B981;"></div>
      <div class="card-top">
        <div class="ring-container">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" cx="24" cy="24" r="20"
              stroke="#10B981"
              data-percent="62"
              style="stroke-dasharray: 125.66; stroke-dashoffset: 125.66;">
            </circle>
          </svg>
          <div class="ring-text">62%</div>
        </div>
        <div class="card-info">
          <div class="habit-name">Morning Run</div>
          <div class="habit-date">Archived Jan 3, 2026</div>
          <div class="stat-badges">
            <span class="badge badge-streak">
              <i data-lucide="flame" style="width:12px;height:12px;"></i>
              18 day streak
            </span>
            <span class="badge badge-completions">
              <i data-lucide="check-circle" style="width:12px;height:12px;"></i>
              94 done
            </span>
          </div>
        </div>
      </div>
      <button class="btn-resume">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
        Resume Habit
      </button>
      <div class="delete-link">
        <button>delete permanently</button>
      </div>
    </div>

    <!-- Card 3: Read 30 Minutes — 35% (yellow tier) -->
    <div class="habit-card">
      <div class="accent-bar" style="background: #EAB308;"></div>
      <div class="card-top">
        <div class="ring-container">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" cx="24" cy="24" r="20"
              stroke="#EAB308"
              data-percent="35"
              style="stroke-dasharray: 125.66; stroke-dashoffset: 125.66;">
            </circle>
          </svg>
          <div class="ring-text">35%</div>
        </div>
        <div class="card-info">
          <div class="habit-name">Read 30 Minutes</div>
          <div class="habit-date">Archived Feb 10, 2026</div>
          <div class="stat-badges">
            <span class="badge badge-streak">
              <i data-lucide="flame" style="width:12px;height:12px;"></i>
              7 day streak
            </span>
            <span class="badge badge-completions">
              <i data-lucide="check-circle" style="width:12px;height:12px;"></i>
              45 done
            </span>
          </div>
        </div>
      </div>
      <button class="btn-resume">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
        Resume Habit
      </button>
      <div class="delete-link">
        <button>delete permanently</button>
      </div>
    </div>

    <!-- Card 4: Journaling — 12% (rose tier) -->
    <div class="habit-card">
      <div class="accent-bar" style="background: #F43F5E;"></div>
      <div class="card-top">
        <div class="ring-container">
          <svg width="48" height="48" viewBox="0 0 48 48">
            <circle class="ring-bg" cx="24" cy="24" r="20"></circle>
            <circle class="ring-fg" cx="24" cy="24" r="20"
              stroke="#F43F5E"
              data-percent="12"
              style="stroke-dasharray: 125.66; stroke-dashoffset: 125.66;">
            </circle>
          </svg>
          <div class="ring-text">12%</div>
        </div>
        <div class="card-info">
          <div class="habit-name">Journaling</div>
          <div class="habit-date">Archived Mar 1, 2026</div>
          <div class="stat-badges">
            <span class="badge badge-streak">
              <i data-lucide="flame" style="width:12px;height:12px;"></i>
              3 day streak
            </span>
            <span class="badge badge-completions">
              <i data-lucide="check-circle" style="width:12px;height:12px;"></i>
              11 done
            </span>
          </div>
        </div>
      </div>
      <button class="btn-resume">
        <i data-lucide="play" style="width:16px;height:16px;"></i>
        Resume Habit
      </button>
      <div class="delete-link">
        <button>delete permanently</button>
      </div>
    </div>

  </div><!-- /card-list -->

</div><!-- /app-shell -->

<script>
  // Initialize Lucide icons
  lucide.createIcons();

  // Animate progress rings on load
  document.addEventListener('DOMContentLoaded', () => {
    const circumference = 2 * Math.PI * 20; // r=20
    const rings = document.querySelectorAll('.ring-fg');

    // Use requestAnimationFrame to ensure styles are applied before animating
    requestAnimationFrame(() => {
      rings.forEach((ring, index) => {
        const percent = parseInt(ring.getAttribute('data-percent'), 10);
        const targetOffset = circumference - (circumference * percent / 100);

        // Set initial state
        ring.style.strokeDasharray = circumference;
        ring.style.strokeDashoffset = circumference;

        // Trigger animation with staggered delay
        setTimeout(() => {
          ring.style.transition = 'stroke-dashoffset 1s ease-out';
          ring.style.strokeDashoffset = targetOffset;
        }, 200 + (index * 150));
      });
    });

    // Animate the average marker
    const marker = document.getElementById('avgMarker');
    marker.style.left = '0%';
    setTimeout(() => {
      marker.style.transition = 'left 0.8s ease-out';
      marker.style.left = '57%';
    }, 100);
  });
</script>
</body>
</html>
