# Security Scanning Workflow
# Implements RES-005: Automated security scanning in CI
# - npm audit for dependency vulnerabilities
# - CodeQL for static code analysis
# - Secret scanning via Gitleaks
# - License compliance checking

name: Security Scanning

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Mondays at 9:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================
  # Dependency Vulnerability Scanning
  # ============================================
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: |
          echo "## npm Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run audit and capture output
          npm audit --audit-level=high --json > audit-results.json 2>&1 || true

          # Count vulnerabilities
          CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit-results.json)
          HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit-results.json)
          MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit-results.json)
          LOW=$(jq '.metadata.vulnerabilities.low // 0' audit-results.json)

          echo "| Severity | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Critical | $CRITICAL |" >> $GITHUB_STEP_SUMMARY
          echo "| High | $HIGH |" >> $GITHUB_STEP_SUMMARY
          echo "| Moderate | $MODERATE |" >> $GITHUB_STEP_SUMMARY
          echo "| Low | $LOW |" >> $GITHUB_STEP_SUMMARY

          # image-size has no published patch (2.0.2 is latest) and only
          # arrives via Metro's local asset pipeline. Fail on other highs.
          if ACTIONABLE=$(node scripts/ci/count-actionable-audits.mjs < audit-results.json); then
            :
          else
            ACTIONABLE_CRITICAL=$(echo "$ACTIONABLE" | awk '{print $1}')
            ACTIONABLE_HIGH=$(echo "$ACTIONABLE" | awk '{print $2}')
            echo ""
            echo "::error::Found $ACTIONABLE_CRITICAL critical and $ACTIONABLE_HIGH high severity vulnerabilities with a published fix"
            npm audit --audit-level=high 2>&1 || true
            exit 1
          fi

          echo ""
          echo "✅ No critical or high severity vulnerabilities found" >> $GITHUB_STEP_SUMMARY

      - name: Upload audit results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: npm-audit-results
          path: audit-results.json
          retention-days: 30

  # ============================================
  # CodeQL Static Analysis
  # ============================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths:
              - src
              - convex
              - app
            paths-ignore:
              - node_modules
              - '**/*.test.ts'
              - '**/*.test.tsx'
              - '**/__tests__/**'
              - '**/__mocks__/**'
              - 'tests/**'

      - name: Autobuild
        uses: github/codeql-action/autobuild@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        with:
          category: '/language:javascript-typescript'

  # ============================================
  # Secret Scanning with Gitleaks
  # ============================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ============================================
  # OWASP Dependency Check
  # ============================================
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@75ba02d6183445fe0761d26e836bde58b1560600 # v1.1.0
        id: depcheck
        with:
          project: 'habit-tracking-app'
          path: '.'
          format: 'HTML,JSON,SARIF'
          args: >
            --scan package.json
            --scan package-lock.json
            --enableExperimental
            --nodeAuditSkipDevDependencies
            --failOnCVSS 7
        continue-on-error: true

      - name: Upload OWASP results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: owasp-dependency-check-results
          path: ${{ github.workspace }}/reports
          retention-days: 30

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a # v4.36.3
        if: always()
        with:
          sarif_file: ${{ github.workspace }}/reports/dependency-check-report.sarif
        continue-on-error: true

  # ============================================
  # License Compliance Check
  # ============================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check licenses
        run: |
          npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;0BSD;Unlicense;CC0-1.0;CC-BY-3.0;CC-BY-4.0;Python-2.0;PSF-2.0;BlueOak-1.0.0" --excludePackages "buffers@0.1.1" --summary
        continue-on-error: true

      - name: Generate license report
        run: |
          npx license-checker --production --json > license-report.json
          echo "## License Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "License report generated. See artifact for details." >> $GITHUB_STEP_SUMMARY

      - name: Upload license report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: license-report
          path: license-report.json
          retention-days: 30

  # ============================================
  # Security Summary
  # ============================================
  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql, secret-scanning, license-check]
    if: always()
    steps:
      - name: Generate Summary
        env:
          NPM_RESULT: ${{ needs.npm-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECRET_RESULT: ${{ needs.secret-scanning.result }}
          LICENSE_RESULT: ${{ needs.license-check.result }}
        run: |
          echo "# Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$NPM_RESULT" = "success" ]; then
            echo "| npm Audit | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| npm Audit | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$CODEQL_RESULT" = "success" ]; then
            echo "| CodeQL | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| CodeQL | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$SECRET_RESULT" = "success" ]; then
            echo "| Secret Scanning | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$SECRET_RESULT" = "skipped" ]; then
            echo "| Secret Scanning | ⏭️ Skipped |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Secret Scanning | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$LICENSE_RESULT" = "success" ]; then
            echo "| License Check | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| License Check | ⚠️ Review |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for failures
        env:
          NPM_RESULT: ${{ needs.npm-audit.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          SECRET_RESULT: ${{ needs.secret-scanning.result }}
        run: |
          if [ "$NPM_RESULT" = "failure" ] || [ "$CODEQL_RESULT" = "failure" ] || [ "$SECRET_RESULT" = "failure" ]; then
            echo "::error::One or more security checks failed. Please review the results."
            exit 1
          fi
