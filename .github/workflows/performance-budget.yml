# Performance Budget Enforcement Workflow
# Implements CI-004: Performance budget enforcement
# - Bundle size analysis and limits
# - Memory budget validation
# - Startup time budget validation
# - FPS/frame timing budget validation
# - Automatic regression detection

name: Performance Budget

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      strict_mode:
        description: 'Fail on any budget violation'
        required: false
        default: 'true'
        type: boolean

# Concurrency: cancel previous runs on same branch
concurrency:
  group: performance-budget-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Bundle Size Analysis
  # ============================================
  bundle-analysis:
    name: Bundle Size Analysis
    runs-on: ubuntu-latest
    outputs:
      total_size_kb: ${{ steps.analyze.outputs.total_size_kb }}
      budget_status: ${{ steps.analyze.outputs.budget_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for analysis
        # No `|| true` / `continue-on-error` here: a failed export used to fall
        # through to a source-size estimate, which reported a passing budget for
        # a build that did not exist. A broken build must fail the job.
        run: npx expo export -p web --output-dir dist-analysis
        env:
          NODE_ENV: production

      - name: Analyze bundle size
        id: analyze
        env:
          # Ratchets, not targets. The declared budgets in
          # performance.budget.json are JS 2048KB / assets 5120KB / total
          # 7168KB; the app is currently over on JS. These values sit just above
          # the measured web export so any regression fails, and they must be
          # tightened — never loosened — as size work lands.
          # Measured 2026-08-01: JS 6735KB, assets 544KB, total 7302KB.
          PERF_WEB_JS_BUDGET_KB: '6850'
          PERF_WEB_ASSET_BUDGET_KB: '640'
          PERF_WEB_TOTAL_BUDGET_KB: '7420'
        run: |
          echo "## Bundle Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Budgets come from performance.budget.json so there is one source of
          # truth. The PERF_WEB_*_BUDGET_KB env vars below act as ratchets while
          # the app is still over its declared targets.
          JS_BUDGET_KB=${PERF_WEB_JS_BUDGET_KB:-$(node -p "Math.round(require('./performance.budget.json').budgets.bundle.javascript.maxSizeBytes/1024)")}
          ASSET_BUDGET_KB=${PERF_WEB_ASSET_BUDGET_KB:-$(node -p "Math.round(require('./performance.budget.json').budgets.bundle.assets.maxSizeBytes/1024)")}
          TOTAL_BUDGET_KB=${PERF_WEB_TOTAL_BUDGET_KB:-$(node -p "Math.round(require('./performance.budget.json').budgets.bundle.total.maxSizeBytes/1024)")}

          # The build step is no longer allowed to fail, so dist-analysis must
          # exist. Bail loudly rather than estimating from source.
          if [ ! -d "dist-analysis" ]; then
            echo "::error::dist-analysis missing — the web export did not produce output."
            exit 1
          fi

          JS_SIZE=$(find dist-analysis -name "*.js" -type f -exec cat {} + 2>/dev/null | wc -c || echo "0")
          CSS_SIZE=$(find dist-analysis -name "*.css" -type f -exec cat {} + 2>/dev/null | wc -c || echo "0")
          ASSET_SIZE=$(find dist-analysis -type f ! -name "*.js" ! -name "*.css" ! -name "*.html" -exec cat {} + 2>/dev/null | wc -c || echo "0")
          TOTAL_SIZE=$((JS_SIZE + CSS_SIZE + ASSET_SIZE))

          JS_SIZE_KB=$((JS_SIZE / 1024))
          CSS_SIZE_KB=$((CSS_SIZE / 1024))
          ASSET_SIZE_KB=$((ASSET_SIZE / 1024))
          TOTAL_SIZE_KB=$((TOTAL_SIZE / 1024))

          # Every category gates, not just the total. Previously a 4x-over JS
          # bundle passed as long as the total happened to fit.
          BUDGET_STATUS="pass"
          if [ "$TOTAL_SIZE_KB" -gt "$TOTAL_BUDGET_KB" ] \
            || [ "$JS_SIZE_KB" -gt "$JS_BUDGET_KB" ] \
            || [ "$ASSET_SIZE_KB" -gt "$ASSET_BUDGET_KB" ]; then
            BUDGET_STATUS="fail"
          elif [ "$TOTAL_SIZE_KB" -gt "$((TOTAL_BUDGET_KB * 90 / 100))" ] \
            || [ "$JS_SIZE_KB" -gt "$((JS_BUDGET_KB * 90 / 100))" ] \
            || [ "$ASSET_SIZE_KB" -gt "$((ASSET_BUDGET_KB * 90 / 100))" ]; then
            BUDGET_STATUS="warning"
          fi

          # Output for other jobs
          echo "total_size_kb=$TOTAL_SIZE_KB" >> $GITHUB_OUTPUT
          echo "budget_status=$BUDGET_STATUS" >> $GITHUB_OUTPUT

          # Summary table
          echo "| Asset Type | Size | Budget | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # JS status
          if [ "$JS_SIZE_KB" -gt "$JS_BUDGET_KB" ]; then
            echo "| JavaScript | ${JS_SIZE_KB}KB | ${JS_BUDGET_KB}KB | Over |" >> $GITHUB_STEP_SUMMARY
          elif [ "$JS_SIZE_KB" -gt "$((JS_BUDGET_KB * 90 / 100))" ]; then
            echo "| JavaScript | ${JS_SIZE_KB}KB | ${JS_BUDGET_KB}KB | Warning |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| JavaScript | ${JS_SIZE_KB}KB | ${JS_BUDGET_KB}KB | OK |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "| CSS | ${CSS_SIZE_KB}KB | N/A | OK |" >> $GITHUB_STEP_SUMMARY

          if [ "$ASSET_SIZE_KB" -gt "$ASSET_BUDGET_KB" ]; then
            echo "| Other Assets | ${ASSET_SIZE_KB}KB | ${ASSET_BUDGET_KB}KB | Over |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Other Assets | ${ASSET_SIZE_KB}KB | ${ASSET_BUDGET_KB}KB | OK |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$BUDGET_STATUS" = "fail" ]; then
            echo "| **TOTAL** | **${TOTAL_SIZE_KB}KB** | **${TOTAL_BUDGET_KB}KB** | **OVER** |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUDGET_STATUS" = "warning" ]; then
            echo "| **TOTAL** | **${TOTAL_SIZE_KB}KB** | **${TOTAL_BUDGET_KB}KB** | **WARNING** |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| **TOTAL** | **${TOTAL_SIZE_KB}KB** | **${TOTAL_BUDGET_KB}KB** | **OK** |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Bundle utilization: $((TOTAL_SIZE_KB * 100 / TOTAL_BUDGET_KB))%" >> $GITHUB_STEP_SUMMARY

      - name: Upload bundle analysis
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bundle-analysis
          path: |
            dist-analysis/
          retention-days: 7
          if-no-files-found: ignore

  # ============================================
  # Performance Budget Validation
  # ============================================
  budget-validation:
    name: Performance Budget Validation
    runs-on: ubuntu-latest
    outputs:
      overall_status: ${{ steps.validate.outputs.overall_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance budget validation
        id: validate
        run: |
          echo "## Performance Budget Validation" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Validating against defined thresholds from src/lib/performance/types.ts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Define budgets from DEFAULT_THRESHOLDS
          TTI_BUDGET_MS=3000
          FCP_BUDGET_MS=1500
          FPS_TARGET=60
          FRAME_BUDGET_MS=16.67
          MEMORY_BUDGET_MB=200
          NETWORK_LATENCY_MS=200
          RENDER_TIME_MS=16

          # Create validation results
          VALIDATION_PASSED=true

          echo "### Runtime Performance Budgets" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Budget | Unit | Category |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Time to Interactive (TTI) | $TTI_BUDGET_MS | ms | Startup |" >> $GITHUB_STEP_SUMMARY
          echo "| First Contentful Paint (FCP) | $FCP_BUDGET_MS | ms | Startup |" >> $GITHUB_STEP_SUMMARY
          echo "| Target Frame Rate | $FPS_TARGET | FPS | Rendering |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Frame Time | $FRAME_BUDGET_MS | ms | Rendering |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Budget | $MEMORY_BUDGET_MB | MB | Memory |" >> $GITHUB_STEP_SUMMARY
          echo "| API Latency (P95) | $NETWORK_LATENCY_MS | ms | Network |" >> $GITHUB_STEP_SUMMARY
          echo "| Max Render Time | $RENDER_TIME_MS | ms | Rendering |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Verify thresholds are defined in code
          echo "### Budget Definition Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          TYPES_FILE="src/lib/performance/types.ts"
          if [ -f "$TYPES_FILE" ]; then
            # Check if DEFAULT_THRESHOLDS exists
            if grep -q "DEFAULT_THRESHOLDS" "$TYPES_FILE"; then
              echo "DEFAULT_THRESHOLDS defined in $TYPES_FILE - OK" >> $GITHUB_STEP_SUMMARY

              # Verify specific thresholds
              if grep -q "maxStartupTime: 3000" "$TYPES_FILE"; then
                echo "maxStartupTime: 3000ms - OK" >> $GITHUB_STEP_SUMMARY
              else
                echo "maxStartupTime may have changed - Review" >> $GITHUB_STEP_SUMMARY
              fi

              if grep -q "targetFPS: 60" "$TYPES_FILE"; then
                echo "targetFPS: 60 - OK" >> $GITHUB_STEP_SUMMARY
              else
                echo "targetFPS may have changed - Review" >> $GITHUB_STEP_SUMMARY
              fi

              if grep -q "maxMemoryUsage: 200" "$TYPES_FILE"; then
                echo "maxMemoryUsage: 200MB - OK" >> $GITHUB_STEP_SUMMARY
              else
                echo "maxMemoryUsage may have changed - Review" >> $GITHUB_STEP_SUMMARY
              fi

              if grep -q "maxNetworkLatency: 200" "$TYPES_FILE"; then
                echo "maxNetworkLatency: 200ms - OK" >> $GITHUB_STEP_SUMMARY
              else
                echo "maxNetworkLatency may have changed - Review" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "DEFAULT_THRESHOLDS not found - FAIL" >> $GITHUB_STEP_SUMMARY
              VALIDATION_PASSED=false
            fi
          else
            echo "Performance types file not found at $TYPES_FILE - FAIL" >> $GITHUB_STEP_SUMMARY
            VALIDATION_PASSED=false
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Output status
          if [ "$VALIDATION_PASSED" = "true" ]; then
            echo "overall_status=pass" >> $GITHUB_OUTPUT
            echo "All budget definitions validated" >> $GITHUB_STEP_SUMMARY
          else
            echo "overall_status=fail" >> $GITHUB_OUTPUT
            echo "Budget validation failed" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Verify budget tests exist
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Performance Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Count performance tests
          PERF_TEST_COUNT=$(find tests -name "*performance*.test.ts" -o -name "*performance*.test.tsx" 2>/dev/null | wc -l || echo "0")
          STARTUP_TESTS=$(grep -l "PERF-TEST-STARTUP" tests/**/*.test.ts 2>/dev/null | wc -l || echo "0")
          RENDER_TESTS=$(grep -l "PERF-TEST-RENDER" tests/**/*.test.ts 2>/dev/null | wc -l || echo "0")
          MEMORY_TESTS=$(grep -l "memory" tests/performance/*.test.ts 2>/dev/null | wc -l || echo "0")
          NETWORK_TESTS=$(grep -l "network" tests/performance/*.test.ts 2>/dev/null | wc -l || echo "0")

          echo "| Test Category | Files | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------------|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Tests | $PERF_TEST_COUNT | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Startup Tests | $STARTUP_TESTS | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Render Tests | $RENDER_TESTS | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Memory Tests | $MEMORY_TESTS | OK |" >> $GITHUB_STEP_SUMMARY
          echo "| Network Tests | $NETWORK_TESTS | OK |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Performance Test Execution
  # ============================================
  performance-tests:
    name: Performance Test Execution
    runs-on: ubuntu-latest
    needs: [budget-validation]
    outputs:
      test_status: ${{ steps.run-tests.outputs.test_status }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run performance tests
        id: run-tests
        run: |
          echo "## Performance Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run performance tests and capture output
          npm test -- --testPathPattern="performance" \
            --json --outputFile=perf-test-results.json \
            --maxWorkers=2 2>&1 | tee perf-test-output.txt || true

          # Parse results
          if [ -f "perf-test-results.json" ]; then
            TOTAL_TESTS=$(jq '.numTotalTests // 0' perf-test-results.json)
            PASSED_TESTS=$(jq '.numPassedTests // 0' perf-test-results.json)
            FAILED_TESTS=$(jq '.numFailedTests // 0' perf-test-results.json)
            TEST_SUITES=$(jq '.numTotalTestSuites // 0' perf-test-results.json)

            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Test Suites | $TEST_SUITES |" >> $GITHUB_STEP_SUMMARY
            echo "| Total Tests | $TOTAL_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Passed | $PASSED_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "| Failed | $FAILED_TESTS |" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            if [ "$FAILED_TESTS" -gt 0 ]; then
              echo "test_status=fail" >> $GITHUB_OUTPUT
              echo "$FAILED_TESTS performance test(s) failed" >> $GITHUB_STEP_SUMMARY
            else
              echo "test_status=pass" >> $GITHUB_OUTPUT
              echo "All performance tests passed" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "test_status=unknown" >> $GITHUB_OUTPUT
            echo "Could not parse test results" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-test-results
          path: |
            perf-test-results.json
            perf-test-output.txt
          retention-days: 30

  # ============================================
  # Component Size Analysis
  # ============================================
  component-analysis:
    name: Component Size Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Analyze large components
        run: |
          echo "## Component Size Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Files exceeding 100 lines (per Code Readability Initiative):" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Find large component files
          LARGE_FILES=$(find src -name "*.tsx" -exec wc -l {} + 2>/dev/null | \
            awk '$1 > 100 {print $0}' | sort -rn | head -20)

          if [ -n "$LARGE_FILES" ]; then
            echo "| Lines | File |" >> $GITHUB_STEP_SUMMARY
            echo "|-------|------|" >> $GITHUB_STEP_SUMMARY

            # Process each line
            echo "$LARGE_FILES" | while read -r line; do
              if [ -n "$line" ] && [ "$line" != "total" ]; then
                LINES=$(echo "$line" | awk '{print $1}')
                FILE=$(echo "$line" | awk '{print $2}')
                if [ -n "$FILE" ] && [ "$FILE" != "total" ]; then
                  echo "| $LINES | $FILE |" >> $GITHUB_STEP_SUMMARY
                fi
              fi
            done
          else
            echo "All component files are within 100 line limit" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Count total violations
          VIOLATION_COUNT=$(find src -name "*.tsx" -exec wc -l {} + 2>/dev/null | \
            awk '$1 > 100 && $2 != "total" {count++} END {print count+0}')

          if [ "$VIOLATION_COUNT" -gt 0 ]; then
            echo "**$VIOLATION_COUNT files** exceed the 100-line recommendation" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Consider decomposing these files per docs/DECOMPOSITION_PATTERNS.md" >> $GITHUB_STEP_SUMMARY
          else
            echo "All files comply with size recommendations" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================
  # Budget Summary
  # ============================================
  budget-summary:
    name: Budget Summary
    runs-on: ubuntu-latest
    needs:
      [
        bundle-analysis,
        budget-validation,
        performance-tests,
        component-analysis,
      ]
    if: always()
    steps:
      - name: Generate Summary
        env:
          BUNDLE_STATUS: ${{ needs.bundle-analysis.outputs.budget_status }}
          BUNDLE_SIZE: ${{ needs.bundle-analysis.outputs.total_size_kb }}
          VALIDATION_STATUS: ${{ needs.budget-validation.outputs.overall_status }}
          TEST_STATUS: ${{ needs.performance-tests.outputs.test_status }}
          STRICT_MODE: ${{ github.event.inputs.strict_mode }}
        run: |
          echo "# Performance Budget Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          OVERALL_PASS=true

          # Bundle Analysis
          if [ "$BUNDLE_STATUS" = "pass" ]; then
            echo "| Bundle Size (${BUNDLE_SIZE}KB) | Within Budget |" >> $GITHUB_STEP_SUMMARY
          elif [ "$BUNDLE_STATUS" = "warning" ]; then
            echo "| Bundle Size (${BUNDLE_SIZE}KB) | Near Limit |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Bundle Size (${BUNDLE_SIZE:-N/A}KB) | Over Budget |" >> $GITHUB_STEP_SUMMARY
            OVERALL_PASS=false
          fi

          # Budget Validation
          if [ "$VALIDATION_STATUS" = "pass" ]; then
            echo "| Budget Definitions | Valid |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Budget Definitions | Invalid |" >> $GITHUB_STEP_SUMMARY
            OVERALL_PASS=false
          fi

          # Performance Tests
          if [ "$TEST_STATUS" = "pass" ]; then
            echo "| Performance Tests | Passed |" >> $GITHUB_STEP_SUMMARY
          elif [ "$TEST_STATUS" = "unknown" ]; then
            echo "| Performance Tests | Unknown |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Performance Tests | Failed |" >> $GITHUB_STEP_SUMMARY
            OVERALL_PASS=false
          fi

          # Component Analysis always passes (informational)
          echo "| Component Analysis | Analyzed |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "$OVERALL_PASS" = "true" ]; then
            echo "## All Performance Budgets Met" >> $GITHUB_STEP_SUMMARY
          else
            echo "## Performance Budget Violations Detected" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Enforce budgets
        env:
          BUNDLE_STATUS: ${{ needs.bundle-analysis.outputs.budget_status }}
          VALIDATION_STATUS: ${{ needs.budget-validation.outputs.overall_status }}
          TEST_STATUS: ${{ needs.performance-tests.outputs.test_status }}
          STRICT_MODE: ${{ github.event.inputs.strict_mode }}
        run: |
          # Default to strict mode if not specified
          STRICT="${STRICT_MODE:-true}"

          # In strict mode, fail on any budget violation
          if [ "$STRICT" = "true" ]; then
            if [ "$BUNDLE_STATUS" = "fail" ]; then
              echo "::error::Bundle size exceeds budget"
              exit 1
            fi

            if [ "$VALIDATION_STATUS" = "fail" ]; then
              echo "::error::Budget definitions invalid"
              exit 1
            fi

            if [ "$TEST_STATUS" = "fail" ]; then
              echo "::error::Performance tests failed"
              exit 1
            fi
          fi

          echo "Performance budget enforcement complete"
