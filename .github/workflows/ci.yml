name: Code Quality CI
on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  check-duplicates:
    runs-on: ubuntu-latest
    name: Check for Duplicate Files
    steps:
      - uses: actions/checkout@v4

      - name: Detect numbered duplicates
        run: |
          DUPLICATES=$(find src -name "* 2.*" -o -name "* 3.*" -o -name "* 4.*")
          if [ -n "$DUPLICATES" ]; then
            echo "❌ Found duplicate files:"
            echo "$DUPLICATES"
            exit 1
          fi
          echo "✅ No duplicate files found"

  typescript:
    runs-on: ubuntu-latest
    name: TypeScript Compilation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compilation
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    name: Test Suite
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests --maxWorkers=2

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()

  # ============================================
  # Security Tests (CI-001)
  # Dedicated job for security test execution
  # ============================================
  security-tests:
    runs-on: ubuntu-latest
    name: Security Tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Security Tests
        id: security-tests
        run: |
          echo "## Security Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Run security-specific tests with coverage
          npm test -- --testPathPattern="security" --coverage --coverageReporters=json-summary --coverageReporters=text --maxWorkers=2 2>&1 | tee security-test-output.txt

          # Parse test results for summary
          TESTS_PASSED=$(grep -oP 'Tests:\s+\K\d+ passed' security-test-output.txt || echo "0 passed")
          TESTS_TOTAL=$(grep -oP 'Tests:\s+.*,\s+\K\d+ total' security-test-output.txt || echo "0 total")

          echo "| Category | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Passed | $TESTS_PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| Tests Total | $TESTS_TOTAL |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check if any tests failed
          if grep -q "FAIL" security-test-output.txt; then
            echo "::error::Security tests failed. See details above."
            echo "❌ **Security tests failed** - review required before merge" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "✅ All security tests passed" >> $GITHUB_STEP_SUMMARY

      - name: Security Test Coverage Report
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Security Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f "coverage/coverage-summary.json" ]; then
            LINES=$(jq '.total.lines.pct // 0' coverage/coverage-summary.json)
            STATEMENTS=$(jq '.total.statements.pct // 0' coverage/coverage-summary.json)
            FUNCTIONS=$(jq '.total.functions.pct // 0' coverage/coverage-summary.json)
            BRANCHES=$(jq '.total.branches.pct // 0' coverage/coverage-summary.json)

            echo "| Metric | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|----------|" >> $GITHUB_STEP_SUMMARY
            echo "| Lines | ${LINES}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Statements | ${STATEMENTS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Functions | ${FUNCTIONS}% |" >> $GITHUB_STEP_SUMMARY
            echo "| Branches | ${BRANCHES}% |" >> $GITHUB_STEP_SUMMARY
          else
            echo "Coverage data not available" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload security test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-test-results
          path: |
            security-test-output.txt
            coverage/
          retention-days: 30

  # ============================================
  # CI Summary
  # ============================================
  ci-summary:
    runs-on: ubuntu-latest
    name: CI Summary
    needs: [check-duplicates, typescript, tests, security-tests]
    if: always()
    steps:
      - name: Generate Summary
        env:
          DUPLICATES_RESULT: ${{ needs.check-duplicates.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
        run: |
          echo "# CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "$DUPLICATES_RESULT" = "success" ]; then
            echo "| Duplicate Files | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Duplicate Files | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TYPESCRIPT_RESULT" = "success" ]; then
            echo "| TypeScript | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| TypeScript | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$TESTS_RESULT" = "success" ]; then
            echo "| Test Suite | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Test Suite | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$SECURITY_RESULT" = "success" ]; then
            echo "| Security Tests | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Security Tests | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for failures
        env:
          DUPLICATES_RESULT: ${{ needs.check-duplicates.result }}
          TYPESCRIPT_RESULT: ${{ needs.typescript.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          SECURITY_RESULT: ${{ needs.security-tests.result }}
        run: |
          if [ "$DUPLICATES_RESULT" = "failure" ] || \
             [ "$TYPESCRIPT_RESULT" = "failure" ] || \
             [ "$TESTS_RESULT" = "failure" ] || \
             [ "$SECURITY_RESULT" = "failure" ]; then
            echo "::error::One or more CI checks failed. Please review the results."
            exit 1
          fi
