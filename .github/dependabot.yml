# Dependabot Configuration
# Part of RES-005: Automated security scanning
# Automatically opens PRs for dependency updates

version: 2
updates:
  # NPM dependencies
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 10
    reviewers:
      - 'habit-app-team'
    labels:
      - 'dependencies'
      - 'security'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      # Group React Native ecosystem updates
      react-native:
        patterns:
          - 'react-native*'
          - 'expo*'
          - '@expo/*'
          - '@react-native*'
        update-types:
          - 'minor'
          - 'patch'
      # Group testing dependencies
      testing:
        patterns:
          - 'jest*'
          - '@testing-library/*'
          - '@types/jest'
        update-types:
          - 'minor'
          - 'patch'
      # Group linting dependencies
      linting:
        patterns:
          - 'eslint*'
          - 'prettier*'
          - 'typescript-eslint'
        update-types:
          - 'minor'
          - 'patch'
      # Group development tools
      dev-tools:
        patterns:
          - 'typescript'
          - 'husky'
          - 'lint-staged'
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Ignore major version updates for core dependencies
      # These require manual review and testing
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'convex'
        update-types: ['version-update:semver-major']

  # GitHub Actions dependencies
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '09:00'
      timezone: 'UTC'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci(deps)'
