<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainDay - Habit Strength</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5), 0 30px 60px -30px rgba(0,0,0,0.6);
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
            border-radius: 45px;
            overflow: hidden;
            position: relative;
        }
        .status-bar {
            height: 54px;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            padding-top: 10px;
        }
        .status-bar span {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .header {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            padding: 24px;
            padding-top: 10px;
            color: white;
        }
        .back-btn {
            font-size: 24px;
            margin-bottom: 16px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .header p {
            font-size: 17px;
            opacity: 0.9;
        }
        .content {
            padding: 24px;
        }
        .habit-card {
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }
        .habit-header {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }
        .habit-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }
        .habit-name {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a1a;
        }
        .strength-section {
            margin-bottom: 24px;
        }
        .strength-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .strength-label {
            font-size: 15px;
            font-weight: 600;
            color: #666;
        }
        .strength-value {
            font-size: 28px;
            font-weight: 700;
            color: #f5576c;
        }
        .strength-bar {
            height: 12px;
            background: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
        }
        .strength-fill {
            height: 100%;
            background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%);
            border-radius: 6px;
            width: 0%;
            transition: width 1s ease-out;
        }
        .strength-fill.animate {
            width: 87%;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }
        .stat-item {
            background: #fafafa;
            border-radius: 14px;
            padding: 16px;
            text-align: center;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #f5576c;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 13px;
            color: #666;
            font-weight: 500;
        }
        .insight {
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border-radius: 14px;
            padding: 16px;
            margin-top: 20px;
            display: flex;
            gap: 12px;
        }
        .insight-icon {
            font-size: 24px;
        }
        .insight-text {
            flex: 1;
        }
        .insight-title {
            font-size: 14px;
            font-weight: 700;
            color: #92400e;
            margin-bottom: 4px;
        }
        .insight-desc {
            font-size: 13px;
            color: #b45309;
            line-height: 1.4;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
            border-top: 1px solid #f5f5f5;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100% 🔋</span>
            </div>
            <div class="header">
                <div class="back-btn">←</div>
                <h1>Habit Strength</h1>
                <p>Morning Meditation</p>
            </div>
            <div class="content">
                <div class="habit-card">
                    <div class="habit-header">
                        <div class="habit-icon">🧘</div>
                        <div class="habit-name">Morning Meditation</div>
                    </div>
                    <div class="strength-section">
                        <div class="strength-header">
                            <span class="strength-label">Overall Strength</span>
                            <span class="strength-value">87%</span>
                        </div>
                        <div class="strength-bar">
                            <div class="strength-fill animate"></div>
                        </div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value">21</div>
                            <div class="stat-label">Day Streak</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">95%</div>
                            <div class="stat-label">Completion</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">42</div>
                            <div class="stat-label">Total Days</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value">6</div>
                            <div class="stat-label">Week Streak</div>
                        </div>
                    </div>
                    <div class="insight">
                        <div class="insight-icon">💡</div>
                        <div class="insight-text">
                            <div class="insight-title">Excellent Progress!</div>
                            <div class="insight-desc">Your habit is strengthening. Keep this momentum - you're in the top 15%!</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom-nav">
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13zm7 7v-5h4v5h-4zm2-15.586 6 6V20h-3v-5c0-1.103-.897-2-2-2h-4c-1.103 0-2 .897-2 2v5H6v-9.586l6-6z"/></svg>
                    <span>Home</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/></svg>
                    <span>Stats</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/></svg>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
