<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainDay - Streak Celebration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5), 0 30px 60px -30px rgba(0,0,0,0.6);
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #1a1a1a 0%, #2d2d2d 100%);
            border-radius: 45px;
            overflow: hidden;
            position: relative;
        }
        .celebration {
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
            color: white;
        }
        .icon-large {
            font-size: 120px;
            margin-bottom: 24px;
            animation: bounce 1s ease infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .celebration h1 {
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .celebration p {
            font-size: 20px;
            color: #999;
            margin-bottom: 40px;
        }
        .streak-number {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
            margin-bottom: 16px;
        }
        .streak-label {
            font-size: 24px;
            font-weight: 600;
            color: #fff;
            margin-bottom: 40px;
        }
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
        }
        .stat-box {
            background: rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 20px 30px;
            backdrop-filter: blur(10px);
        }
        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: #f5576c;
        }
        .stat-label {
            font-size: 13px;
            color: #999;
            margin-top: 4px;
        }
        .message {
            font-size: 18px;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 40px;
            max-width: 280px;
        }
        .continue-btn {
            padding: 18px 48px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(245, 87, 108, 0.4);
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-radius: 50%;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(800px) rotate(720deg);
                opacity: 0;
            }
        }
        .confetti:nth-child(1) { left: 10%; animation-delay: 0s; background: #f093fb; }
        .confetti:nth-child(2) { left: 20%; animation-delay: 0.3s; background: #f5576c; }
        .confetti:nth-child(3) { left: 30%; animation-delay: 0.6s; background: #667eea; }
        .confetti:nth-child(4) { left: 40%; animation-delay: 0.9s; background: #764ba2; }
        .confetti:nth-child(5) { left: 50%; animation-delay: 1.2s; background: #f093fb; }
        .confetti:nth-child(6) { left: 60%; animation-delay: 1.5s; background: #f5576c; }
        .confetti:nth-child(7) { left: 70%; animation-delay: 1.8s; background: #667eea; }
        .confetti:nth-child(8) { left: 80%; animation-delay: 2.1s; background: #764ba2; }
        .confetti:nth-child(9) { left: 90%; animation-delay: 2.4s; background: #f093fb; }
        .confetti:nth-child(10) { left: 15%; animation-delay: 0.2s; background: #f5576c; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="confetti"></div>
            <div class="celebration">
                <div class="icon-large">🔥</div>
                <h1>AMAZING!</h1>
                <p>You just completed your habit</p>
                <div class="streak-number">21</div>
                <div class="streak-label">Day Streak! 🏆</div>
                <div class="stats-row">
                    <div class="stat-box">
                        <div class="stat-value">100%</div>
                        <div class="stat-label">This Week</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value">3</div>
                        <div class="stat-label">Weeks</div>
                    </div>
                </div>
                <p class="message">You're unstoppable! Three weeks of consistency builds a habit that lasts a lifetime. Keep going!</p>
                <button class="continue-btn">Continue</button>
            </div>
        </div>
    </div>
</body>
</html>
