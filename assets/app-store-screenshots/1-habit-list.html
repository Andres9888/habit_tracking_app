<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChainDay - Habit List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px;
        }
        .phone-frame {
            width: 393px;
            height: 852px;
            background: #000;
            border-radius: 55px;
            padding: 12px;
            box-shadow: 0 50px 100px -20px rgba(0,0,0,0.5), 0 30px 60px -30px rgba(0,0,0,0.6);
            position: relative;
        }
        .phone-frame::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 35px;
            background: #000;
            border-radius: 20px;
            z-index: 10;
        }
        .screen {
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, #fafafa 0%, #f5f5f5 100%);
            border-radius: 45px;
            overflow: hidden;
            position: relative;
        }
        .status-bar {
            height: 54px;
            background: #fafafa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            padding-top: 10px;
        }
        .status-bar span {
            font-size: 14px;
            font-weight: 600;
            color: #1a1a1a;
        }
        .header {
            background: #fafafa;
            padding: 20px 24px;
            padding-top: 10px;
        }
        .header h1 {
            font-size: 34px;
            font-weight: 700;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 17px;
            color: #666;
        }
        .date-selector {
            display: flex;
            gap: 12px;
            padding: 0 24px;
            margin-top: 20px;
            margin-bottom: 20px;
        }
        .date-item {
            width: 48px;
            height: 72px;
            background: white;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .date-item.active {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: white;
        }
        .date-item .day {
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 4px;
        }
        .date-item .date {
            font-size: 22px;
            font-weight: 700;
        }
        .habits-list {
            padding: 0 20px;
        }
        .habit-item {
            background: white;
            border-radius: 16px;
            padding: 20px 18px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
        }
        .habit-icon {
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }
        .habit-info {
            flex: 1;
        }
        .habit-name {
            font-size: 17px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 4px;
        }
        .habit-streak {
            font-size: 13px;
            color: #059669;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .habit-chain {
            display: flex;
            gap: 4px;
            margin-right: 8px;
        }
        .chain-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #059669;
        }
        .chain-dot.incomplete {
            background: #e5e7eb;
        }
        .habit-checkbox {
            width: 32px;
            height: 32px;
            border: 2.5px solid #059669;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .habit-checkbox.checked {
            background: #059669;
            color: white;
        }
        .habit-checkbox svg {
            width: 18px;
            height: 18px;
        }
        .floating-btn {
            position: absolute;
            bottom: 100px;
            right: 24px;
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(5, 150, 105, 0.4);
            color: white;
            font-size: 28px;
            font-weight: 300;
        }
        .bottom-nav {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 80px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: 20px;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: #666;
        }
        .nav-item.active {
            color: #059669;
        }
        .nav-item svg {
            width: 24px;
            height: 24px;
        }
        .nav-item span {
            font-size: 11px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="screen">
            <div class="status-bar">
                <span>9:41</span>
                <span>100% 🔋</span>
            </div>
            <div class="header">
                <h1>Today</h1>
                <p>Tuesday, Feb 18</p>
            </div>
            <div class="date-selector">
                <div class="date-item">
                    <span class="day">Mon</span>
                    <span class="date">17</span>
                </div>
                <div class="date-item active">
                    <span class="day">Tue</span>
                    <span class="date">18</span>
                </div>
                <div class="date-item">
                    <span class="day">Wed</span>
                    <span class="date">19</span>
                </div>
                <div class="date-item">
                    <span class="day">Thu</span>
                    <span class="date">20</span>
                </div>
                <div class="date-item">
                    <span class="day">Fri</span>
                    <span class="date">21</span>
                </div>
            </div>
            <div class="habits-list">
                <div class="habit-item">
                    <div class="habit-icon">🏃</div>
                    <div class="habit-info">
                        <div class="habit-name">Morning Run</div>
                        <div class="habit-streak">
                            <div class="habit-chain">
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                            </div>
                            7 day streak 🔥
                        </div>
                    </div>
                    <div class="habit-checkbox">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
                <div class="habit-item">
                    <div class="habit-icon">🧘</div>
                    <div class="habit-info">
                        <div class="habit-name">Meditation</div>
                        <div class="habit-streak">
                            <div class="habit-chain">
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot incomplete"></div>
                            </div>
                            4 day streak
                        </div>
                    </div>
                    <div class="habit-checkbox"></div>
                </div>
                <div class="habit-item">
                    <div class="habit-icon">📚</div>
                    <div class="habit-info">
                        <div class="habit-name">Read 30 mins</div>
                        <div class="habit-streak">
                            <div class="habit-chain">
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                            </div>
                            3 day streak
                        </div>
                    </div>
                    <div class="habit-checkbox checked">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
                <div class="habit-item">
                    <div class="habit-icon">💧</div>
                    <div class="habit-info">
                        <div class="habit-name">Drink 8 glasses</div>
                        <div class="habit-streak">
                            <div class="habit-chain">
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                                <div class="chain-dot"></div>
                            </div>
                            9 day streak 🏆
                        </div>
                    </div>
                    <div class="habit-checkbox checked">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                            <path d="M5 13l4 4L19 7"></path>
                        </svg>
                    </div>
                </div>
            </div>
            <div class="floating-btn">+</div>
            <div class="bottom-nav">
                <div class="nav-item active">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h1v7c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-7h1a1 1 0 0 0 .707-1.707l-9-9a.999.999 0 0 0-1.414 0l-9 9A1 1 0 0 0 3 13zm7 7v-5h4v5h-4zm2-15.586 6 6V20h-3v-5c0-1.103-.897-2-2-2h-4c-1.103 0-2 .897-2 2v5H6v-9.586l6-6z"/></svg>
                    <span>Home</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/></svg>
                    <span>Stats</span>
                </div>
                <div class="nav-item">
                    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.486 2 2 6.486 2 12s4.486 10 10 10 10-4.486 10-10S17.514 2 12 2zm0 18c-4.411 0-8-3.589-8-8s3.589-8 8-8 8 3.589 8 8-3.589 8-8 8z"/></svg>
                    <span>Profile</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
