appId: com.chainday.app
name: Native Permission Surfaces
tags:
  - regression
  - native
onFlowComplete:
  - takeScreenshot: e2e-08-native-permissions-complete
---
- runFlow: _shared/launch-signed-in.yaml
- tapOn:
    id: habit-card
- extendedWaitUntil:
    visible: Calendar
    timeout: 5000
- scrollUntilVisible:
    element:
      text: "(Vision Board|Voice Notes|Your Why)"
    direction: DOWN
    timeout: 8000
- assertVisible:
    text: "(Vision Board|Voice Notes|Your Why)"
- scrollUntilVisible:
    element:
      text: "(Add your first image|Take a photo|Choose from library|Record Your Day 1|New Recording|Start recording)"
    direction: DOWN
    timeout: 8000
- assertVisible:
    text: "(Add your first image|Take a photo|Choose from library|Record Your Day 1|New Recording|Start recording)"
