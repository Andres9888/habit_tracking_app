- launchApp:
    appId: com.chainday.app
    clearState: false
    clearKeychain: false
- extendedWaitUntil:
    visible: Today
    timeout: 15000
- waitForAnimationToEnd
- assertVisible:
    id: home-create-habit-fab
- assertVisible:
    id: settings-button
- assertVisible:
    id: home-templates-button
